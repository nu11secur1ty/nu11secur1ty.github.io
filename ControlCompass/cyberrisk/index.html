<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Risk · Cybersecurity Compass</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Helvetica Neue', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', 'Noto Sans JP', Meiryo, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }

    .page-title {
      position: fixed;
      top: 30px;
      left: 36px;
      z-index: 10;
      user-select: none;
      max-width: 480px;
      pointer-events: none;
    }
    .page-title .eyebrow {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.24em;
      color: #888;
      margin-bottom: 18px;
      pointer-events: auto;
    }
    .page-title .main {
      font-size: clamp(24px, 2.8vw, 36px);
      font-weight: 400;
      color: #FFFFFF;
      line-height: 1.12;
      letter-spacing: -0.005em;
      margin-bottom: 16px;
      pointer-events: auto;
    }
    .page-title .main em {
      font-style: normal;
      color: #C4322B;
      font-weight: 500;
    }
    .page-title .acronym {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.34em;
      color: #C4322B;
      text-decoration: none;
      padding: 5px 12px 4px 14px;
      border: 1px solid rgba(196, 50, 43, 0.4);
      border-radius: 3px;
      pointer-events: auto;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .page-title a.acronym:hover {
      color: #FFFFFF;
      border-color: #C4322B;
      background-color: #C4322B;
    }
    /* Row holding the framework badges (CRML, CyberRiskOps) */
    .page-title .acronym-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .svg-wrap {
      position: relative;
      width: 100%;
      max-width: min(94vw, calc((100vh - 170px) * 16 / 9));
      aspect-ratio: 16 / 9;
    }

    .svg-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Single info panel pinned to the bottom of the diagram. Each label, when hovered, populates this box rather than spawning a tooltip near the cursor. When a bottom-half label is hovered, the panel flips to the top to keep clear of the cursor. */
    .info-panel {
      position: absolute;
      bottom: 4%;
      left: 50%;
      width: clamp(300px, 60%, 720px);
      background: rgba(12, 12, 12, 0.96);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 18px 28px 16px;
      color: #d8d8d8;
      font-size: 17px;
      line-height: 1.55;
      z-index: 20;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.7);
      opacity: 0;
      transform: translate(-50%, 12px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease, border-color 0.25s ease, top 0.25s ease, bottom 0.25s ease;
    }
    .info-panel.visible {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }
    .info-panel.top {
      bottom: auto;
      top: 4%;
      transform: translate(-50%, -12px);
    }
    .info-panel.top.visible {
      transform: translate(-50%, 0);
    }
    .info-panel h3 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 900;
    }
    .info-panel p {
      margin: 0;
      color: #d0d0d0;
    }
    .info-panel .source {
      margin-top: 10px;
      font-size: 9.5px;
      letter-spacing: 1.5px;
      color: #5e5e5e;
      text-transform: uppercase;
      font-weight: 700;
    }
    .info-close {
      position: absolute;
      top: 6px;
      right: 10px;
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 4px 8px;
      font-family: inherit;
      transition: color 0.15s ease;
    }
    .info-close:hover { color: #fff; }

    /* Smooth fill transition on the circles and lens overlays */
    #cyberRiskSvg circle,
    #cyberRiskSvg .lens {
      transition: fill-opacity 0.35s ease;
    }

    /* Labels themselves transition smoothly when their colour changes */
    #cyberRiskSvg .hot-label {
      transition: fill 0.35s ease;
    }

    /* Outer labels turn white while the cursor is on their section (driven by JS via .label-hover,
       since the actual pointer target is now the invisible hit-region shape, not the text itself) */
    #cyberRiskSvg #threatLabel.label-hover,
    #cyberRiskSvg #vulnerabilityLabel.label-hover,
    #cyberRiskSvg #consequenceLabel.label-hover {
      fill: #FFFFFF;
    }

    /* Heartbeat pulse on the Cyber Risk centre while the cursor is on the centre label */
    @keyframes cyberRiskPulse {
      0%, 100% { fill-opacity: 0; }
      50%      { fill-opacity: 0.55; }
    }
    #cyberRiskPulse {
      transition: fill-opacity 0.35s ease;
    }
    #cyberRiskPulse.pulsing {
      animation: cyberRiskPulse 1.5s ease-in-out infinite;
    }

    /* Labels are purely visual now; the invisible .hit-region shapes beneath them own all pointer interaction */
    .hot-label {
      cursor: default;
      pointer-events: none;
    }

    /* Hit regions cover each full section (circle / lens / centre) so hovering or tapping anywhere
       in that area — not just on the text — triggers the tooltip and wash. Inert until the intro
       animation finishes (the script adds .active after the timeline ends, and removes it again
       whenever Replay is pressed). */
    .hit-region {
      fill: transparent;
      pointer-events: none;
    }
    .hit-region.active {
      cursor: pointer;
      pointer-events: all;
    }

    .controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    button.replay {
      background: transparent;
      border: 1.5px solid #444;
      color: #ccc;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 11px 24px;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    button.replay:hover { border-color: #F19A38; color: #F19A38; }
    button.replay:active { transform: scale(0.97); }

    .credit {
      position: absolute;
      bottom: 28px;
      left: 32px;
    }
    .credit-eyebrow {
      font-size: 9px;
      letter-spacing: 2.5px;
      color: #5a5a5a;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 1px;
      line-height: 1.2;
    }
    .credit-name {
      font-size: 11px;
      color: #888;
      font-weight: 400;
      text-decoration: none;
      display: inline-block;
      line-height: 1.2;
      transition: color 0.2s ease;
    }
    .credit-name:hover,
    .credit-name:focus-visible {
      color: #d0d0d0;
      outline: none;
    }

    .reference {
      position: absolute;
      bottom: 28px;
      right: 32px;
      text-align: right;
      max-width: 400px;
    }
    .reference-eyebrow {
      font-size: 9px;
      letter-spacing: 2.5px;
      color: #5a5a5a;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 1px;
      line-height: 1.2;
    }
    .reference a {
      display: block;
      color: #888;
      text-decoration: none;
      font-weight: 400;
      line-height: 1.3;
      transition: color 0.2s ease;
    }
    .reference a:hover,
    .reference a:focus-visible {
      color: #d0d0d0;
      outline: none;
    }
    .reference-title { font-size: 11px; }
    .reference-doi   { font-size: 10px; color: #6e6e6e !important; margin-top: 1px; }

    /* Language selector (top-right) — dropdown menu */
    .lang-selector {
      position: fixed;
      top: 22px;
      right: 28px;
      z-index: 30;
      font-family: inherit;
      user-select: none;
    }
    .lang-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 4px;
      color: #b0b0b0;
      padding: 6px 10px 5px 11px;
      cursor: pointer;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .lang-trigger:hover { color: #FFFFFF; border-color: rgba(255, 255, 255, 0.38); }
    .lang-trigger .caret {
      font-size: 8px;
      line-height: 1;
      color: #777;
      transition: transform 0.2s ease, color 0.15s ease;
    }
    .lang-selector.open .lang-trigger { color: #FFFFFF; border-color: #C4322B; }
    .lang-selector.open .lang-trigger .caret { transform: rotate(180deg); color: #C4322B; }

    .lang-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 152px;
      background: rgba(10, 10, 10, 0.97);
      border: 1px solid #333;
      border-radius: 5px;
      padding: 4px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .lang-selector.open .lang-menu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .lang-menu button {
      display: flex;
      width: 100%;
      align-items: baseline;
      gap: 10px;
      background: none;
      border: none;
      color: #9a9a9a;
      padding: 7px 9px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: color 0.15s ease, background-color 0.15s ease;
    }
    .lang-menu button .code {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      min-width: 22px;
    }
    .lang-menu button .name {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.02em;
      opacity: 0.72;
    }
    .lang-menu button:hover { background: rgba(255, 255, 255, 0.07); color: #FFFFFF; }
    .lang-menu button.active { color: #C4322B; }
    .lang-menu button.active .name { opacity: 0.9; }

    /* Japanese runs tighter than the Latin scripts: relax the wide tracking */
    html[lang="ja"] .page-title .main { letter-spacing: 0; }
    html[lang="ja"] .info-panel h3 { letter-spacing: 1.5px; }

    @media (max-width: 640px) {
      .page-title { top: 18px; left: 20px; max-width: calc(100vw - 40px); }
      .page-title .eyebrow { font-size: 9px; letter-spacing: 0.2em; margin-bottom: 10px; }
      .credit { bottom: 22px; left: 20px; }
      .credit-eyebrow { font-size: 9px; letter-spacing: 2.5px; }
      .credit-name { font-size: 13px; }
      .reference { display: none; }
      .controls { bottom: 22px; }
      button.replay { font-size: 10px; padding: 9px 18px; letter-spacing: 2px; }
      .lang-selector { top: 14px; right: 16px; }
      .lang-trigger { font-size: 9.5px; padding: 6px 9px 5px 10px; }
      .lang-menu { min-width: 140px; }
    }
  
  /* ===== Cybersecurity Compass modal (mirrors the Cyber Risk modal pattern) ===== */
  #cc-modal { position: fixed; inset: 0; z-index: 999; display: none; align-items: center; justify-content: center; }
  #cc-modal.open { display: flex; }
  #cc-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.93); opacity: 0; transition: opacity 220ms ease; }
  #cc-modal.open #cc-backdrop { opacity: 1; }
  #cc-frame-wrap { position: relative; width: min(94vw, 94vh); aspect-ratio: 1/1; transform: scale(0.96); opacity: 0; transition: opacity 240ms ease 60ms, transform 240ms ease 60ms; }
  #cc-modal.open #cc-frame-wrap { opacity: 1; transform: scale(1); }
  #cc-iframe { width: 100%; height: 100%; border: 0; background: transparent; display: block; }
  #cc-close { position: absolute; top: 14px; right: 14px; z-index: 1001; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.13); background: rgba(0,0,0,0.55); color: #f5f5f7; font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background 160ms ease, border-color 160ms ease; }
  #cc-close:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.30); }

  /* Clickable "Cybersecurity Compass" inside the eyebrow */
  .compass-link {
    cursor: pointer;
    transition: color 0.15s ease;
    color: inherit;
  }
  .compass-link:hover { color: #C4322B; }

  /* Hide host chrome when the Compass modal is open (same pattern as cr-modal-open) */
  body.cc-modal-open .page-title,
  body.cc-modal-open .credit,
  body.cc-modal-open .publication,
  body.cc-modal-open button.replay,
  body.cc-modal-open .lang-selector {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  /* Hover indicator on the lower-right compass click target — soft transparent circle that fades in */
  #lr-compass-hit { transition: fill 0.2s ease; fill: transparent; }
  /* Hover fill only applies once the compass has appeared (class added via JS gate). */
  #lr-compass-hit.compass-ready:hover { fill: rgba(255,255,255,0.10); }

  .cta-tooltip {
    position: fixed;
    z-index: 100;
    padding: 7px 14px;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1.5px solid #C4322B;
    border-radius: 999px;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.015em;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    /* Anchor point: bottom-center of the pill sits at (left, top). 14px gap above cursor. */
    transform: translate(-50%, -100%) translateY(-14px) scale(0.95);
    transform-origin: center bottom;
    transition: opacity 200ms ease, transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }
  .cta-tooltip.visible {
    opacity: 1;
    transform: translate(-50%, -100%) translateY(-14px) scale(1);
  }
  /* Flip-below variant: bottom-center anchor → top-center anchor when there's no room above */
  .cta-tooltip.flipped {
    transform: translate(-50%, 0) translateY(20px) scale(0.95);
    transform-origin: center top;
  }
  .cta-tooltip.flipped.visible {
    transform: translate(-50%, 0) translateY(20px) scale(1);
  }
</style>
</head>
<body>
  <div class="lang-selector" id="langSelector">
    <button type="button" class="lang-trigger" id="langTrigger"
            aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
      <span id="langCurrentLabel">EN</span><span class="caret" aria-hidden="true">▾</span>
    </button>
    <div class="lang-menu" id="langMenu" role="listbox" aria-label="Language selector">
      <button type="button" data-lang="en" role="option" aria-selected="true" class="active"><span class="code">EN</span><span class="name">English</span></button>
      <button type="button" data-lang="es" role="option" aria-selected="false"><span class="code">ES</span><span class="name">Español</span></button>
      <button type="button" data-lang="pt" role="option" aria-selected="false"><span class="code">PT</span><span class="name">Português</span></button>
      <button type="button" data-lang="ja" role="option" aria-selected="false"><span class="code">JA</span><span class="name">日本語</span></button>
    </div>
  </div>

  <div class="stage">
    <div class="page-title">
      <div class="eyebrow" data-i18n-html="page.eyebrow"><span id="compass-trigger" class="compass-link" role="button" tabindex="0" onclick="openCompass()">Cybersecurity Compass</span> · Before a Breach</div>
      <div class="main" data-i18n-html="page.main">Cyber Risk:<br><em>A Visual Representation</em></div>
      <div class="acronym-row">
        <a class="acronym" href="https://cybersecuritycompass.github.io/crml/" target="_blank" rel="noopener">CRML</a>
        <a class="acronym" href="https://cybersecuritycompass.github.io/cyberriskops/" target="_blank" rel="noopener">CyberRiskOps</a>
      </div>
    </div>

    <div class="svg-wrap">
      <svg id="cyberRiskSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"
           font-family="'Helvetica Neue', 'Arial Black', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', 'Noto Sans JP', Meiryo, sans-serif"
           role="img" aria-label="Cyber Risk Venn diagram" aria-describedby="svg-desc">
        <desc id="svg-desc">A Venn diagram showing Cyber Risk as the intersection of Threat, Vulnerability, and Consequence, with pairwise overlaps labelled Potential Cyber Risk, Theoretical Cyber Risk, and Cyber Risk Exposure.</desc>

        <!-- Mask applied to the three pairwise lens overlays. White = lens visible, black = lens hidden. Punches out (a) the central Cyber Risk Reuleaux so the highlight wraps around the red centre, and (b) the three 16px Venn ring strokes so the orange/red/orange-red outlines stay crisp during hover instead of being recoloured by the wash. The stroke-width="16" here matches the visible ring group exactly. -->
        <defs>
          <mask id="excludeCenterMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
            <rect x="0" y="0" width="1600" height="900" fill="white"/>
            <!-- Central Cyber Risk Reuleaux (triple intersection T ∩ V ∩ C) -->
            <path d="M 800,326.2
                     A 270,270 0 0,1 924.8,542.4
                     A 270,270 0 0,1 675.2,542.4
                     A 270,270 0 0,1 800,326.2 Z"
                  fill="black"/>
            <!-- Three Venn ring strokes (matches the visible 16px stroke ring group below) -->
            <g fill="none" stroke="black" stroke-width="16">
              <circle cx="800" cy="303" r="270"/>
              <circle cx="655" cy="554" r="270"/>
              <circle cx="945" cy="554" r="270"/>
            </g>
          </mask>
        </defs>

        <!-- Background -->
        <rect width="1600" height="900" fill="#000000"/>

        <!-- Cyber Risk filled center (fades in first) -->
        <path d="M 800,326.2
                 A 270,270 0 0,1 924.8,542.4
                 A 270,270 0 0,1 675.2,542.4
                 A 270,270 0 0,1 800,326.2 Z"
              fill="#D6342E" opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin="0s" dur="1.4s" fill="freeze"/>
        </path>

        <!-- Three Venn rings (stroke-only intro animation). Threat keeps its fill on the same element; Vulnerability and Consequence have their fills moved later in document order so their labels sit behind the fill. -->
        <g stroke-width="16" stroke-linecap="round">
          <circle id="threatCircle" cx="800" cy="303" r="270"
                  stroke="#F19A38" fill="#F19A38" fill-opacity="0"
                  stroke-dasharray="1697" stroke-dashoffset="1697">
            <animate attributeName="stroke-dashoffset" from="1697" to="0"
                     begin="4.4s" dur="1s" fill="freeze"/>
          </circle>
          <circle cx="655" cy="554" r="270"
                  stroke="#A8201D" fill="none"
                  stroke-dasharray="1697" stroke-dashoffset="1697">
            <animate attributeName="stroke-dashoffset" from="1697" to="0"
                     begin="5.4s" dur="1s" fill="freeze"/>
          </circle>
          <circle cx="945" cy="554" r="270"
                  stroke="#FF6A2C" fill="none"
                  stroke-dasharray="1697" stroke-dashoffset="1697">
            <animate attributeName="stroke-dashoffset" from="1697" to="0"
                     begin="6.4s" dur="1s" fill="freeze"/>
          </circle>
        </g>

        <!-- Black masks: punch a gap in the ring strokes where the outer labels sit. Width is sized dynamically per-language in setLanguage() so longer translations (ES "Vulnerabilidad", PT "Vulnerabilidade") don't overflow the mask. -->
        <g fill="#000000">
          <rect id="vulnMask" x="245" y="595" width="350" height="76"/>
          <rect id="consMask" x="1005" y="595" width="350" height="76"/>
        </g>

        <!-- Outer labels: fade in sequentially -->
        <g text-anchor="middle" font-size="52" font-weight="900" letter-spacing="0.5">
          <text id="threatLabel" class="hot-label" data-i18n="venn.threat" x="800" y="215" fill="#F19A38" opacity="0">Threat<animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="1s" fill="freeze"/></text>
          <text id="vulnerabilityLabel" class="hot-label" data-i18n="venn.vuln" x="420" y="650" fill="#A8201D" opacity="0">Vulnerability<animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="1s" fill="freeze"/></text>
          <text id="consequenceLabel" class="hot-label" data-i18n="venn.consequence" x="1180" y="650" fill="#FF6A2C" opacity="0">Consequence<animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="1s" fill="freeze"/></text>
        </g>

        <!-- Hover fills for Vulnerability and Consequence sit ABOVE their labels so the wash overlays the text -->
        <g stroke="none" pointer-events="none">
          <circle id="vulnerabilityCircle" cx="655" cy="554" r="270" fill="#A8201D" fill-opacity="0"/>
          <circle id="consequenceCircle"   cx="945" cy="554" r="270" fill="#FF6A2C" fill-opacity="0"/>
        </g>

        <!-- Hover lens overlays: each path covers the full geometric intersection of its two circles, filled with the colour-mix of the two ring colours. Sits BELOW the pairwise labels so the labels stay crisp on top of the wash. The mask subtracts the central Cyber Risk Reuleaux so the highlight wraps AROUND the red centre instead of covering it. -->
        <g stroke="none" pointer-events="none" mask="url(#excludeCenterMask)">
          <!-- Potential = Threat ∩ Vulnerability  (#F19A38 ⊕ #A8201D = #CD5D2B) -->
          <path id="potentialLens" class="lens"
                d="M 530.2,314.6 A 270,270 0 0,0 924.8,542.4 A 270,270 0 0,0 530.2,314.6 Z"
                fill="#CD5D2B" fill-opacity="0"/>
          <!-- Theoretical = Threat ∩ Consequence  (#F19A38 ⊕ #FF6A2C = #F88232) -->
          <path id="theoreticalLens" class="lens"
                d="M 1069.8,314.6 A 270,270 0 0,1 675.2,542.4 A 270,270 0 0,1 1069.8,314.6 Z"

  <div id="tt" class="" style="left: 732.203px; top: 160.203px;"><div id="tt-h">Gestión del Ciber Riesgo</div><div id="tt-s">Antes de una Brecha · Proactivo y Predictivo</div><div id="tt-b">El norte verdadero de tu brújula de ciberseguridad. Sin él, las organizaciones derivan de crisis en crisis, reaccionando, recuperándose, sin reducir nunca el riesgo de forma real. La Gestión del Ciber Riesgo es la disciplina proactiva y predictiva que anticipa las amenazas antes de que se materialicen, prioriza lo que más importa, optimiza las inversiones en seguridad y da a los ejecutivos un lenguaje claro para tomar decisiones estratégicas. Los ciberdelincuentes no solo buscan vulnerabilidades técnicas. Buscan la incertidumbre y la indecisión que genera no tener un norte. Esto es lo que cierra esa brecha.</div></div>

// Tooltip
const tt=document.getElementById('tt');

const tts=document.getElementById('tt-s');

const stage=document.getElementById('stage');

function posTT(cx,cy){
  const W=285,H=tt.offsetHeight||220;
  const sw=stage.offsetWidth,sh=stage.offsetHeight;
  let x=cx+14,y=cy+14;
  if(x+W>sw) x=cx-W-14;
  if(y+H>sh) y=cy-H-14;
  if(x<6) x=6;
  if(y<6) y=6;
  tt.style.left=x+'px';

// Unified mouse handler - single source of truth
// All tooltip logic driven from one mousemove on the stage overlay
let puzzleAngle=0;
let lastCX=0, lastCY=0;
let hoverState=-1; // -1=none, 0/1/2=sector, 3/4/5=puzzle piece

const CX=540, CY=540;
const PUZZLE_OUTER=200, PUZZLE_INNER=122;
const SECTOR_OUTER=432, SECTOR_INNER=210;

function getZone(svgX, svgY){
  const dx=svgX-CX, dy=svgY-CY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  // Angle 0=top, clockwise
  const angle=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;

  // Puzzle ring
  if(dist>=PUZZLE_INNER && dist<=PUZZLE_OUTER){
    // At rotation=0: People=300°-60°, Process=60°-180°, Technology=180°-300°
    // Subtract puzzleAngle to get piece-local angle, then offset by 300° so People starts at 0
    const local=((angle-puzzleAngle)%360+360)%360;
    const adjusted=(local-300+360)%360;
    return 3+Math.floor(adjusted/120); // 3=People,4=Process,5=Technology
  }

  // Outer sector ring
  if(dist>=SECTOR_INNER && dist<=SECTOR_OUTER){
    // Boundaries at 15°, 135°, 255° (from SVG path endpoints)
    // Sector 0 (CRM):         15°-135°  (top-right)
    // Sector 1 (D&R):        135°-255°  (bottom)
    // Sector 2 (Resilience): 255°-360° and 0°-15° (top-left, wraps)
    if(angle>=15  && angle<135) return 0;
    if(angle>=135 && angle<255) return 1;
    return 2;
  }
  return -1;
}

function showTT(zone, cx, cy){
  const d = zone<3 ? TT[lang][zone] : TTP[lang][zone-3];
  tth.textContent=d.h; tts.textContent=d.s; ttb.textContent=d.b;
  tt.classList.add('on');
  posTT(cx, cy);
}

// Single mousemove listener on the hits SVG (sits above everything)
const hitsSvg=document.getElementById('hits');
hitsSvg.style.pointerEvents='all';
// Remove individual hit path pointer events - we handle everything here
[0,1,2].forEach(i=>{
  const el=document.getElementById('hit'+i);
  if(el) el.style.pointerEvents='none';
});

hitsSvg.addEventListener('mousemove', function(e){
  const r=stage.getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  lastCX=cx; lastCY=cy;
  const scale=1080/r.width;
  const zone=getZone(cx*scale, cy*scale);
  // If in puzzle ring, mark as -2 so tick loop keeps refreshing even when not moving
  hoverState=(zone>=3)?-2:zone;
  if(zone===-1){ tt.classList.remove('on'); hitsSvg.style.cursor='default'; }
  else { showTT(zone, cx, cy); hoverState=zone; hitsSvg.style.cursor='pointer'; }
});

hitsSvg.addEventListener('mouseleave', function(){
  tt.classList.remove('on');
  hoverState=-1;
  hitsSvg.style.cursor='default';
});

// Animation
const A={T:31.8,t:0,spin:0,needle:0,lastActive:75,centers:[75,195,315],cd:6.0,pc:[1.0,3.0,5.0],W:1.3,last:0};
function easeOut(x){return 1-Math.pow(1-x,3);}
function pulse(cp,c){let d=Math.abs(cp-c);d=Math.min(d,A.cd-d);return d>A.W?0:0.5*(1+Math.cos(Math.PI*d/A.W));}
function lerp(a,b,p){return a+(b-a)*p;}

function tick(now){
  const dt=Math.min(0.05,(now-A.last)/1000);
  A.last=now; A.t+=dt; if(A.t>=A.T)A.t-=A.T; A.spin+=dt;

  const root=document.getElementById('compassRoot');
  const needleEl=document.getElementById('needle');
  const grps=[document.getElementById('grp0'),document.getElementById('grp1'),document.getElementById('grp2')];
  const glows=[document.getElementById('glow0'),document.getElementById('glow1'),document.getElementById('glow2')];
  const puzzle=document.getElementById('puzzle');

  const id=1.8,p=Math.max(0,Math.min(1,A.t/id)),e=easeOut(p);
  if(root){
    root.setAttribute('transform','translate(540,540) rotate('+lerp(-150,0,e).toFixed(2)+') scale('+lerp(0.80,1,e).toFixed(3)+') translate(-540,-540)');
    root.setAttribute('opacity',Math.max(0,Math.min(1,p*1.7)).toFixed(3));
  }

  const tc=A.t-id,cp=tc<0?-99:((tc%A.cd+A.cd)%A.cd);
