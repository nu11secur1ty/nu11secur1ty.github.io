<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The CISO Reporting Structure Builder</title>
<style>
  :root{
    --bg:#0B0E14;--panel:#11151F;--panel-2:#0E121A;--line:#1E2530;
    --red:#E10600;--red-dim:#7A0B0B;--ink:#E8EAED;--ink-dim:#8A92A0;--ink-faint:#565E6B;
    --good:#3FB68B;--warn:#E8A13F;--bad:#E1463C;
    --mono:'SFMono-Regular',ui-monospace,'Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace;
    --sans:'Inter','Helvetica Neue',Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 82% 0%,rgba(225,6,0,0.07),transparent 44%);}
  .wrap{max-width:1240px;margin:0 auto;padding:30px 24px 70px;}

  header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:26px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--red);margin:0 0 13px;display:flex;align-items:center;gap:10px;}
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--red);display:inline-block;}
  h1{font-size:clamp(26px,4.3vw,42px);line-height:1.05;margin:0 0 12px;font-weight:800;letter-spacing:-.02em;}
  h1 em{color:var(--red);font-style:normal;}
  .lede{font-size:15.5px;color:var(--ink-dim);max-width:64ch;margin:0;}

  .lang{display:flex;gap:2px;flex-shrink:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .lang button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;font-weight:600;color:var(--ink-faint);background:var(--panel-2);border:none;padding:7px 11px;cursor:pointer;transition:color .15s,background .15s;}
  .lang button:hover{color:var(--ink);}
  .lang button.on{color:#ffd9d6;background:rgba(225,6,0,0.16);}

  .stage{display:grid;grid-template-columns:1fr 410px;gap:22px;align-items:start;}
  @media(max-width:980px){.stage{grid-template-columns:1fr;}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;}
  .panel-h{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .panel-h b{color:var(--ink-dim);font-weight:600;}

  .tree{padding:26px 20px 30px;min-height:480px;overflow-x:auto;}
  .tree-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:420px;text-align:center;color:var(--ink-faint);}
  .tree-empty svg{margin-bottom:16px;opacity:.5;}
  .tree-empty p{font-size:13px;max-width:34ch;margin:0;}

  .node-wrap{display:flex;flex-direction:column;align-items:center;min-width:min-content;}
  .node{font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;font-weight:600;padding:11px 18px;border-radius:4px;border:1px solid var(--line);background:#161B25;color:var(--ink);text-align:center;position:relative;animation:pop .34s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap;}
  .node.board{border-color:#2a3340;background:#10161f;color:var(--ink-dim);}
  .node.ceo{border-color:#34404f;background:#141b26;}
  .node.ciso{border-color:var(--red);background:rgba(225,6,0,0.14);color:#ffd9d6;box-shadow:0 0 18px rgba(225,6,0,.20);}
  .node.peer{border-color:#283442;background:#11171f;color:var(--ink-dim);font-size:11px;padding:8px 12px;}
  .node.peer.csuite{opacity:.6;border-style:dashed;}
  .node.pathnode{border-color:#3a4654;background:#161d28;color:var(--ink);}
  .node.fn{border-color:#243042;background:#0f141d;color:var(--ink);font-size:10.5px;padding:7px 11px;}
  .node.fn .tag{display:block;font-family:var(--sans);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px;}
  .stem{width:1px;background:var(--line);height:20px;animation:grow .3s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.96);}to{opacity:1;transform:none;}}
  @keyframes grow{from{height:0;}to{height:20px;}}

  .peer-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .csuite-row{align-items:flex-start;}
  .pathcol{display:flex;flex-direction:column;align-items:center;}
  .peer-bracket{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:7px;}
  .fn-wrap{margin-top:4px;display:flex;flex-direction:column;align-items:center;}
  .fn-cap{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;margin:6px 0 10px;}
  .fn-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:540px;}
  .fn-rail{width:1px;background:var(--line);height:14px;}
  .dep-wrap{margin-top:22px;width:100%;border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;align-items:center;}
  .dep-caphdr{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:14px;}
  .dep-grid{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start;}
  .dep-group{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .dep-owner{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:4px;padding-bottom:5px;border-bottom:1px solid var(--line);}
  .dep-owner.danger{color:var(--bad);border-color:var(--bad);}
  .node.dep{opacity:.5;border-style:dashed;font-size:10px;padding:6px 10px;}
  .node.dep.orphan{opacity:.85;border-color:var(--bad);border-style:solid;color:#f4b4af;background:rgba(225,70,60,.08);}
  .node.dep.na{opacity:.32;}

  .convo{padding:0;display:flex;flex-direction:column;}
  .progress{display:flex;gap:4px;padding:12px 18px;border-bottom:1px solid var(--line);}
  .pstep{flex:1;height:3px;border-radius:2px;background:#1a2029;transition:background .3s;}
  .pstep.done{background:var(--red);}
  .pstep.active{background:#ff5a52;}
  .chat{padding:18px 18px 8px;}
  .msg{margin-bottom:14px;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .bubble{font-size:13.5px;line-height:1.55;padding:12px 14px;border-radius:4px;max-width:94%;}
  .bubble.q{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);}
  .bubble.q b{color:#ffd9d6;font-weight:600;}
  .bubble.a{background:rgba(225,6,0,0.10);border:1px solid var(--red-dim);color:#ffd9d6;margin-left:auto;font-family:var(--mono);font-size:12px;}
  .bubble.note{background:none;border:none;padding:8px 2px;color:var(--ink-dim);font-size:12.5px;}
  .bubble.note .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:5px;}

  .options{display:flex;flex-direction:column;gap:8px;padding:6px 18px 18px;border-top:1px solid var(--line);background:var(--panel-2);}
  .opt-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:8px 0 2px;}
  .opt{text-align:left;font-family:var(--sans);font-size:13px;color:var(--ink);background:#141a24;border:1px solid var(--line);border-radius:4px;padding:11px 13px;cursor:pointer;transition:border-color .14s,background .14s,transform .1s;display:flex;align-items:center;gap:10px;}
  .opt:hover{border-color:var(--red);background:#191f2a;}
  .opt:active{transform:translateY(1px);}
  .opt .k{font-family:var(--mono);font-size:11px;color:var(--ink-faint);flex-shrink:0;}
  .opt.ciso-opt{border-color:var(--red-dim);background:rgba(225,6,0,0.08);color:#ffd9d6;}
  .opt.sel{border-color:var(--good);background:rgba(63,182,139,.08);}
  .opt .chk{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--good);opacity:0;white-space:nowrap;}
  .opt.sel .chk{opacity:1;}
  .opt-done{margin-top:4px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:#ffd9d6;background:rgba(225,6,0,0.12);border:1px solid var(--red-dim);border-radius:4px;padding:11px 13px;cursor:pointer;text-align:center;transition:background .14s;}
  .opt-done:hover{background:rgba(225,6,0,0.2);}

  .restart{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);background:none;border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer;transition:color .15s,border-color .15s;}
  .restart:hover{color:var(--ink);border-color:var(--ink-faint);}

  .analysis-panel{margin-top:22px;display:none;}
  .analysis-panel.show{display:block;animation:fade .4s ease;}
  .analysis-body{padding:22px;}
  .result-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  @media(max-width:760px){.result-cols{grid-template-columns:1fr;gap:0;}}
  .result-col{min-width:0;}
  .verdict-name{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:0 0 3px;}
  .verdict-sub{font-size:13px;color:var(--ink-dim);margin:0 0 20px;max-width:80ch;}
  .half-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:14px 0 10px;display:flex;align-items:center;gap:8px;}
  .half-h::after{content:"";flex:1;height:1px;background:var(--line);}
  .metric{margin-bottom:13px;}
  .metric-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:10px;}
  .metric-name{font-size:12.5px;font-weight:600;flex:1;min-width:0;}
  .metric-num{font-family:var(--mono);font-size:11px;color:var(--ink-dim);flex-shrink:0;white-space:nowrap;}
  .bar{height:5px;border-radius:3px;background:#1a2029;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.1,1),background .3s;width:0;}

  .seam{margin:24px 0 22px;}
  .seam-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .seam-title{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);}
  .seam-val{font-family:var(--mono);font-size:13px;font-weight:700;}
  .seam-track{height:26px;border-radius:3px;background:linear-gradient(90deg,#0f1a16,#1a0f0f);border:1px solid var(--line);position:relative;overflow:hidden;}
  .seam-fill{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,rgba(225,6,0,.25),var(--red));transition:width .7s cubic-bezier(.4,0,.1,1);border-right:2px solid #ff5a52;}
  .seam-cap{font-size:11.5px;color:var(--ink-faint);margin-top:7px;line-height:1.45;}
  .failmode{margin-top:14px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:4px;background:var(--panel-2);padding:12px 14px;}
  .fm-head{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px;}
  .fm-why{font-size:12.5px;color:var(--ink-dim);line-height:1.55;margin:0 0 7px;}
  .fm-fail{font-size:12.5px;color:var(--ink);line-height:1.55;margin:0;}
  .fm-fail b{color:#ffe2b0;font-weight:600;}

  .unguarded{display:none;border:1px solid var(--bad);border-radius:4px;background:rgba(225,70,60,.07);padding:14px 16px;margin:0 0 4px;}
  .unguarded.show{display:block;animation:fade .4s ease;}
  .ug-h{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bad);font-weight:700;margin:0 0 8px;}
  .ug-mark{flex-shrink:0;width:17px;height:17px;border-radius:50%;background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
  .ug-body{font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin:0 0 11px;}
  .ug-list{display:flex;flex-wrap:wrap;gap:7px;}
  .ug-chip{font-family:var(--mono);font-size:11px;color:#f4b4af;background:rgba(225,70,60,.12);border:1px solid var(--bad);border-radius:3px;padding:5px 10px;}

  .flags{margin-top:0;padding-top:0;}
  .flags-h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:14px;}
  .flag{display:flex;gap:10px;font-size:12.5px;line-height:1.5;margin-bottom:11px;color:var(--ink-dim);}
  .flag .mark{flex-shrink:0;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;font-family:var(--mono);margin-top:1px;}
  .flag.pos .mark{background:rgba(63,182,139,.16);color:var(--good);}
  .flag.neg .mark{background:rgba(225,70,60,.16);color:var(--bad);}
  .flag.neu .mark{background:rgba(232,161,63,.16);color:var(--warn);}
  .flag b{color:var(--ink);font-weight:600;}

  .questions{margin-top:0;}
  .q-head{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:4px;}
  .q-sub{font-size:12px;color:var(--ink-faint);margin:0 0 16px;line-height:1.5;}
  .q-group{margin-bottom:18px;}
  .q-group-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .q-group-h::after{content:"";flex:1;height:1px;background:var(--line);}
  .q-item{display:flex;gap:11px;font-size:13px;line-height:1.55;margin-bottom:13px;color:var(--ink);align-items:flex-start;}
  .q-item .qn{flex-shrink:0;font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:3px;width:18px;}
  .q-item .qt{flex:1;}
  .q-item .qt em{color:var(--ink-dim);font-style:normal;display:block;font-size:11.5px;margin-top:3px;}
  .whatif{background:var(--panel-2);border:1px solid var(--line);border-left:2px solid var(--red);border-radius:3px;padding:11px 13px;margin-bottom:10px;font-size:12.5px;line-height:1.55;color:var(--ink-dim);}
  .whatif b{color:#ffd9d6;font-weight:600;display:block;margin-bottom:3px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;}

  .phases{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);}
  .phases-h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin:0 0 4px;}
  .phases-sub{font-size:12px;color:var(--ink-faint);margin:0 0 16px;line-height:1.5;}
  .phase-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:760px){.phase-grid{grid-template-columns:1fr;}}
  .phase-card{border:1px solid var(--line);border-radius:4px;background:var(--panel-2);overflow:hidden;}
  .phase-top{padding:11px 13px 10px;border-bottom:1px solid var(--line);}
  .phase-domain{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px;}
  .phase-name{font-size:13.5px;font-weight:700;color:var(--ink);}
  .phase-edge{padding:10px 13px;font-size:11.5px;line-height:1.5;}
  .phase-edge .who{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
  .phase-edge .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .phase-att{border-bottom:1px solid var(--line);}
  .phase-att .who{color:var(--bad);}.phase-att .dot{background:var(--bad);}
  .phase-def .who{color:var(--good);}.phase-def .dot{background:var(--good);}
  .phase-edge p{margin:0;color:var(--ink-dim);}
  .phase-tilt{padding:8px 13px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;text-align:center;border-top:1px solid var(--line);}
  .phase-tilt.att{color:var(--bad);background:rgba(225,70,60,.06);}
  .phase-tilt.def{color:var(--good);background:rgba(63,182,139,.06);}
  .phase-tilt.even{color:var(--warn);background:rgba(232,161,63,.06);}

  .standards{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);}
  .standards-h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin:0 0 4px;}
  .standards-sub{font-size:12px;color:var(--ink-faint);margin:0 0 16px;line-height:1.5;}
  .standards-list{display:flex;flex-direction:column;gap:12px;}
  .std-card{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:4px;background:var(--panel-2);padding:13px 15px;}
  .std-org{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:2px;}
  .std-prov{font-size:11px;color:var(--ink-faint);margin-bottom:8px;}
  .std-quote{font-size:12px;color:var(--ink-dim);line-height:1.55;border-left:2px solid var(--line);padding-left:11px;margin:0 0 9px;font-style:italic;}
  .std-rec{font-size:12.5px;color:var(--ink);line-height:1.55;margin:0;}
  .std-rec b{color:#ffd9d6;font-weight:600;}

  .footnote{margin-top:28px;font-size:11.5px;color:var(--ink-faint);max-width:82ch;line-height:1.6;border-top:1px solid var(--line);padding-top:16px;}
  .page-footer{max-width:1240px;margin:18px auto 30px;padding:0 24px;display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;}
  .pf-credit{font-family:var(--sans);font-size:11.5px;line-height:1.6;color:var(--ink-faint);text-align:left;}
  .pf-cite{font-family:var(--sans);font-size:11.5px;line-height:1.6;color:var(--ink-faint);text-align:right;}
  .pf-credit a,.pf-cite a{color:var(--ink-faint);text-decoration:none;border-bottom:none;transition:color .15s;}
  .pf-credit a:hover,.pf-cite a:hover{color:var(--red);}
  .footnote b{color:var(--ink-dim);font-weight:600;}
  .footnote a{color:#d98a86;text-decoration:none;border-bottom:1px solid rgba(217,138,134,.35);transition:color .15s,border-color .15s;}
  .footnote a:hover{color:#ffd9d6;border-color:#ffd9d6;}
  .footnote a b{color:inherit;}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  .export-btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#ffd9d6;background:rgba(225,6,0,0.14);border:1px solid var(--red-dim);border-radius:3px;padding:6px 12px;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;gap:7px;}
  .export-btn:hover{background:rgba(225,6,0,0.26);}
  .export-btn svg{width:13px;height:13px;}

  /* ============ print / PDF export ============ */
  .report{display:none;}

  @media print{
    @page{margin:16mm;}
    body{background:#fff!important;color:#111!important;background-image:none!important;}
    /* hide the entire interactive app; show only the executive report */
    .wrap{display:none!important;}
    .page-footer{display:none!important;}
    .report{display:block!important;font-family:var(--sans);color:#1a1a1a;}
    .rep-cover{border-bottom:3px solid #b00;padding-bottom:18px;margin-bottom:22px;}
    .rep-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#b00;margin-bottom:10px;}
    .rep-title{font-size:26px;font-weight:700;line-height:1.15;color:#111;margin:0 0 12px;letter-spacing:-.01em;}
    .rep-meta{font-size:12px;color:#555;line-height:1.7;}
    .rep-meta b{color:#222;font-weight:600;}
    .rep-section{margin-bottom:22px;break-inside:avoid;}
    .rep-avoid{break-inside:avoid;}
    .rep-h{font-size:11px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#b00;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid #ddd;}
    .rep-verdict{font-size:18px;font-weight:700;color:#111;line-height:1.3;margin-bottom:10px;}
    .rep-summary{font-size:13px;line-height:1.65;color:#333;margin:0;}
    .rep-tree{display:flex;justify-content:center;padding:8px 0 4px;overflow:visible;}
    .rep-tree .node-wrap{display:flex;flex-direction:column;align-items:center;}
    .rep-tree .node{font-size:10px;padding:7px 12px;}

  /* ============ tree ============ */
  function nodeEl(label,cls,extraTag){var n=document.createElement('div');n.className='node '+(cls||'');n.innerHTML='<span>'+label+'</span>'+(extraTag?'<span class="tag">'+extraTag+'</span>':'');return n;}
  function renderTree(){
    if(chain.length===0){treeEmpty.style.display='flex';Array.prototype.slice.call(tree.querySelectorAll('.dyn')).forEach(function(e){e.remove();});return;}
    treeEmpty.style.display='none';
    Array.prototype.slice.call(tree.querySelectorAll('.dyn')).forEach(function(e){e.remove();});
    var holder=document.createElement('div');holder.className='dyn node-wrap';
    var deeper=cisoBoss&&cisoBoss!=='CEO'&&ceoReports.length;
    var ceoIdx=chain.indexOf('CEO');
    var pathLevelIdx=deeper?ceoIdx+1:-1;

    // builds the CISO block (peers row + CISO + functions + dependencies) into a given container
    function appendCisoBlock(container){
      if(peers.length){var br=document.createElement('div');br.className='peer-bracket';br.textContent=fmt(t('sameLevel'),{boss:roleLabel(cisoBoss)});container.appendChild(br);}
      var row=document.createElement('div');row.className='peer-row';
      peers.forEach(function(p){row.appendChild(nodeEl(peerLabel(p),'peer'));});
      row.appendChild(nodeEl('CISO','ciso'));container.appendChild(row);
      if(fns.length){var rail=document.createElement('div');rail.className='fn-rail';container.appendChild(rail);var fw=document.createElement('div');fw.className='fn-wrap';var cap=document.createElement('div');cap.className='fn-cap';cap.textContent=t('reportsInto');fw.appendChild(cap);var grid=document.createElement('div');grid.className='fn-grid';fns.forEach(function(f){grid.appendChild(nodeEl(fnLabel(f),'fn',fnTag(f)));});fw.appendChild(grid);container.appendChild(fw);}
      var depKeys=Object.keys(deps);
      if(depKeys.length){
        var assigned={},nobody=[],na=[];
        depKeys.forEach(function(fid){var d=deps[fid];if(d.owner==='NOBODY')nobody.push(fid);else if(d.owner==='NA')na.push(fid);else{(assigned[d.owner]=assigned[d.owner]||{label:depOwnerLabel(d.owner),items:[]}).items.push(fid);}});
        var dw=document.createElement('div');dw.className='dep-wrap';
        var dcap=document.createElement('div');dcap.className='dep-caphdr';dcap.textContent=t('depsOwnedElse');dw.appendChild(dcap);
        var dgrid=document.createElement('div');dgrid.className='dep-grid';
        Object.keys(assigned).forEach(function(own){var grp=document.createElement('div');grp.className='dep-group';var oh=document.createElement('div');oh.className='dep-owner';oh.textContent=assigned[own].label;grp.appendChild(oh);assigned[own].items.forEach(function(fid){grp.appendChild(nodeEl(fnLabel(fid),'fn dep'));});dgrid.appendChild(grp);});
        if(nobody.length){var g=document.createElement('div');g.className='dep-group';var oh=document.createElement('div');oh.className='dep-owner danger';oh.textContent=t('nobodyOwns');g.appendChild(oh);nobody.forEach(function(fid){g.appendChild(nodeEl(fnLabel(fid),'fn dep orphan'));});dgrid.appendChild(g);}
        if(na.length){var g2=document.createElement('div');g2.className='dep-group';var oh2=document.createElement('div');oh2.className='dep-owner';oh2.style.color='var(--ink-faint)';oh2.textContent=t('naLabel');g2.appendChild(oh2);na.forEach(function(fid){g2.appendChild(nodeEl(fnLabel(fid),'fn dep na'));});dgrid.appendChild(g2);}
        dw.appendChild(dgrid);container.appendChild(dw);
      }
    }
    // builds remaining chain nodes below a given start index into a container (vertical)
    function appendChainBelow(container,startIdx){
      for(var j=startIdx;j<chain.length;j++){var s=document.createElement('div');s.className='stem';container.appendChild(s);container.appendChild(nodeEl(roleLabel(chain[j]),''));}
    }

    if(deeper){
      // draw chain down to the CEO
      chain.slice(0,ceoIdx+1).forEach(function(role,i){
        if(i>0){var s=document.createElement('div');s.className='stem';holder.appendChild(s);}
        holder.appendChild(nodeEl(role==='BOARD'?t('board'):roleLabel(role),role==='BOARD'?'board':role==='CEO'?'ceo':''));
      });
      // C-suite level: CEO reports + the path node, where the path node carries the whole CISO sub-tree beneath it
      var rs=document.createElement('div');rs.className='stem';holder.appendChild(rs);
      var rb=document.createElement('div');rb.className='peer-bracket';rb.textContent=t('ceoReportsBracket');holder.appendChild(rb);
      var crow=document.createElement('div');crow.className='peer-row csuite-row';
      ceoReports.forEach(function(p){crow.appendChild(nodeEl(peerLabel(p),'peer csuite'));});
      // the path node becomes a vertical column: node, then the rest of the chain, then the CISO block
      var col=document.createElement('div');col.className='node-wrap pathcol';
      col.appendChild(nodeEl(roleLabel(chain[pathLevelIdx]),'pathnode'));
      appendChainBelow(col,pathLevelIdx+1); // any chain nodes between this and the CISO boss
      var bs=document.createElement('div');bs.className='stem';col.appendChild(bs);
      appendCisoBlock(col);
      crow.appendChild(col);
      holder.appendChild(crow);
    }else{
      // normal linear chain
      chain.forEach(function(role,i){
        if(i>0){var s=document.createElement('div');s.className='stem';holder.appendChild(s);}
        holder.appendChild(nodeEl(role==='BOARD'?t('board'):roleLabel(role),role==='BOARD'?'board':role==='CEO'?'ceo':''));
      });
      if(cisoBoss){var s=document.createElement('div');s.className='stem';holder.appendChild(s);appendCisoBlock(holder);}
    }
    tree.appendChild(holder);
  }
  function depOwnerLabel(id){return DEP_OWNER_LABEL[L][id]||id;}

  /* ============ scoring ============ */
  function barColor(v){return v>=4?'var(--good)':v>=3?'var(--warn)':'var(--bad)';}
  function functionScores(){
    var raw={soc:0,gov:0,cro:0,strat:0};
    fns.forEach(function(id){var f=fnDef(id);for(var k in f.d)raw[k]+=f.d[k];});
    function norm(v,cap){return Math.max(0,Math.min(5,v/cap*5));}
    var soc=norm(raw.soc,7),gov=norm(raw.gov,4),cro=norm(raw.cro,11),strat=norm(raw.strat,7);
    var domains={detect:false,govern:false,proactive:false,identity:false};
    fns.forEach(function(id){var dm=fnDef(id).dom;domains[dm]=true;});
    var covered=Object.keys(domains).filter(function(k){return domains[k];}).length;
    var orphanN=Object.keys(deps).filter(function(k){return deps[k].owner==='NOBODY';}).length;
    // unowned capabilities are missing capacity: each one lowers completeness only
    var comp=Math.max(0,norm(covered,4)-orphanN*0.7);
    return {soc:soc,gov:gov,cro:cro,strat:strat,comp:comp,domains:domains,covered:covered,orphanN:orphanN};
  }

  function showAnalysis(){
    var ms=MSCORE[cisoBoss],mt=MTEXT[L][cisoBoss];if(!ms)return;
    $('v-name').textContent=mt.name;
    $('v-sub').textContent=mt.sub;
    var fs=functionScores();
    ['independence','conflict','speed','board','alignment'].forEach(function(k){var v=ms.s[k];var bar=$('b-'+k);setTimeout(function(){bar.style.width=(v/5*100)+'%';bar.style.background=barColor(v);},60);$('n-'+k).textContent=v.toFixed(1)+' / 5';});
    [['soc',fs.soc],['gov',fs.gov],['cro',fs.cro],['strat',fs.strat],['comp',fs.comp]].forEach(function(p){var bar=$('b-'+p[0]);setTimeout(function(){bar.style.width=(p[1]/5*100)+'%';bar.style.background=barColor(p[1]);},60);$('n-'+p[0]).textContent=p[1].toFixed(1)+' / 5';});
    var capGap=(5-fs.soc)+(5-fs.gov)+(5-fs.cro)+(5-fs.comp);
    var orphanN=Object.keys(deps).filter(function(k){return deps[k].owner==='NOBODY';}).length;
    var seam=Math.round(Math.min(92,ms.seam+capGap*1.6+orphanN*4));
    setTimeout(function(){$('seam-fill').style.width=seam+'%';},60);
    var sv=$('seam-val');var label=seam<=28?t('narrow'):seam<=48?t('moderate'):t('wide');var col=seam<=28?'var(--good)':seam<=48?'var(--warn)':'var(--bad)';sv.textContent=label+' · '+seam;sv.style.color=col;
    $('seam-cap').textContent=orphanN>0?fmt(t('seamOrphan'),{n:orphanN,s:orphanN>1?'s':''}):(seam<=28?t('seamTight'):seam<=48?t('seamMod'):t('seamWide'));
    renderFailMode();
    var ug=$('unguarded'),ugList=$('ug-list');
    var orphanIds=Object.keys(deps).filter(function(k){return deps[k].owner==='NOBODY';});
    if(orphanIds.length){$('ug-head').textContent=t('ugHead');$('ug-body').textContent=t('ugBody');ugList.innerHTML='';orphanIds.forEach(function(id){var c=document.createElement('span');c.className='ug-chip';c.textContent=fnLabel(id);ugList.appendChild(c);});ug.classList.add('show');}else{ug.classList.remove('show');}
    var fl=$('flags');fl.innerHTML='<div class="flags-h">'+t('whatMeans')+'</div>';
    $('verdict-tag').textContent=t('reportsTo')+roleLabel(cisoBoss);
    function flag(tp,b,x){var d=document.createElement('div');d.className='flag '+tp;var mk=tp==='pos'?'+':tp==='neg'?'!':'~';d.innerHTML='<span class="mark">'+mk+'</span><span><b>'+b+'</b> '+x+'</span>';fl.appendChild(d);}
    mt.flags.forEach(function(f){flag(f[0],f[1],f[2]);});
    FLAGS_EXTRA[L](flag,fs,deps);
    var lineStrong=(ms.s.independence+ms.s.board)/2>=4;
    var fnStrong=fs.covered>=3&&fs.cro>=2;
    if(lineStrong&&!fnStrong)FIGUREHEAD[L](flag,'fig');
    if(!lineStrong&&fnStrong)FIGUREHEAD[L](flag,'marshal');
    renderQuestions(ms,mt,fs,lineStrong,fnStrong);
    renderPhases(ms,fs);
    renderStandards(ms,fs);
    analysis.classList.add('show');
  }

  // attacker/defender advantage across the three Cybersecurity Compass domains
  function renderPhases(ms,fs){
    $('phases-h').textContent=t('phasesH');
    $('phases-sub').textContent=t('phasesSub');
    var grid=$('phase-grid');grid.innerHTML='';
    var boardAccess=ms.s.board, speed=ms.s.speed, independence=ms.s.independence;
    var orphanN=fs.orphanN||0;
    // BEFORE: proactive cyber risk + board access decide whether exposure is seen and acted on early
    var beforeDef=fs.domains.proactive && fs.cro>=2.5 && boardAccess>=4;
    var beforeAtt=!fs.domains.proactive || orphanN>0;
    // DURING: detection/SOC + decision speed decide whether you can act inside the attacker's window
    var duringDef=fs.domains.detect && fs.soc>=2.5 && speed>=4;
    var duringAtt=!fs.domains.detect || speed<=2;
    // AFTER: governance + board accountability decide whether you learn, disclose, and recover
    var afterDef=fs.domains.govern && independence>=4;
    var afterAtt=!fs.domains.govern;
    var P=PHASE_TEXT[L](fs,ms,{orphanN:orphanN});
    [['before',beforeAtt,beforeDef,P.before],['during',duringAtt,duringDef,P.during],['after',afterAtt,afterDef,P.after]].forEach(function(ph){
      var key=ph[0],att=ph[1],def=ph[2],txt=ph[3];
      var card=document.createElement('div');card.className='phase-card';
      card.innerHTML=
        '<div class="phase-top"><div class="phase-domain">'+t('ph'+cap(key)+'Dom')+'</div><div class="phase-name">'+t('ph'+cap(key)+'Name')+'</div></div>'+
        '<div class="phase-edge phase-att"><div class="who"><span class="dot"></span>'+t('whoAtt')+'</div><p>'+txt.att+'</p></div>'+
        '<div class="phase-edge phase-def"><div class="who"><span class="dot"></span>'+t('whoDef')+'</div><p>'+txt.def+'</p></div>';
      // tilt: who holds the advantage in this phase for this structure
      var tilt,tcls;
      if(att&&!def){tilt=t('tiltAtt');tcls='att';}
      else if(def&&!att){tilt=t('tiltDef');tcls='def';}
      else{tilt=t('tiltEven');tcls='even';}
      var tl=document.createElement('div');tl.className='phase-tilt '+tcls;tl.textContent=tilt;
      card.appendChild(tl);
      grid.appendChild(card);
    });
  }
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

  /* capability + dependency flags per language */
  var FLAGS_EXTRA={
    en:function(flag,fs,deps){
      if(!fs.domains.proactive)flag('neg','No proactive cyber risk layer.','Without a CROC or exposure management, the function only reacts. The attack happens before the alert.');else flag('pos','A proactive layer exists.','Cyber risk is framed before the incident, not just chased after it.');
      if(!fs.domains.govern)flag('neg','Governance and compliance is missing.','Under NIS2, DORA, and SEC scrutiny, the board cannot prove oversight without it.');
      if(!fs.domains.detect)flag('neg','No detection and response under the CISO.','Authority with no SOC is a title, not a defense.');
      if(fs.covered>=4)flag('pos','The function spans all four domains.','Detect and respond, govern, proactive risk, and identity are all owned. A complete capability.');
      depFlags(flag,deps,'en');
    },
    es:function(flag,fs,deps){
      if(!fs.domains.proactive)flag('neg','No hay capa proactiva de ciber riesgo.','Sin un CROC o gestión de exposición, la función solo reacciona. El ataque ocurre antes de la alerta.');else flag('pos','Existe una capa proactiva.','El ciber riesgo se encuadra antes del incidente, no solo se persigue después.');
      if(!fs.domains.govern)flag('neg','Falta gobierno y cumplimiento.','Bajo el escrutinio de NIS2, DORA y la SEC, el directorio no puede demostrar supervisión sin esto.');
      if(!fs.domains.detect)flag('neg','Sin detección y respuesta bajo el CISO.','Autoridad sin SOC es un título, no una defensa.');
      if(fs.covered>=4)flag('pos','La función abarca los cuatro dominios.','Detección y respuesta, gobierno, riesgo proactivo e identidad, todos bajo control. Una capacidad completa.');
      depFlags(flag,deps,'es');
    },
    pt:function(flag,fs,deps){
      if(!fs.domains.proactive)flag('neg','Sem camada proativa de ciber risco.','Sem um CROC ou gestão de exposição, a função só reage. O ataque acontece antes do alerta.');else flag('pos','Existe uma camada proativa.','O ciber risco é enquadrado antes do incidente, não apenas perseguido depois.');
      if(!fs.domains.govern)flag('neg','Falta governança e conformidade.','Sob o escrutínio de NIS2, DORA e SEC, o conselho não consegue comprovar supervisão sem isso.');
      if(!fs.domains.detect)flag('neg','Sem detecção e resposta sob o CISO.','Autoridade sem SOC é um título, não uma defesa.');
      if(fs.covered>=4)flag('pos','A função abrange os quatro domínios.','Detecção e resposta, governança, risco proativo e identidade, todos sob controle. Uma capacidade completa.');
      depFlags(flag,deps,'pt');
    }
  };
  function depFlags(flag,deps,lang){
    var orphans=Object.keys(deps).filter(function(k){return deps[k].owner==='NOBODY';});
    var managed=Object.keys(deps).filter(function(k){return ['NOBODY','NA'].indexOf(deps[k].owner)===-1;});
    var names=orphans.map(fnLabel).join(', ');
    var mnames=managed.map(fnLabel).join(', ');
    if(lang==='en'){
      if(orphans.length)flag('neg','No one owns '+names+'.','An unowned capability is not a gap you manage. It is a hole nobody is watching. Assign it before an attacker finds it.');
      if(managed.length)flag('neu',managed.length+' capabilit'+(managed.length>1?'ies':'y')+' owned outside the CISO: '+mnames+'.','You can still be held responsible for risk you do not control. Each split widens the gap between what you answer for and what you command. Confirm every boundary in writing before you rely on it.');
    }else if(lang==='es'){
      if(orphans.length)flag('neg','Nadie controla '+names+'.','Una capacidad sin dueño no es una brecha que gestionas. Es un hueco que nadie vigila. Asígnala antes de que un atacante la encuentre.');
      if(managed.length)flag('neu',managed.length+' capacidad'+(managed.length>1?'es':'')+' controlada fuera del CISO: '+mnames+'.','Aún puedes ser responsable de un riesgo que no controlas. Cada separación amplía la brecha entre aquello de lo que respondes y aquello que mandas. Confirma cada límite por escrito antes de depender de él.');
    }else{
      if(orphans.length)flag('neg','Ninguém controla '+names+'.','Uma capacidade sem dono não é uma lacuna que você gerencia. É um buraco que ninguém observa. Atribua-a antes que um atacante a encontre.');
      if(managed.length)flag('neu',managed.length+' capacidade'+(managed.length>1?'s':'')+' controlada fora do CISO: '+mnames+'.','Você ainda pode ser responsabilizado por um risco que não controla. Cada separação amplia a lacuna entre aquilo por que você responde e aquilo que comanda. Confirme cada limite por escrito antes de depender dele.');
    }
  }
  var FIGUREHEAD={
    en:function(flag,which){if(which==='fig')flag('neu','A strong line above a thin function.','The authority is real, but a hollow function makes the CISO a figurehead. Build the layer below.');else flag('neu','A strong function under a constrained line.','The capability is real, but the reporting line caps how far its decisions travel. A fire marshal with no authority to clear the building.');},
    es:function(flag,which){if(which==='fig')flag('neu','Una línea fuerte sobre una función delgada.','La autoridad es real, pero una función hueca hace del CISO una figura decorativa. Construye la capa de abajo.');else flag('neu','Una función fuerte bajo una línea limitada.','La capacidad es real, pero la línea de reporte limita cuán lejos llegan sus decisiones. Un jefe de bomberos sin autoridad para evacuar el edificio.');},

  /* helper shared by all langs for gap dependency questions */
  function ownerOfFn(id){return deps[id]||null;}

  var QUESTIONS={
    en:{
      line:function(boss,bn){var a=[];
        a.push({q:'When you need to say no to a decision the business has already committed to, does your line to '+bn+' give you the standing to make it stick?',why:'Authority you cannot exercise under pressure is not authority.'});
        if(boss==='CIO'||boss==='CTO'){a.push({q:'Your boss is rewarded for uptime and delivery. When patching means downtime, or securing means slowing a release, whose incentive wins?',why:'The conflict is structural, not personal. Name it before an incident does.'});a.push({q:'When cyber risk reaches the board, how much of it has been reframed in IT terms before it gets there, and what meaning is lost on the way?'});}
        if(boss==='CRO'){a.push({q:'Does your risk reporting cadence move at the speed of the threat, or at the speed of the risk committee?',why:'Cyber risk does not wait for the quarterly cycle.'});}
        if(boss==='CFO'){a.push({q:'When security spending produces no new feature and no new revenue, how do you keep it from being optimized away inside a budget function?'});}
        if(boss==='GC'){a.push({q:'Independence from IT is total here. What deliberate work are you doing to rebuild the alignment with the technology teams you depend on?'});}
        if(boss==='CEO'){a.push({q:'You have the access. Can you turn exposure into a decision the board can act on, or does the conversation stay technical once you are in the room?',why:'The seat assumes a board-ready CISO. Be honest about whether that is you yet.'});}
        if(boss==='COO'){a.push({q:'Your placement resolves the IT conflict on paper. Does the COO actually carry the enterprise authority to escalate cyber risk to the board?'});}
        a.push({q:'If your reporting line changed tomorrow, would your real influence change with it, or have you built standing that does not depend on the box?'});return a;},
      gap:function(boss,bn,fs,deps,peers,fns){var a=[];
        function gapFor(id,ownedQ,orphanQ){if(fns.indexOf(id)!==-1)return;var o=deps[id];if(!o||o.owner==='NA')return;if(o.owner==='NOBODY')a.push({q:orphanQ,why:'Nobody owns this. It is not a managed boundary, it is an open hole.'});else a.push({q:ownedQ.replace('{owner}',depOwnerLabel(o.owner))});}

      CTO:{why:"The CISO reports to the CTO when security is treated as a technical caretaker function inside the technology organization.",
        fail:"This line fails when security is measured as a drain on velocity. <b>Buried under the builder of the systems, the CISO has the least independence and the longest path to the board.</b>"}
    },
    es:{
      CEO:{why:"El CISO reporta al CEO porque el liderazgo trata el ciber riesgo como central al negocio y quiere la seguridad en la mesa ejecutiva.",
        fail:"Esta línea falla cuando el CISO pierde un padrino interno y termina compitiendo con el CIO por el mismo presupuesto. <b>La autoridad es alta, pero el CISO puede quedar expuesto sin nadie arriba que absorba la fricción.</b>"},
      COO:{why:"El CISO reporta al COO cuando el ciber riesgo se enmarca como continuidad operativa y resiliencia del negocio en marcha.",
        fail:"Esta línea falla cuando la seguridad se juzga solo por si las operaciones siguen avanzando. <b>El riesgo que aún no interrumpe las operaciones se posterga hasta que lo hace.</b>"},
      CRO:{why:"El CISO reporta al CRO para sacar el ciber de tecnología y tratarlo como parte de la agenda de riesgo más amplia, con financiamiento separado de TI.",
        fail:"Esta línea falla cuando el ciber riesgo se maneja como una entrada más del registro de riesgos y pierde su filo técnico. <b>Si al CISO le faltan habilidades blandas para operar en una función de riesgo, el rol se estanca.</b>"},
      GC:{why:"El CISO reporta al Asesor Jurídico porque seguridad y legal comparten el incentivo de mantener a la empresa dentro de sus obligaciones.",
        fail:"Esta línea falla cuando los instintos legales dominan a los técnicos. <b>La estructura puede derivar hacia la defensa de cumplimiento y divulgación, dejando subponderadas la detección y respuesta operativas.</b>"},
      CFO:{why:"El CISO reporta al CFO porque las brechas golpean el resultado financiero, y la línea le da a la seguridad un canal de fondos y una voz en la mesa.",
        fail:"Esta línea falla cuando la inversión en seguridad se juzga con números que aún no puede expresar en números. <b>Una mirada de finanzas primero puede restringir el presupuesto para un riesgo que todavía es mayormente cualitativo.</b>"},
      CIO:{why:"El CISO reporta al CIO bajo la lógica de que el CIO es dueño de la información y el CISO la asegura. Es la línea más común en programas maduros.",
        fail:"Esta línea falla cuando un plan de seguridad amenaza con frenar un proyecto de TI y el CIO lo anula. <b>El mismo ejecutivo es dueño de la entrega y del freno a la entrega, así que el freno pierde.</b>"},
      CTO:{why:"El CISO reporta al CTO cuando la seguridad se trata como una función técnica de cuidado dentro de la organización de tecnología.",
        fail:"Esta línea falla cuando la seguridad se mide como un lastre a la velocidad. <b>Sepultado bajo el constructor de los sistemas, el CISO tiene la menor independencia y el camino más largo al directorio.</b>"}
    },
    pt:{
      CEO:{why:"O CISO reporta ao CEO porque a liderança trata o ciber risco como central ao negócio e quer a segurança na mesa executiva.",
        fail:"Esta linha falha quando o CISO perde um padrinho interno e acaba competindo com o CIO pelo mesmo orçamento. <b>A autoridade é alta, mas o CISO pode ficar exposto sem ninguém acima para absorver o atrito.</b>"},
      COO:{why:"O CISO reporta ao COO quando o ciber risco é enquadrado como continuidade operacional e resiliência do negócio em andamento.",
        fail:"Esta linha falha quando a segurança é julgada apenas por se as operações continuam andando. <b>O risco que ainda não interrompe as operações é despriorizado até que o faça.</b>"},
      CRO:{why:"O CISO reporta ao CRO para tirar o ciber da tecnologia e tratá-lo como parte da agenda de risco mais ampla, com financiamento separado da TI.",
        fail:"Esta linha falha quando o ciber risco é tratado como mais uma entrada no registro de riscos e perde seu fio técnico. <b>Se ao CISO faltam habilidades interpessoais para operar numa função de risco, o papel estagna.</b>"},
      GC:{why:"O CISO reporta ao Diretor Jurídico porque segurança e jurídico compartilham o incentivo de manter a empresa dentro de suas obrigações.",
        fail:"Esta linha falha quando os instintos jurídicos dominam os técnicos. <b>A estrutura pode derivar para a defesa de conformidade e divulgação, deixando subponderadas a detecção e a resposta operacionais.</b>"},
      CFO:{why:"O CISO reporta ao CFO porque violações atingem o resultado financeiro, e a linha dá à segurança um canal de recursos e uma voz na mesa.",
        fail:"Esta linha falha quando o investimento em segurança é julgado por números que ainda não consegue expressar em números. <b>Uma lente de finanças em primeiro lugar pode restringir o orçamento para um risco que ainda é majoritariamente qualitativo.</b>"},
      CIO:{why:"O CISO reporta ao CIO sob a lógica de que o CIO é dono da informação e o CISO a protege. É a linha mais comum em programas maduros.",
        fail:"Esta linha falha quando um plano de segurança ameaça travar um projeto de TI e o CIO o anula. <b>O mesmo executivo é dono da entrega e do freio à entrega, então o freio perde.</b>"},
      CTO:{why:"O CISO reporta ao CTO quando a segurança é tratada como uma função técnica de zeladoria dentro da organização de tecnologia.",
        fail:"Esta linha falha quando a segurança é medida como um peso à velocidade. <b>Soterrado sob o construtor dos sistemas, o CISO tem a menor independência e o caminho mais longo até o conselho.</b>"}
    }
  };
  function renderFailMode(){
    var fm=$('failmode');
    var data=(FAILMODE[L]||FAILMODE.en)[cisoBoss];
    if(!data){fm.style.display='none';return;}
    fm.style.display='block';
    $('fm-head').textContent=fmt(t('fmHead'),{})+' \u00b7 '+roleLabel(cisoBoss);
    $('fm-why').textContent=data.why;
    $('fm-fail').innerHTML=data.fail;
  }

  function setLang(l){
    L=l;
    document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-l')===l);});
    paintStatic();
    start(); // restart the conversation in the new language for a clean state
  }
  document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.getAttribute('data-l'));});});
  $('restart').addEventListener('click',start);
  /* assemble the executive report from current state, then print */
  function repText(L,key){return (T[L]&&T[L][key])||T.en[key];}
  function buildReport(){
    if(!cisoBoss||!MSCORE[cisoBoss])return false;
    var ms=MSCORE[cisoBoss],mt=MTEXT[L][cisoBoss],fs=functionScores();
    var bn=roleLabel(cisoBoss);
    var orphanIds=Object.keys(deps).filter(function(k){return deps[k].owner==='NOBODY';});
    var orphanN=orphanIds.length;
    var capGap=(5-fs.soc)+(5-fs.gov)+(5-fs.cro)+(5-fs.comp);
    var gap=Math.round(Math.min(92,ms.seam+capGap*1.6+orphanN*4));
    var lineStrong=(ms.s.independence+ms.s.board)/2>=4, fnStrong=fs.covered>=3&&fs.cro>=2;
    // cover
    $('rep-eyebrow').textContent=t('repEyebrow');
    $('rep-title').textContent=mt.name;
    var now=new Date();var ds=now.toLocaleDateString(L==='es'?'es-MX':L==='pt'?'pt-BR':'en-US',{year:'numeric',month:'long',day:'numeric'});
    $('rep-meta').innerHTML='<b>'+t('repMetaLine')+':</b> '+bn+' &nbsp;·&nbsp; <b>'+t('repMetaDate')+':</b> '+ds;
    // verdict + summary
    var gapWord=gap<=28?t('narrow'):gap<=48?t('moderate'):t('wide');
    $('rep-verdict').textContent=mt.sub;
    // plain-English summary assembled from structure
    var summary=buildSummary(L,bn,lineStrong,fnStrong,gap,gapWord,orphanN);
    $('rep-summary').textContent=summary;
    // structure tree: clone the live mapped structure into the report
    $('rep-tree-h').textContent=t('repTreeH');
    var rt=$('rep-tree');rt.innerHTML='';
    var liveHolder=tree.querySelector('.dyn');
    if(liveHolder){rt.appendChild(liveHolder.cloneNode(true));$('rep-tree-wrap').style.display='block';}
    else{$('rep-tree-wrap').style.display='none';}
    // scores
    $('rep-scores-h').textContent=t('repScoresH');
    var sg=$('rep-scoregrid');sg.innerHTML='';
    function scoreCol(title,rows){
      var col=document.createElement('div');var h=document.createElement('div');h.className='rep-scorecol-h';h.textContent=title;col.appendChild(h);
      rows.forEach(function(r){var d=document.createElement('div');d.className='rep-score';
        var col2=r.v>=4?'#138a5e':r.v>=2.5?'#9a6a00':'#b00';
        d.innerHTML='<span class="rep-score-label">'+r.label+'</span><span class="rep-score-track"><span class="rep-score-fill" style="width:'+(r.v/5*100)+'%;background:'+col2+'"></span></span><span class="rep-score-num">'+r.v.toFixed(1)+' / 5</span>';
        col.appendChild(d);});
      return col;
    }
    var lineRows=[['independence',t('mIndependence')],['conflict',t('mConflict')],['speed',t('mSpeed')],['board',t('mBoard')],['alignment',t('mAlignment')]].map(function(p){return {label:p[1],v:ms.s[p[0]]};});
    var fnRows=[{label:t('mSoc'),v:fs.soc},{label:t('mGov'),v:fs.gov},{label:t('mCro'),v:fs.cro},{label:t('mStrat'),v:fs.strat},{label:t('mComp'),v:fs.comp}];
    sg.appendChild(scoreCol(t('repLineH'),lineRows));
    sg.appendChild(scoreCol(t('repFnH'),fnRows));
    var gcol=gap<=28?'#138a5e':gap<=48?'#9a6a00':'#b00';
    $('rep-gap').innerHTML='<b>'+t('seamTitle').split('·')[0].trim()+':</b> <span class="g-val" style="color:'+gcol+'">'+gapWord+' · '+gap+'</span>. '+(orphanN>0?fmt(t('seamOrphan'),{n:orphanN,s:orphanN>1?'s':''}):(gap<=28?t('seamTight'):gap<=48?t('seamMod'):t('seamWide')));
    // failure mode
    var fmd=(FAILMODE[L]||FAILMODE.en)[cisoBoss];
    $('rep-fail-h').textContent=t('repFailH')+' · '+bn;
    $('rep-fail-why').textContent=fmd?fmd.why:'';
    $('rep-fail-fail').innerHTML=fmd?fmd.fail:'';
    // orphans
    var ow=$('rep-orphan-wrap');
    if(orphanN>0){ow.style.display='block';$('rep-orphan-h').textContent=t('repOrphanH');$('rep-orphan-body').textContent=t('ugBody');var ol=$('rep-orphan-list');ol.innerHTML='';orphanIds.forEach(function(id){var c=document.createElement('span');c.className='rep-orphan-chip';c.textContent=fnLabel(id);ol.appendChild(c);});}
    else ow.style.display='none';
    // phases
    $('rep-phase-h').textContent=t('repPhaseH');
    var pg=$('rep-phasegrid');pg.innerHTML='';
    var boardAccess=ms.s.board,speed=ms.s.speed,independence=ms.s.independence;
    var beforeDef=fs.domains.proactive&&fs.cro>=2.5&&boardAccess>=4,beforeAtt=!fs.domains.proactive||orphanN>0;
    var duringDef=fs.domains.detect&&fs.soc>=2.5&&speed>=4,duringAtt=!fs.domains.detect||speed<=2;
    var afterDef=fs.domains.govern&&independence>=4,afterAtt=!fs.domains.govern;
    var P=PHASE_TEXT[L](fs,ms,{orphanN:orphanN});
    [['before',beforeAtt,beforeDef,P.before],['during',duringAtt,duringDef,P.during],['after',afterAtt,afterDef,P.after]].forEach(function(ph){
      var key=ph[0],att=ph[1],def=ph[2],txt=ph[3];
      var card=document.createElement('div');card.className='rep-phase';
      var tilt,tcls;if(att&&!def){tilt=t('tiltAtt');tcls='att';}else if(def&&!att){tilt=t('tiltDef');tcls='def';}else{tilt=t('tiltEven');tcls='even';}
      card.innerHTML='<div class="rep-phase-dom">'+t('ph'+cap(key)+'Dom')+'</div><div class="rep-phase-name">'+t('ph'+cap(key)+'Name')+'</div>'+
        '<div class="rep-phase-edge rep-phase-att"><span class="who">'+t('whoAtt')+'</span>'+txt.att+'</div>'+
        '<div class="rep-phase-edge rep-phase-def"><span class="who">'+t('whoDef')+'</span>'+txt.def+'</div>'+
        '<div class="rep-phase-tilt '+tcls+'">'+tilt+'</div>';
      pg.appendChild(card);
    });
    // findings: pull the flag set (line flags + capability flags + figurehead/marshal)
    $('rep-find-h').textContent=t('repFindH');
    var fnd=$('rep-findings');fnd.innerHTML='';
    var collected=[];
    function collect(tp,b,x){collected.push('<b>'+b+'</b> '+x);}
    mt.flags.forEach(function(fl){collect(fl[0],fl[1],fl[2]);});
    FLAGS_EXTRA[L](collect,fs,deps);
    if(lineStrong&&!fnStrong)FIGUREHEAD[L](collect,'fig');
    if(!lineStrong&&fnStrong)FIGUREHEAD[L](collect,'marshal');
    collected.forEach(function(h){var d=document.createElement('div');d.className='rep-finding';d.innerHTML=h;fnd.appendChild(d);});
    // standards (full grounding, every citation)
    $('rep-std-h').textContent=t('repStdH');
    $('rep-std-sub').textContent=t('standardsSub');
    var sl=$('rep-std-list');sl.innerHTML='';
    STANDARDS[L](fs,ms).forEach(function(it){
      var d=document.createElement('div');d.className='rep-std-item';
      d.innerHTML='<div class="rep-std-org">'+it.org+'</div><div class="rep-std-prov">'+it.prov+'</div>'+
        '<p class="rep-std-quote">\u201C'+it.quote+'\u201D</p><p class="rep-std-rec">'+it.rec+'</p>';
      sl.appendChild(d);
    });
    $('rep-foot').textContent=t('repFoot');
    return true;
  }
  function buildSummary(L,bn,lineStrong,fnStrong,gap,gapWord,orphanN){
    var EN=function(){
      var a="In this structure the CISO reports to "+bn+". ";
      a+= lineStrong? "The line carries real authority: cyber risk reaches accountable leadership with limited filtering. " : "The line is distanced from accountable leadership, so cyber risk is filtered before it is seen at the top. ";
      a+= fnStrong? "The function beneath the CISO is broad enough to detect and act on that risk. " : "The function beneath the CISO is thin, which limits its ability to detect and act. ";
      a+= orphanN>0? ("There "+(orphanN>1?"are ":"is ")+orphanN+" capabilit"+(orphanN>1?"ies":"y")+" no one owns, widening the exposure. ") : "";
      a+= "The exposure gap is "+gapWord.toLowerCase()+" at "+gap+" of 100. The findings and standards below set out where this structure starts to fail and what the board is accountable for.";
      return a;
    };
    var ES=function(){
      var a="En esta estructura el CISO reporta a "+bn+". ";
      a+= lineStrong? "La línea tiene autoridad real: el ciber riesgo llega al liderazgo responsable con poco filtrado. " : "La línea está alejada del liderazgo responsable, así que el ciber riesgo se filtra antes de verse arriba. ";
      a+= fnStrong? "La función bajo el CISO es lo bastante amplia para detectar y actuar sobre ese riesgo. " : "La función bajo el CISO es delgada, lo que limita su capacidad de detectar y actuar. ";
      a+= orphanN>0? ("Hay "+orphanN+" capacidad"+(orphanN>1?"es":"")+" que nadie controla, lo que amplía la exposición. ") : "";
      a+= "La brecha de exposición es "+gapWord.toLowerCase()+" en "+gap+" de 100. Los hallazgos y estándares siguientes muestran dónde empieza a fallar esta estructura y de qué responde el directorio.";
      return a;
    };
    var PT=function(){
      var a="Nesta estrutura o CISO reporta a "+bn+". ";
      a+= lineStrong? "A linha tem autoridade real: o ciber risco chega à liderança responsável com pouca filtragem. " : "A linha está distante da liderança responsável, então o ciber risco é filtrado antes de ser visto no topo. ";
      a+= fnStrong? "A função abaixo do CISO é ampla o bastante para detectar e agir sobre esse risco. " : "A função abaixo do CISO é fina, o que limita sua capacidade de detectar e agir. ";
      a+= orphanN>0? ("Há "+orphanN+" capacidade"+(orphanN>1?"s":"")+" que ninguém controla, ampliando a exposição. ") : "";
      a+= "A lacuna de exposição é "+gapWord.toLowerCase()+" em "+gap+" de 100. Os achados e padrões a seguir mostram onde esta estrutura começa a falhar e pelo que o conselho responde.";
      return a;
    };
    return L==='es'?ES():L==='pt'?PT():EN();
  }

  $('export').addEventListener('click',function(){if(buildReport())window.print();});

  // detect browser language: es or pt if matched, else en
  var nav=(navigator.language||navigator.userLanguage||'en').toLowerCase();
  var initial=nav.indexOf('es')===0?'es':nav.indexOf('pt')===0?'pt':'en';
  setLang(initial);
})();
</script>
