#ocean-bg canvas{display:block;}
@keyframes waveDrift{from{background-position:0 0,0 0;}to{background-position:1200px 0,-900px 0;}}
@keyframes hazeFloat{0%{transform:translate3d(-2%,0,0) scale(1.05);}50%{transform:translate3d(2%,-1%,0) scale(1.09);}100%{transform:translate3d(-2%,0,0) scale(1.05);}}
#wrap{position:relative;z-index:1;min-height:calc(var(--vh, 1vh) * 100);display:flex;align-items:center;justify-content:center;background:transparent;}
#stage{position:fixed;inset:0;width:calc(var(--vw, 1vw) * 100);height:calc(var(--vh, 1vh) * 100);overflow:hidden;background:transparent;border-radius:0;box-shadow:none;}
.bg1{display:none;}
.bg2{display:none;}
.bg3{display:none;}
.bg4{display:none;}
.bg5{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(4,5,7,.35) 32%,rgba(4,5,7,.12) 56%,rgba(4,5,7,0) 70%);}
#compass-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
/* UI overlays */
#lang-bar{position:absolute;top:10px;right:10px;z-index:100;}
#lang-toggle{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.15);cursor:pointer;font-weight:600;font-size:11px;font-family:Inter,system-ui,sans-serif;letter-spacing:.04em;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;transition:all .2s;}
#lang-toggle:hover{background:rgba(0,0,0,.65);}
.lang-caret{font-size:9px;opacity:.7;transition:transform .18s;}
#lang-toggle[aria-expanded="true"] .lang-caret{transform:rotate(180deg);}
#lang-menu{position:absolute;top:calc(100% + 6px);right:0;display:none;flex-direction:column;gap:2px;background:rgba(15,15,18,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px;min-width:64px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
#lang-menu.open{display:flex;}
#lang-menu button{padding:5px 9px;border-radius:5px;border:none;cursor:pointer;font-weight:600;font-size:10px;font-family:Inter,system-ui,sans-serif;letter-spacing:.04em;text-align:left;background:rgba(255,255,255,.06);color:#888;transition:all .15s;}
#lang-menu button:hover{background:rgba(255,255,255,.14);color:#ddd;}
#compass-title{position:absolute;top:14px;left:16px;z-index:100;font-family:Inter,Arial,Helvetica,sans-serif;font-size:clamp(16px,3vmin,32px);font-weight:700;color:#a8a8a8;letter-spacing:.2px;line-height:1.2;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5);}
#compass-title-badges{position:absolute;top:calc(14px + clamp(16px,3vmin,32px)*1.2 + 10px);left:16px;z-index:100;display:flex;gap:clamp(4px,1vmin,8px);flex-wrap:wrap;}
.title-badge-link{font-family:Inter,Arial,Helvetica,sans-serif;font-size:clamp(8px,1.6vmin,11px);font-weight:600;letter-spacing:.16em;color:#8a2226;border:1px solid rgba(138,34,38,.75);border-radius:3px;padding:clamp(2px,0.6vmin,4px) clamp(6px,1.5vmin,10px);background:rgba(0,0,0,.5);text-decoration:none;pointer-events:auto;cursor:pointer;transition:color .15s ease,border-color .15s ease,background-color .15s ease;}
.title-badge-link:hover{color:#e0464c;border-color:rgba(224,70,76,.9);background:rgba(30,8,9,.6);}
#credit{position:absolute;bottom:10px;left:12px;z-index:100;font-family:Inter,Arial,sans-serif;font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.04em;line-height:1.6;pointer-events:auto;}
#pub-link{position:absolute;bottom:10px;right:12px;z-index:100;font-family:Inter,Arial,sans-serif;font-size:8px;color:rgba(255,255,255,.35);letter-spacing:.03em;line-height:1.6;text-align:right;max-width:52%;pointer-events:auto;}
/* Tooltip */
#tt{position:absolute;pointer-events:none;z-index:300;opacity:0;transition:opacity .2s ease;width:285px;background:rgba(8,10,12,.94);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:14px 16px;backdrop-filter:blur(12px);}
#tt.on{opacity:1;}
#tt-h{font-family:Inter,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#E01C24;margin-bottom:4px;}
#tt-s{font-family:Inter,Arial,sans-serif;font-size:9px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:10px;}
#tt-b{font-family:Inter,Arial,sans-serif;font-size:11px;line-height:1.7;color:rgba(255,255,255,.78);}
/* Hit areas */
#hits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;cursor:default;}
#hits path{pointer-events:all;cursor:pointer;fill:transparent;}
</style>
</head>

  en:[
    {h:"Cyber Risk Management",s:"Before a Breach · Proactive & Predictive",
     b:"The true north of your cybersecurity compass. Without it, organizations drift from crisis to crisis, reacting, recovering, never truly reducing risk. Cyber Risk Management is the proactive and predictive discipline that anticipates threats before they materialize, prioritizes what matters most, optimizes security investments, and gives executives a clear language to make strategic decisions. Cybercriminals are not only searching for technical vulnerabilities. They are looking for the uncertainty and indecision that comes from having no north. This is what closes that gap."},
    {h:"Detection and Response",s:"During a Breach · Reactive & Defensive",
     b:"In cybersecurity, it is not a matter of if storms will strike, but when. Detection and Response is your crew in the heart of the tempest: eyes on every signal, hands on every control. It identifies threats as they unfold, contains the breach before it spreads, and responds with speed and precision. Essential, but never sufficient alone. The organizations that only know how to weather storms will spend their entire voyage waiting for the next one. The compass demands more."},
    {h:"Cyber Resilience",s:"After a Breach · Recover & Improve · An Outcome",

    {h:"Gestion du Cyber Risque",s:"Avant une Brèche · Proactif et Prédictif",

    {h:"Détection et Réponse",s:"Pendant une Brèche · Réactif et Défensif",

  de:[
    {h:"Cyber-Risikomanagement",s:"Vor einem Sicherheitsvorfall · Proaktiv und Vorausschauend",
     b:"Der wahre Norden Ihres Cybersicherheits-Kompasses. Ohne ihn treiben Organisationen von Krise zu Krise, reagieren, erholen sich, ohne das Risiko jemals wirklich zu senken. Cyber-Risikomanagement ist die proaktive und vorausschauende Disziplin, die Bedrohungen erkennt, bevor sie eintreten, das Wichtigste priorisiert, Sicherheitsinvestitionen optimiert und Führungskräften eine klare Sprache für strategische Entscheidungen gibt. Cyberkriminelle suchen nicht nur nach technischen Schwachstellen. Sie suchen die Unsicherheit und Unentschlossenheit, die entsteht, wenn kein Norden vorhanden ist. Genau das schließt diese Lücke."},
    {h:"Erkennung und Reaktion",s:"Während eines Sicherheitsvorfalls · Reaktiv und Defensiv",
     b:"In der Cybersicherheit ist es keine Frage, ob Stürme aufziehen, sondern wann. Erkennung und Reaktion ist Ihre Mannschaft im Herzen des Sturms: Augen auf jedem Signal, Hände an jedem Steuer. Sie erkennt Bedrohungen, während sie sich entwickeln, dämmt den Vorfall ein, bevor er sich ausbreitet, und reagiert mit Geschwindigkeit und Präzision. Unerlässlich, aber allein niemals ausreichend. Organisationen, die nur wissen, wie man Stürme überlebt, verbringen ihre gesamte Reise damit, auf den nächsten zu warten. Der Kompass fordert mehr."},
    {h:"Cyber-Resilienz",s:"Nach einem Sicherheitsvorfall · Wiederherstellen und Verbessern · Ein Ergebnis",
     b:"Cyber-Resilienz ist keine Phase, in die man nach einem Vorfall eintritt. Sie ist das Ergebnis, alles andere richtig gemacht zu haben. Wenn Ihr Norden durch proaktives Risikomanagement festgelegt ist und Ihre Mannschaft im Sturm präzise reagiert, ist Resilienz das, was Sie sich verdienen. Das bedeutet, den Betrieb schneller wiederherzustellen, aus Fehlern zu lernen, das Exponierte zu härten und diese Erkenntnisse in Ihren Kompass zurückzuspeisen. Organisationen, die echte Cyber-Resilienz erreichen, überleben Stürme nicht nur. Sie werden mit jedem überstandenen Sturm schwerer zu versenken."}

  ja:[
    {h:"サイバーリスクマネジメント",s:"侵害前・プロアクティブかつ予測的",
     b:"サイバーセキュリティ・コンパスの真北。これがなければ、組織は危機から危機へと漂流し、対応と復旧を繰り返すだけで、リスクを本質的に減らすことは決してない。サイバーリスクマネジメントは、脅威が現実化する前に予測し、最も重要な事項を優先し、セキュリティ投資を最適化し、経営層が戦略的な意思決定を行うための明確な言語を提供する、プロアクティブかつ予測的な規律だ。サイバー犯罪者が狙っているのは技術的な脆弱性だけではない。真北を持たないことから生まれる不確実性と迷いこそが、彼らの標的だ。これを埋めるのがこの規律である。"},
    {h:"検知と対応",s:"侵害中・リアクティブかつ防御的",
     b:"サイバーセキュリティにおいて、問題は嵐が来るかどうかではなく、いつ来るかだ。検知と対応は、嵐の真っ只中にいるクルーそのものであり、すべての信号に目を配り、すべての制御に手をかける。脅威が展開する瞬間を捉え、侵害が広がる前に封じ込め、迅速かつ的確に対応する。不可欠だが、それだけでは決して十分ではない。嵐をやり過ごすことしか知らない組織は、航海のすべての時間を次の嵐を待つことに費やすだけだ。コンパスはそれ以上を要求する。"},
    {h:"サイバーレジリエンス",s:"侵害後・復旧と改善・一つの成果",
     b:"サイバーレジリエンスは、インシデントの後に入るフェーズではない。それは、他のすべてを正しく行った結果として得られる成果だ。プロアクティブなリスクマネジメントによって真北が定まり、クルーが嵐の中で的確に対応すれば、レジリエンスはその先に手に入る。運用をより速く復旧させ、失敗から学び、露出した部分を強化し、その知見をコンパスへ還元することを意味する。真のサイバーレジリエンスを実現した組織は、単に嵐を生き延びるだけではない。乗り越えた嵐の数だけ、沈みにくくなっていくのだ。"}

  ar:[
    {h:"إدارة المخاطر السيبرانية",s:"قبل الاختراق · استباقي واستشرافي",
     b:"الشمال الحقيقي لبوصلة الأمن السيبراني في مؤسستك. بدونها، تنجرف المؤسسات من أزمة إلى أزمة، فتتفاعل وتتعافى، دون أن تُخفّض المخاطر فعليًا في أي وقت. إدارة المخاطر السيبرانية هي المنهجية الاستباقية والاستشرافية التي تستشرف التهديدات قبل أن تتجسّد، وتُرتّب الأولويات بحسب الأهمية الحقيقية، وتُحسّن استثمارات الأمن، وتمنح القيادات التنفيذية لغة واضحة لاتخاذ القرارات الاستراتيجية. المجرمون السيبرانيون لا يبحثون فقط عن الثغرات التقنية. بل يبحثون عن حالة عدم اليقين والتردد الناتجة عن غياب هذا الشمال. وهذا بالضبط ما يُغلق تلك الفجوة."},
    {h:"الكشف والاستجابة",s:"خلال الاختراق · تفاعلي ودفاعي",
     b:"في الأمن السيبراني، لا يتعلق الأمر بما إذا كانت العاصفة ستضرب، بل بمتى ستضرب. الكشف والاستجابة هو طاقمك في قلب العاصفة: أعين مركّزة على كل إشارة، وأيدٍ على كل عنصر تحكم. فهو يحدد التهديدات لحظة ظهورها، ويحتوي الاختراق قبل أن ينتشر، ويستجيب بسرعة ودقة. أساسي، لكنه لا يكفي وحده أبدًا. المؤسسات التي لا تعرف سوى مواجهة العواصف ستقضي رحلتها كاملة في انتظار العاصفة التالية. البوصلة تتطلب أكثر من ذلك."},
    {h:"المرونة السيبرانية",s:"بعد الاختراق · التعافي والتحسين · نتيجة واحدة",
     b:"المرونة السيبرانية ليست مرحلة تدخلها المؤسسة بعد وقوع حادثة. بل هي النتيجة الطبيعية لفعل كل شيء آخر بالشكل الصحيح. فحين يتحدد شمالك من خلال إدارة استباقية للمخاطر، ويستجيب طاقمك بدقة خلال العاصفة، تكون المرونة هي ما تكسبه. وهذا يعني استعادة العمليات بشكل أسرع، والتعلّم من نقاط الفشل، وتحصين ما تعرّض للخطر، وإعادة تغذية تلك المعرفة إلى بوصلتك. المؤسسات التي تحقق مرونة سيبرانية حقيقية لا تنجو من العواصف فقط. بل تصبح أصعب على الغرق مع كل عاصفة تجتازها."}

  "zh-tw":[
    {h:"網路風險管理",s:"入侵前 · 主動預測",
     b:"這是你的網路安全指南針真正指向的方向。沒有它，組織只能在一次次危機中掙扎，不斷應對、不斷恢復，卻始終無法真正降低風險。網路風險管理是一種主動且預測性的方法論，它在威脅尚未成形之前就提前識別，把資源優先投向真正重要的地方，最佳化安全投入，並為管理層提供清晰的語言來做出戰略決策。網路犯罪分子尋找的不僅是技術上的漏洞，他們更在尋找因缺乏方向而產生的不確定和猶豫。而這正是網路風險管理要填補的缺口。"},
    {h:"偵測與應變",s:"入侵中 · 被動防禦",
     b:"在網路安全領域，問題從來不是風暴會不會來，而是什麼時候來。偵測與應變就是你在風暴中心的團隊：眼睛盯住每一個訊號，雙手隨時準備操作每一個控制點。它能在威脅剛剛顯現時就識別出來，在入侵擴散之前將其遏制，並以速度和精準做出響應。它至關重要，但從來不足以單獨依靠。那些只懂得硬扛風暴的組織，會把整段航程都耗在等待下一場風暴上。指南針要求的，遠不止於此。"},
    {h:"網路韌性",s:"入侵後 · 恢復與改進 · 一種結果",
     b:"網路韌性不是發生事件之後才進入的一個階段，而是把其他所有環節都做對之後自然產生的結果。當你的方向由主動的風險管理確定，你的團隊又能在風暴中精準應對，韌性就是你所獲得的回報。它意味著更快恢復運營，從失敗中學習，加固已經暴露的部分，並把這些經驗重新反饋進你的指南針。真正實現網路韌性的組織，不只是在風暴中存活下來，而是每經歷一次風暴，就變得更難被擊沉。"}
  ],
  "zh-cn":[
    {h:"网络风险管理",s:"入侵前 · 主动预测",
     b:"这是你的网络安全指南针真正指向的方向。没有它，组织只能在一次次危机中挣扎，不断应对、不断恢复，却始终无法真正降低风险。网络风险管理是一种主动且预测性的方法论，它在威胁尚未成形之前就提前识别，把资源优先投向真正重要的地方，优化安全投入，并为管理层提供清晰的语言来做出战略决策。网络犯罪分子寻找的不仅是技术上的漏洞，他们更在寻找因缺乏方向而产生的不确定和犹豫。而这正是网络风险管理要填补的缺口。"},
    {h:"检测与响应",s:"入侵中 · 被动防御",
     b:"在网络安全领域，问题从来不是风暴会不会来，而是什么时候来。检测与响应就是你在风暴中心的团队：眼睛盯住每一个信号，双手随时准备操作每一个控制点。它能在威胁刚刚显现时就识别出来，在入侵扩散之前将其遏制，并以速度和精准做出响应。它至关重要，但从来不足以单独依靠。那些只懂得硬扛风暴的组织，会把整段航程都耗在等待下一场风暴上。指南针要求的，远不止于此。"},
    {h:"网络韧性",s:"入侵后 · 恢复与改进 · 一种结果",
     b:"网络韧性不是发生事件之后才进入的一个阶段，而是把其他所有环节都做对之后自然产生的结果。当你的方向由主动的风险管理确定，你的团队又能在风暴中精准应对，韧性就是你所获得的回报。它意味着更快恢复运营，从失败中学习，加固已经暴露的部分，并把这些经验重新反馈进你的指南针。真正实现网络韧性的组织，不只是在风暴中存活下来，而是每经历一次风暴，就变得更难被击沉。"}

  ko:[
    {h:"사이버 리스크 관리",s:"침해 이전 · 선제적이고 예측적인",
     b:"당신의 사이버보안 나침반이 가리키는 진짜 북쪽이다. 이것이 없으면 조직은 위기에서 위기로 표류하며, 대응하고 복구하기만 반복할 뿐 리스크를 실제로 줄이지는 못한다. 사이버 리스크 관리는 위협이 현실화되기 전에 이를 예측하고, 가장 중요한 것에 우선순위를 두고, 보안 투자를 최적화하며, 경영진에게 전략적 의사결정을 위한 명확한 언어를 제공하는 선제적이고 예측적인 규율이다. 사이버 범죄자들이 노리는 것은 기술적 취약점만이 아니다. 그들이 진짜로 노리는 것은 북쪽이 없을 때 생기는 불확실성과 망설임이다. 이 간극을 메우는 것이 바로 사이버 리스크 관리다."},
    {h:"탐지 및 대응",s:"침해 도중 · 반응적이고 방어적인",
     b:"사이버보안에서 문제는 폭풍이 올지 여부가 아니라 언제 오느냐다. 탐지 및 대응은 폭풍의 한가운데에 있는 당신의 팀이다. 모든 신호에 눈을 두고, 모든 제어 장치에 손을 올려 놓는다. 위협이 전개되는 순간을 포착하고, 침해가 확산되기 전에 억제하며, 신속하고 정확하게 대응한다. 반드시 필요하지만, 그것만으로는 결코 충분하지 않다. 폭풍을 견디는 법만 아는 조직은 항해 전체를 다음 폭풍을 기다리는 데 써버릴 뿐이다. 나침반은 그 이상을 요구한다."},
    {h:"사이버 레질리언스",s:"침해 이후 · 복구와 개선 · 하나의 결과",
     b:"사이버 레질리언스는 사고 이후에 들어서는 단계가 아니다. 그것은 다른 모든 것을 제대로 해냈을 때 얻어지는 결과다. 선제적인 리스크 관리로 진짜 북쪽이 정해지고, 팀이 폭풍 속에서 정확하게 대응할 때, 레질리언스는 그 대가로 얻어진다. 이는 더 빠르게 운영을 복구하고, 실패에서 배우고, 노출된 부분을 강화하고, 그 지식을 다시 나침반에 반영하는 것을 의미한다. 진정한 사이버 레질리언스를 이룬 조직은 단순히 폭풍에서 살아남는 것이 아니다. 폭풍을 겪을수록 더 침몰시키기 어려운 조직이 되어간다."}

  hi:[
    {h:"साइबर जोखिम प्रबंधन",s:"उल्लंघन से पहले · सक्रिय और पूर्वानुमानी",
     b:"यही वह सच्ची उत्तर दिशा है जिसकी ओर आपका साइबर सुरक्षा कम्पास इशारा करता है। इसके बिना, संगठन एक संकट से दूसरे संकट की ओर बहते रहते हैं, प्रतिक्रिया देते हैं, उबरते हैं, लेकिन जोखिम को वास्तव में कभी कम नहीं कर पाते। साइबर जोखिम प्रबंधन वह सक्रिय और पूर्वानुमानी अनुशासन है जो खतरों के साकार होने से पहले ही उनका अनुमान लगाता है, सबसे महत्वपूर्ण चीज़ों को प्राथमिकता देता है, सुरक्षा निवेश को अनुकूलित करता है, और नेतृत्व को रणनीतिक फ़ैसले लेने के लिए एक स्पष्ट भाषा देता है। साइबर अपराधी सिर्फ़ तकनीकी कमज़ोरियाँ नहीं खोजते। वे उस अनिश्चितता और अनिर्णय को खोजते हैं जो दिशा न होने से पैदा होती है। यही वह अंतर है जिसे यह अनुशासन भरता है।"},
    {h:"पहचान और प्रतिक्रिया",s:"उल्लंघन के दौरान · प्रतिक्रियात्मक और सुरक्षात्मक",
     b:"साइबर सुरक्षा में सवाल यह नहीं है कि तूफ़ान आएगा या नहीं, बल्कि यह है कि कब आएगा। पहचान और प्रतिक्रिया तूफ़ान के केंद्र में मौजूद आपकी टीम है: हर संकेत पर नज़र, हर नियंत्रण पर हाथ। यह उभरते ही खतरों की पहचान करती है, फैलने से पहले उल्लंघन को रोकती है, और तेज़ी और सटीकता से प्रतिक्रिया देती है। यह अनिवार्य है, लेकिन अकेले कभी पर्याप्त नहीं। जो संगठन सिर्फ़ तूफ़ान झेलना जानते हैं, वे अपनी पूरी यात्रा अगले तूफ़ान का इंतज़ार करने में बिता देंगे। कम्पास इससे कहीं अधिक की मांग करता है।"},
    {h:"साइबर रेज़िलिएंस",s:"उल्लंघन के बाद · रिकवरी और सुधार · एक परिणाम",

  it:[
    {h:"Gestione del Rischio Cyber",s:"Prima di una Violazione · Proattivo e Predittivo",
     b:"Il vero nord della tua bussola della cybersicurezza. Senza di essa, le organizzazioni vanno alla deriva da una crisi all'altra, reagendo, recuperando, senza mai ridurre realmente il rischio. La Gestione del Rischio Cyber è la disciplina proattiva e predittiva che anticipa le minacce prima che si materializzino, dà priorità a ciò che conta davvero, ottimizza gli investimenti in sicurezza e offre ai dirigenti un linguaggio chiaro per prendere decisioni strategiche. I criminali informatici non cercano solo vulnerabilità tecniche. Cercano l'incertezza e l'indecisione che nascono dall'assenza di un nord. È esattamente questo che colma il vuoto."},
    {h:"Rilevamento e Risposta",s:"Durante una Violazione · Reattivo e Difensivo",

  nl:[
    {h:"Cyberrisicobeheer",s:"Voor een Inbreuk · Proactief en Voorspellend",
     b:"Het echte noorden van je cyberveiligheidskompas. Zonder dit drijven organisaties van crisis naar crisis, reagerend, herstellend, zonder het risico ooit werkelijk te verminderen. Cyberrisicobeheer is de proactieve en voorspellende discipline die dreigingen anticipeert voordat ze zich voordoen, prioriteit geeft aan wat er echt toe doet, beveiligingsinvesteringen optimaliseert en leidinggevenden een duidelijke taal geeft om strategische beslissingen te nemen. Cybercriminelen zoeken niet alleen naar technische kwetsbaarheden. Ze zoeken de onzekerheid en aarzeling die ontstaan door het ontbreken van een noorden. Dat is precies wat dit gat dicht."},
    {h:"Detectie en Respons",s:"Tijdens een Inbreuk · Reactief en Defensief",

    {h:"Cyberweerbaarheid",s:"Na een Inbreuk · Herstellen en Verbeteren · Een Resultaat",

const TTP={
  en:[
    {h:"People",s:"The Human Layer",
     b:"Technology does not defend organizations. People do. The People dimension of the compass represents the human layer that makes every other investment meaningful: the security analysts who interpret signals, the executives who make risk decisions, the employees who are either the first line of defense or the first point of failure. And on the other side of every attack, there is also a person. Cybercriminals are not automated forces of nature. They are individuals with intentions, motivations, and strategies of their own. They study their targets, exploit indecision, and move with purpose. Defending against them requires the same human qualities they possess: awareness, judgment, and the will to act before they do. A compass without skilled, aware, and empowered people is an instrument no one knows how to read. Culture, training, accountability, and leadership are not soft factors. They are the hands on the wheel."},
    {h:"Process",s:"The Operational Backbone",

    {h:"Technology",s:"The Force Multiplier",

  fr:[
    {h:"Personnes",s:"La Couche Humaine",

    {h:"Processus",s:"L'Épine Dorsale Opérationnelle",

    {h:"Technologie",s:"Le Multiplicateur de Force",

  de:[
    {h:"Menschen",s:"Die menschliche Ebene",
     b:"Technologie verteidigt keine Organisationen. Menschen tun das. Die Dimension Menschen des Kompasses steht für die menschliche Ebene, die jede andere Investition sinnvoll macht: die Sicherheitsanalysten, die Signale interpretieren, die Führungskräfte, die Risikoentscheidungen treffen, die Mitarbeiter, die entweder die erste Verteidigungslinie oder der erste Schwachpunkt sind. Und auf der anderen Seite jedes Angriffs steht ebenfalls ein Mensch. Cyberkriminelle sind keine automatisierten Naturkräfte. Es sind Individuen mit eigenen Absichten, Motivationen und Strategien. Sie studieren ihre Ziele, nutzen Unentschlossenheit aus und handeln mit Zielstrebigkeit. Sich gegen sie zu verteidigen erfordert dieselben menschlichen Qualitäten, die sie besitzen: Wachsamkeit, Urteilsvermögen und den Willen, vor ihnen zu handeln. Ein Kompass ohne kompetente, wachsame und befähigte Menschen ist ein Instrument, das niemand zu lesen weiß. Kultur, Training, Verantwortlichkeit und Führung sind keine weichen Faktoren. Sie sind die Hände am Steuer."},
    {h:"Prozess",s:"Das operative Rückgrat",
     b:"Prozess ist das operative Rückgrat, das Menschen mit Technologie und Strategie mit Umsetzung verbindet. Ohne ihn erzeugen selbst die besten Werkzeuge nur Lärm, und selbst die besten Talente arbeiten in Silos. Im Kern einer ausgereiften Prozessebene stehen die CyberRiskOps-Disziplin und ihr operatives Nervenzentrum, das Cyber-Risiko-Operationszentrum (CROC), in dem Risikoerkenntnisse kontinuierlich gemessen, priorisiert und umgesetzt werden. Security Operations (SecOps) verbindet diese Risikoerkenntnisse mit Echtzeit-Handeln, während das Security Operations Center (SOC) Erkennung, Untersuchung und Reaktion mit Geschwindigkeit ausführt. Gemeinsam verwandeln sie Cybersicherheit von einer Reihe isolierter Reaktionen in einen kontinuierlichen, messbaren und sich stetig verbessernden Betrieb. Prozess ist das, was sicherstellt, dass der Kompass sich weiterbewegt."},
    {h:"Technologie",s:"Der Kraftmultiplikator",
     b:"Technologie ist der Kraftmultiplikator Ihrer Cybersicherheitsstrategie, aber nur, wenn sie einem klaren Zweck dient. Cyber-Risikoquantifizierung (CRQ) übersetzt technisches Risiko in eine finanzielle Sprache, mit der Führungskräfte handeln können. Cyber-Risiko-Expositionsmanagement (CREM) kartiert und priorisiert kontinuierlich Ihre Angriffsfläche, bevor Angreifer sie ausnutzen können. Erweiterte Erkennung und Reaktion (XDR) vereint die Sichtbarkeit über Endpunkte, Netzwerke, Cloud und Identität in einem einzigen, korrelierten Bild. Threat Intelligence versorgt Ihren Kompass mit Kontext über den Angreifer und verwandelt reaktive Warnungen in proaktive Entscheidungen. Automatisierung eliminiert die manuelle Reibung, die die Reaktion verlangsamt, und ermöglicht Ihren Teams, mit Maschinengeschwindigkeit zu arbeiten, ohne auszubrennen. Eine einheitliche Plattform verbindet all dies und ersetzt fragmentierte Einzellösungen durch integrierte Intelligenz. Künstliche Intelligenz erweitert, was menschliche Teams auf jeder Ebene leisten können. Technologie definiert nicht Ihre Strategie. Sie setzt sie um."}

  ja:[
    {h:"人材",s:"ヒューマンレイヤー",
     b:"テクノロジーは組織を守らない。守るのは人材だ。コンパスにおける人材の次元は、他のすべての投資を意味あるものにするヒューマンレイヤーを表す。信号を解釈するセキュリティアナリスト、リスクの意思決定を行う経営層、防御の最前線にも最初の破綻点にもなり得る従業員たちだ。そして、あらゆる攻撃の反対側にも、やはり人がいる。サイバー犯罪者は自動化された自然の力ではない。彼ら自身の意図、動機、戦略を持つ個人だ。彼らはターゲットを研究し、迷いを突き、目的を持って動く。彼らに対抗するには、彼らが持つのと同じ人間的な資質、すなわち警戒心、判断力、そして彼らより先に行動する意志が求められる。スキルと意識と権限を備えた人材のいないコンパスは、誰も読み方を知らない計器にすぎない。文化、トレーニング、アカウンタビリティ、そしてリーダーシップは、ソフトな要素ではない。それらは舵を握る手そのものだ。"},
    {h:"プロセス",s:"運用のバックボーン",
     b:"プロセスは、人材とテクノロジーをつなぎ、戦略と実行をつなぐ運用のバックボーンだ。これがなければ、最高のツールもノイズしか生まず、最高の人材もサイロの中で孤立して動くことになる。成熟したプロセスレイヤーの中核には、CyberRiskOpsという規律と、その運用上の神経中枢であるサイバーリスクオペレーションセンター(CROC)がある。ここでリスクインテリジェンスが継続的に測定され、優先順位付けされ、実行に移される。SecOpsはそのリスクインテリジェンスをリアルタイムのアクションへとつなぎ、SOC(セキュリティオペレーションセンター)は検知・調査・対応を高速に実行する。両者が連携することで、サイバーセキュリティは孤立した反応の集合体から、継続的で測定可能、そして常に改善され続ける運用へと変わる。プロセスこそが、コンパスを動かし続ける原動力だ。"},
    {h:"テクノロジー",s:"フォースマルチプライヤー",
     b:"テクノロジーは、サイバーセキュリティ戦略のフォースマルチプライヤーだ。ただし、明確な目的に応える場合に限る。CRQ(サイバーリスク定量化)は、技術的リスクを経営層が判断できる財務言語へと翻訳する。CREM(サイバーリスクエクスポージャーマネジメント)は、攻撃者に悪用される前に、攻撃対象領域を継続的にマッピングし、優先順位付けする。XDR(拡張検知・対応)は、エンドポイント、ネットワーク、クラウド、IDにわたる可視性を、単一の相関的なビューへと統合する。脅威インテリジェンスは、攻撃者のコンテキストをコンパスに供給し、リアクティブなアラートをプロアクティブな意思決定へと変える。オートメーションは対応を遅らせる手作業の摩擦を排除し、チームがバーンアウトすることなく、マシンスピードで動けるようにする。統合プラットフォームはこれらすべてをつなぎ、断片化したポイントソリューションを統合されたインテリジェンスへと置き換える。AI(人工知能)は、人間のチームができることを、あらゆる層で拡張する。テクノロジーは戦略を定義しない。それを実行するのだ。"}
  ],
  ar:[
    {h:"العنصر البشري",s:"الطبقة البشرية",
     b:"التقنية لا تحمي المؤسسات. الأفراد يفعلون ذلك. يمثّل بُعد العنصر البشري في البوصلة الطبقة البشرية التي تجعل كل استثمار آخر ذا معنى: محللو الأمن الذين يفسّرون الإشارات، والقيادات التنفيذية التي تتخذ قرارات المخاطر، والموظفون الذين يمثلون خط الدفاع الأول أو نقطة الفشل الأولى. وعلى الطرف الآخر من كل هجوم، يوجد أيضًا شخص. المجرمون السيبرانيون ليسوا قوى طبيعية آلية. بل هم أفراد يحملون نواياهم ودوافعهم واستراتيجياتهم الخاصة. يدرسون أهدافهم، ويستغلون التردد، ويتحركون بهدف واضح. والدفاع ضدهم يتطلب نفس الصفات البشرية التي يمتلكونها: الوعي، وسلامة الحكم، والإرادة على التحرك قبلهم. البوصلة بلا أفراد مؤهلين وواعين ومُخوَّلين هي أداة لا يعرف أحد كيف يقرأها. الثقافة والتدريب والمساءلة والقيادة ليست عوامل ثانوية. بل هي الأيدي التي تقبض على المقود."},
    {h:"العمليات",s:"العمود الفقري التشغيلي",
     b:"العمليات هي العمود الفقري التشغيلي الذي يربط الأفراد بالتقنية، والاستراتيجية بالتنفيذ. وبدونها، تُصدر حتى أفضل الأدوات ضجيجًا بلا فائدة، ويعمل أفضل الكفاءات في عزلة تامة. وفي جوهر طبقة العمليات الناضجة تقع منهجية CyberRiskOps ومركزها العصبي التشغيلي، وهو مركز عمليات المخاطر السيبرانية (CROC)، حيث تُقاس معلومات المخاطر وتُرتّب أولوياتها ويُتّخذ بشأنها إجراء بشكل مستمر. وتربط عمليات الأمن (SecOps) تلك المعلومات بالفعل اللحظي، بينما يُنفّذ مركز عمليات الأمن (SOC) الكشف والتحقيق والاستجابة بسرعة عالية. ومعًا، يُحوّلان الأمن السيبراني من مجموعة ردود فعل منعزلة إلى عملية مستمرة وقابلة للقياس وفي تحسّن دائم. العمليات هي ما يضمن استمرار حركة البوصلة."},
    {h:"التقنية",s:"مُضاعِف القوة",
     b:"التقنية هي مُضاعِف القوة لاستراتيجية الأمن السيبراني في مؤسستك، ولكن فقط حين تخدم غرضًا واضحًا. يُترجم التقييم الكمي للمخاطر السيبرانية (CRQ) المخاطر التقنية إلى لغة مالية يمكن للقيادات التنفيذية التصرف بناءً عليها. وتقوم إدارة التعرض للمخاطر السيبرانية (CREM) برسم سطح الهجوم وترتيب أولوياته باستمرار قبل أن يتمكن الخصوم من استغلاله. ويوحّد الكشف والاستجابة الموسّعة (XDR) الرؤية عبر نقاط النهاية والشبكات والسحابة والهوية في صورة واحدة مترابطة. وتُغذّي استخبارات التهديدات بوصلتك بسياق الخصم، فتحوّل التنبيهات التفاعلية إلى قرارات استباقية. وتُزيل الأتمتة الاحتكاك اليدوي الذي يُبطّئ الاستجابة، وتتيح لفرقك العمل بسرعة الآلة دون الاحتراق الوظيفي. وتربط منصة موحّدة كل ذلك معًا، فتستبدل الحلول المجزّأة بذكاء متكامل. ويُوسّع الذكاء الاصطناعي ما يمكن للفرق البشرية تحقيقه على كل مستوى. التقنية لا تُحدّد استراتيجيتك. بل تُنفّذها."}
  ],
  "zh-tw":[
    {h:"人員",s:"人的層面",
     b:"技術不會保護組織，人才會。指南針中的人員維度，代表著讓其他一切投入都變得有意義的人的層面：解讀訊號的安全分析師、做出風險決策的管理層，以及那些既可能是第一道防線，也可能是第一個失敗點的員工。而在每一次攻擊的另一端，同樣站著一個人。網路犯罪分子不是自動執行的自然力量，而是擁有自己的意圖、動機和策略的個體。他們研究目標、利用猶豫、帶著明確的目的行動。要對抗他們，需要具備他們所擁有的同樣的人的素質：警覺性、判斷力，以及先於對手行動的意志。一個沒有具備能力、保持警覺、被充分賦權的人員的指南針，只是一件沒人知道該怎麼讀的儀器。文化、培訓、問責和領導力，都不是可有可無的軟性因素，而是真正握住方向盤的那雙手。"},
    {h:"流程",s:"運營的支柱",
     b:"流程是連線人員與技術、連線戰略與執行的運營支柱。沒有它，再好的工具也只會產生噪音，再優秀的人才也只能在各自的資訊孤島中運轉。在成熟的流程體系核心，是CyberRiskOps這一方法論，以及它的運營神經中樞——網路風險運營中心（CROC），在這裡，風險情報被持續測量、排序並轉化為行動。SecOps將這些風險情報與實時行動連線起來，而安全運營中心（SOC）則以高速執行檢測、調查和響應。二者協同，把網路安全從一系列孤立的反應，轉變為一個持續、可衡量、並不斷改進的運營體系。流程，正是讓指南針持續運轉的力量。"},
    {h:"技術",s:"力量倍增器",
     b:"技術是你網路安全戰略的力量倍增器，但前提是它要服務於一個明確的目標。網路風險量化（CRQ）把技術性風險，轉化為管理層能夠據此行動的財務語言。網路風險暴露面管理（CREM）持續繪製並排序你的攻擊面，搶在對手利用它之前採取行動。擴充套件偵測與應變（XDR）把終端、網路、雲和身份的可見性，統一成一個單一、關聯的檢視。威脅情報為你的指南針提供對手的上下文，把被動的警報，轉化為主動的決策。自動化消除了拖慢響應速度的人工摩擦，讓團隊能夠以機器的速度運轉，而不至於精力耗盡。統一平臺把這一切連線在一起，用整合的情報取代碎片化的單點解決方案。人工智慧則在每一個層面，放大人類團隊所能做到的一切。技術不定義你的戰略，它執行你的戰略。"}
  ],
  "zh-cn":[
    {h:"人员",s:"人的层面",
     b:"技术不会保护组织，人才会。指南针中的人员维度，代表着让其他一切投入都变得有意义的人的层面：解读信号的安全分析师、做出风险决策的管理层，以及那些既可能是第一道防线，也可能是第一个失败点的员工。而在每一次攻击的另一端，同样站着一个人。网络犯罪分子不是自动运行的自然力量，而是拥有自己的意图、动机和策略的个体。他们研究目标、利用犹豫、带着明确的目的行动。要对抗他们，需要具备他们所拥有的同样的人的素质：警觉性、判断力，以及先于对手行动的意志。一个没有具备能力、保持警觉、被充分赋权的人员的指南针，只是一件没人知道该怎么读的仪器。文化、培训、问责和领导力，都不是可有可无的软性因素，而是真正握住方向盘的那双手。"},
    {h:"流程",s:"运营的支柱",
     b:"流程是连接人员与技术、连接战略与执行的运营支柱。没有它，再好的工具也只会产生噪音，再优秀的人才也只能在各自的信息孤岛中运转。在成熟的流程体系核心，是CyberRiskOps这一方法论，以及它的运营神经中枢——网络风险运营中心（CROC），在这里，风险情报被持续测量、排序并转化为行动。SecOps将这些风险情报与实时行动连接起来，而安全运营中心（SOC）则以高速执行检测、调查和响应。二者协同，把网络安全从一系列孤立的反应，转变为一个持续、可衡量、并不断改进的运营体系。流程，正是让指南针持续运转的力量。"},
    {h:"技术",s:"力量倍增器",
     b:"技术是你网络安全战略的力量倍增器，但前提是它要服务于一个明确的目标。网络风险量化（CRQ）把技术性风险，转化为管理层能够据此行动的财务语言。网络风险暴露面管理（CREM）持续绘制并排序你的攻击面，抢在对手利用它之前采取行动。扩展检测与响应（XDR）把终端、网络、云和身份的可见性，统一成一个单一、关联的视图。威胁情报为你的指南针提供对手的上下文，把被动的警报，转化为主动的决策。自动化消除了拖慢响应速度的人工摩擦，让团队能够以机器的速度运转，而不至于精力耗尽。统一平台把这一切连接在一起，用集成的情报取代碎片化的单点解决方案。人工智能则在每一个层面，放大人类团队所能做到的一切。技术不定义你的战略，它执行你的战略。"}
  ],

  ko:[
    {h:"인력",s:"인간 레이어",
     b:"기술은 조직을 지키지 않는다. 지키는 것은 사람이다. 나침반에서 인력이라는 차원은 다른 모든 투자를 의미 있게 만드는 인간 레이어를 나타낸다. 신호를 해석하는 보안 분석가, 리스크 의사결정을 내리는 경영진, 방어의 최전선이 될 수도 있고 첫 번째 실패 지점이 될 수도 있는 직원들이다. 그리고 모든 공격의 반대편에도 역시 사람이 있다. 사이버 범죄자는 자동화된 자연의 힘이 아니다. 그들은 자신만의 의도와 동기와 전략을 가진 개인이다. 그들은 목표를 연구하고, 망설임을 파고들며, 목적을 가지고 움직인다. 그들에 대항하려면 그들이 가진 것과 같은 인간적 자질, 즉 경계심과 판단력, 그리고 그들보다 먼저 움직이려는 의지가 필요하다. 숙련되고 깨어 있으며 권한을 부여받은 인력이 없는 나침반은 아무도 읽는 법을 모르는 계기에 불과하다. 문화, 훈련, 책임감, 그리고 리더십은 부드러운 요소가 아니다. 그것은 방향키를 잡고 있는 손 그 자체다."},

    {h:"Processo",s:"La Spina Dorsale Operativa",

const IDS={crm:'t-crm',pap:'t-pap',bab:'t-bab',dar:'t-dar',rad:'t-rad',dub:'t-dub',cr:'t-cr',rai:'t-rai',aab:'t-aab',ppl:'t-ppl',prc:'t-prc',tch:'t-tch'};

let lang=(()=>{
  const full=(navigator.language||'en').toLowerCase();
  // Chinese needs the FULL locale (zh-TW vs zh-CN vs zh-HK vs zh-SG all
  // matter here - they're genuinely different content, not just a script
  // difference), so it's checked separately before falling back to the
  // generic first-two-letters match every other language uses.
  if(full.startsWith('zh')){
    if(full.includes('tw')) return 'zh-tw';
    if(full.includes('hk') || full.includes('mo')) return 'zh-hk'; // Macau gets the HK variant - closest regional match available
    if(full.includes('sg')) return 'zh-sg';
    if(full.includes('cn')) return 'zh-cn';
    // Bare "zh" or an unrecognized region: fall back on script if present
    // (zh-Hant implies Traditional, zh-Hans implies Simplified), otherwise
    // default to Simplified/mainland as the most common case worldwide.
    if(full.includes('hant')) return 'zh-tw';
    return 'zh-cn';
  }
  const n=full.slice(0,2);
  return T[n]?n:'en';
})();

function applyLang(l){
  lang=l;
  const t=T[l];
  Object.entries(IDS).forEach(([k,id])=>{
    const el=document.getElementById(id);
    if(el) el.textContent=t[k];
    else console.warn('Missing element:',id);
  });
  document.getElementById('compass-title').innerHTML=t.titlePre+'<span style="color:#E01C24;">'+t.titleWord+'</span>'+t.titlePost;
  document.getElementById('compass-title-badge').textContent=t.badge;
  document.getElementById('credit').innerHTML=t.credit+'<br><a href="https://www.linkedin.com/in/jpcastro/" target="_blank" style="color:rgba(255,255,255,.5);text-decoration:none;">Juan Pablo Castro Vilaró</a>';
  // Line1 stays on its own line; line2 follows on same line if space allows,
  // otherwise breaks cleanly below line1 (never mid-word)
  document.getElementById('pub-link').innerHTML=
    '<a href="'+t.pubUrl+'" target="_blank" style="color:rgba(255,255,255,.45);text-decoration:none;display:block;margin-bottom:3px;">'+
      '<span style="display:inline;white-space:nowrap;">'+t.pubLine1+'</span> '+
      '<span style="display:inline;white-space:nowrap;">'+t.pubLine2+'</span>'+
    '</a>'+
    '<a href="'+t.pubDoiUrl+'" target="_blank" style="color:rgba(255,255,255,.28);text-decoration:none;">DOI: '+t.pubDoi+'</a>';
  ['en','es','pt','fr','de','ja','ar','zh-tw','zh-cn','zh-hk','zh-sg','ko','hi','it','nl'].forEach(c=>{
    const b=document.getElementById('btn-'+c);
    b.style.background=c===l?'#E01C24':'rgba(255,255,255,0.1)';
    b.style.color=c===l?'#fff':'#888';
  });
  document.getElementById('lang-toggle-label').textContent = l.startsWith('zh-') ? l.split('-')[1].toUpperCase() : l.toUpperCase();
  closeLangMenu();
  // Arabic is RTL. Flip direction and alignment on the text containers
  // only (not the whole layout) and drop letter-spacing, which breaks
  // Arabic's cursive letter-joining if left on.
  const isRTL = (l === 'ar');
  ['tt-h','tt-s','tt-b','compass-title','compass-title-badge','compass-blog-badge','compass-croc-badge','credit','pub-link'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.dir = isRTL ? 'rtl' : 'ltr';
    el.style.textAlign = isRTL ? 'right' : '';
    el.style.letterSpacing = isRTL ? 'normal' : '';
  });
}

function setLang(l){applyLang(l);}

function toggleLangMenu(){
  const menu = document.getElementById('lang-menu');
  const toggle = document.getElementById('lang-toggle');
  const isOpen = menu.classList.toggle('open');
  toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}
function closeLangMenu(){
  document.getElementById('lang-menu').classList.remove('open');
  document.getElementById('lang-toggle').setAttribute('aria-expanded','false');
}
document.addEventListener('click', function(e){
  const bar = document.getElementById('lang-bar');
  if (bar && !bar.contains(e.target)) closeLangMenu();
});

// Tooltip
const tt=document.getElementById('tt');
const tth=document.getElementById('tt-h');
const tts=document.getElementById('tt-s');
const ttb=document.getElementById('tt-b');
const stage=document.getElementById('stage');

function posTT(cx,cy){
  const W=285,H=tt.offsetHeight||220;
  const sw=stage.offsetWidth,sh=stage.offsetHeight;
  let x=cx+14,y=cy+14;
  if(x+W>sw) x=cx-W-14;
  if(y+H>sh) y=cy-H-14;
  if(x<6) x=6;
  if(y<6) y=6;
  tt.style.left=x+'px';
  tt.style.top=y+'px';
}

// Unified mouse handler - single source of truth
// All tooltip logic driven from one mousemove on the stage overlay
let puzzleAngle=0;
let rootAngle=0; // current entrance-animation rotation of the whole compass (deg), see tick() - still used to drive the actual visual rotation, no longer used for hit-testing
let lastCX=0, lastCY=0;
let lastClientX=0, lastClientY=0;
let hoverState=-1; // -1=none, 0/1/2=sector, 3/4/5=puzzle piece

const CX=540, CY=540;

// Ask the browser directly what's actually rendered at this screen pixel, rather than
// computing angles ourselves - this automatically accounts for the current rotation
// of the outer ring (intro animation) and the continuously-spinning puzzle ring,
// with zero manual trig, so it can't drift out of sync with what's really on screen.
function getZoneFromClient(clientX, clientY){
  const prevPE = hitsSvg.style.pointerEvents;
  hitsSvg.style.pointerEvents = 'none'; // peek behind the hit-testing overlay
  const el = document.elementFromPoint(clientX, clientY);
  hitsSvg.style.pointerEvents = prevPE;
  if (!el) return -1;
  const zoneEl = el.closest('[data-zone]');
  return zoneEl ? parseInt(zoneEl.getAttribute('data-zone'), 10) : -1;
}

function showTT(zone, cx, cy){
  const d = zone<3 ? TT[lang][zone] : TTP[lang][zone-3];
  tth.textContent=d.h; tts.textContent=d.s; ttb.textContent=d.b;
  tt.classList.add('on');
  posTT(cx, cy);
}

// Single mousemove listener on the hits SVG (sits above everything)
const hitsSvg=document.getElementById('hits');
hitsSvg.style.pointerEvents='all';
// Remove individual hit path pointer events - we handle everything here
[0,1,2].forEach(i=>{
  const el=document.getElementById('hit'+i);
  if(el) el.style.pointerEvents='none';
});

hitsSvg.addEventListener('mousemove', function(e){
  const r=stage.getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  lastCX=cx; lastCY=cy;
  lastClientX=e.clientX; lastClientY=e.clientY;
  const zone=getZoneFromClient(e.clientX, e.clientY);
  // If in puzzle ring, mark as -2 so tick loop keeps refreshing even when not moving
  hoverState=(zone>=3)?-2:zone;
  if(zone===-1){ tt.classList.remove('on'); hitsSvg.style.cursor='default'; }
  else { showTT(zone, cx, cy); hoverState=zone; hitsSvg.style.cursor='pointer'; }
});

hitsSvg.addEventListener('mouseleave', function(){
  tt.classList.remove('on');
  hoverState=-1;
  hitsSvg.style.cursor='default';
});

// Animation
const A={T:31.8,t:0,spin:0,needle:0,needleVel:0,lastActive:75,centers:[75,195,315],cd:6.0,pc:[1.0,3.0,5.0],W:1.3,last:0};
function easeOut(x){return 1-Math.pow(1-x,3);}
function pulse(cp,c){let d=Math.abs(cp-c);d=Math.min(d,A.cd-d);return d>A.W?0:0.5*(1+Math.cos(Math.PI*d/A.W));}
function lerp(a,b,p){return a+(b-a)*p;}

function tick(now){
  const dt=Math.min(0.05,(now-A.last)/1000);
  A.last=now; A.t+=dt; if(A.t>=A.T)A.t-=A.T; A.spin+=dt;

  const root=document.getElementById('compassRoot');
  const needleEl=document.getElementById('needle');
  const grps=[document.getElementById('grp0'),document.getElementById('grp1'),document.getElementById('grp2')];
  const glows=[document.getElementById('glow0'),document.getElementById('glow1'),document.getElementById('glow2')];
  const puzzle=document.getElementById('puzzle');

  const id=1.8,p=Math.max(0,Math.min(1,A.t/id)),e=easeOut(p);
  rootAngle=lerp(-150,0,e);
  if(root){
    root.setAttribute('transform','translate(540,540) rotate('+rootAngle.toFixed(2)+') scale('+lerp(0.80,1,e).toFixed(3)+') translate(-540,-540)');
    root.setAttribute('opacity',Math.max(0,Math.min(1,p*1.7)).toFixed(3));
  }

  const tc=A.t-id,cp=tc<0?-99:((tc%A.cd+A.cd)%A.cd);
  const ps=[0,1,2].map(i=>tc<0?0:pulse(cp,A.pc[i]));
  const sum=ps.reduce((a,b)=>a+b,0);

  grps.forEach((g,i)=>{if(g)g.setAttribute('opacity',lerp(0.40,1.0,Math.min(1,0.50+(0.50)*ps[i])).toFixed(3));});
  glows.forEach((g,i)=>{if(g){const gw=Math.max(0,Math.min(1,(Math.min(1,0.50+(0.50)*ps[i])-0.55)/0.45));g.setAttribute('opacity',(gw*0.20).toFixed(3));}});

  let target=A.lastActive;
  if(sum>0.04){
    let sx=0,sy=0;
    ps.forEach((v,i)=>{const a=A.centers[i]*Math.PI/180;sx+=v*Math.sin(a);sy+=v*Math.cos(a);});
    target=Math.atan2(sx,sy)*180/Math.PI;
    let mi=0;ps.forEach((v,i)=>{if(v>ps[mi])mi=i;});A.lastActive=A.centers[mi];
  }
  let diff=((target-A.needle+540)%360)-180;
  // Spring-damper physics instead of an instant "move 10% of the gap" snap - a real
  // compass needle has weight and settles into place rather than jumping straight at
  // its target, so we accelerate it toward the target and let damping slow it down.
  const stiffness=10, damping=5.6;
  const accel=diff*stiffness - A.needleVel*damping;
  A.needleVel+=accel*dt;
  A.needle+=A.needleVel*dt;
  const sway=(sum<0.15?4:1.2)*Math.sin(A.t*2.0);
  if(needleEl)needleEl.setAttribute('transform','rotate('+((A.needle+sway).toFixed(2))+' 540 540)');
  const pAngle=(A.spin*13)%360;
  puzzleAngle=pAngle;
  if(puzzle)puzzle.setAttribute('transform','rotate('+pAngle.toFixed(2)+' 540 540)');
  // Refresh tooltip live every frame when cursor is over puzzle ring
  if(hoverState>=3 || hoverState===-2){
    const zone=getZoneFromClient(lastClientX, lastClientY);
    if(zone!==hoverState){
      hoverState=zone;
      if(zone===-1){ tt.classList.remove('on'); hitsSvg.style.cursor='default'; }
      else { showTT(zone, lastCX, lastCY); hitsSvg.style.cursor='pointer'; }
    }
  }

  requestAnimationFrame(tick);
}

// Init
applyLang(lang);
A.last=performance.now();
requestAnimationFrame(tick);
</script>
<script type="module">
import * as THREE from './three.module.js';
import { Water } from './Water.js';
import { Sky } from './Sky.js';

// ---- Ocean background scene (fixed behind the compass) ----
const oceanContainer = document.getElementById('ocean-bg');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 20000);
camera.position.set(0, 8, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.15;
oceanContainer.appendChild(renderer.domElement);
let lastKnownWidth = innerWidth, lastKnownHeight = innerHeight;
function syncViewportUnits() {
  document.documentElement.style.setProperty('--vw', (innerWidth / 100) + 'px');
  document.documentElement.style.setProperty('--vh', (innerHeight / 100) + 'px');
}
syncViewportUnits();

const sun = new THREE.Vector3();
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);

// ---- Procedurally generated cloud layer (canvas texture on an inward-facing dome) ----
const fogParams = { top: 0.76, bottom: 0.83, peakOpacity: 0.185, gray: 44 };

function generateCloudTexture(size) {
  // Deliberately the simplest possible approach: one smooth gradient, no
  // individual shapes, no randomness, no blur pass. Every previous version
  // (discrete puffs, elongated streaks, fade masks) kept surfacing some new
  // visible artifact - circles, banding, moire, scalloped edges - because it
  // all traced back to compositing many separate shapes together. A single
  // gradient can't produce any of those; it's just a smooth function, so
  // there's nothing for the grazing viewing angle to alias against.
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const c = fogParams.gray;
  const g = ctx.createLinearGradient(0, size * fogParams.top, 0, size * fogParams.bottom);
  g.addColorStop(0, `rgba(${c},${c+2},${c+6},0)`);
  g.addColorStop(0.45, `rgba(${c},${c+2},${c+6},${fogParams.peakOpacity})`);
  g.addColorStop(0.7, `rgba(${c},${c+2},${c+6},${fogParams.peakOpacity})`);
  g.addColorStop(1, `rgba(${c},${c+2},${c+6},0)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  return texture;
}

const cloudGeometry = new THREE.SphereGeometry(4500, 128, 64, 0, Math.PI * 2, 0, Math.PI * 0.62);
const cloudMaterial = new THREE.MeshBasicMaterial({
  map: generateCloudTexture(1024),
  transparent: true,
  side: THREE.BackSide,
  depthWrite: false,
  toneMapped: false,
  fog: false
});
const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
scene.add(clouds);

// ---- Two additional thin fog bands, drifting in opposite directions ----
// Smooth sine-wave horizontal variation only (no discrete random shapes) - a
// sine wave is continuous and exactly tileable over one period, so animating
// its horizontal offset with RepeatWrapping scrolls seamlessly with none of
// the circle/band/moire artifacts the earlier puff-based versions kept hitting.
function generateWispyBandTexture(size, waveCount) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const c = fogParams.gray;
  for (let y = 0; y < size; y++) {
    const v = y / size;
    // Vertical envelope: soft hump centered in the band, zero at top/bottom.
    const vertical = Math.max(0, Math.sin(Math.PI * v));
    for (let x = 0; x < size; x++) {
      const u = x / size;
      // Horizontal variation: a couple of overlapping sine waves at different
      // frequencies, each an exact integer number of cycles so it tiles
      // perfectly - reads as an uneven, organic wisp density rather than a
      // uniform strip, without introducing any random/discrete geometry.
      const wave = 0.5 + 0.5 * Math.sin(u * Math.PI * 2 * waveCount)
                 * (0.6 + 0.4 * Math.sin(u * Math.PI * 2 * (waveCount * 2.3) + 1.7));
      const alpha = vertical * wave * fogParams.peakOpacity * 0.8;
      const idx = (y * size + x) * 4;
      img.data[idx] = c;
      img.data[idx + 1] = c + 2;
      img.data[idx + 2] = c + 6;
      img.data[idx + 3] = Math.round(alpha * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  return texture;
}

function makeWispyBand(thetaStart, thetaLength, waveCount) {
  const geo = new THREE.SphereGeometry(4500, 128, 32, 0, Math.PI * 2, thetaStart, thetaLength);
  const mat = new THREE.MeshBasicMaterial({
    map: generateWispyBandTexture(512, waveCount),
    transparent: true,
    side: THREE.BackSide,
    depthWrite: false,
    toneMapped: false,
    fog: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  return mesh;
}

// Positioned just above the main fog band, each a thin horizontal strip.
const topBand1 = makeWispyBand(Math.PI * 0.40, Math.PI * 0.14, 3);
const topBand2 = makeWispyBand(Math.PI * 0.50, Math.PI * 0.14, 4);

const skyUniforms = sky.material.uniforms;
skyUniforms['turbidity'].value = 6;
skyUniforms['rayleigh'].value = 0;
skyUniforms['mieCoefficient'].value = 0.008;
skyUniforms['mieDirectionalG'].value = 0.85;

const sunParams = { elevation: -10, azimuth: 180 };
const pmremGenerator = new THREE.PMREMGenerator(renderer);
let envRenderTarget;

function updateSun() {
  const phi = THREE.MathUtils.degToRad(90 - sunParams.elevation);
  const theta = THREE.MathUtils.degToRad(sunParams.azimuth);
  sun.setFromSphericalCoords(1, phi, theta);
  sky.material.uniforms['sunPosition'].value.copy(sun);
  water.material.uniforms['sunDirection'].value.copy(sun).normalize();
  if (envRenderTarget) envRenderTarget.dispose();
  envRenderTarget = pmremGenerator.fromScene(sky);
  scene.environment = envRenderTarget.texture;
}

const waterGeometry = new THREE.PlaneGeometry(10000, 10000);
const water = new Water(waterGeometry, {
  textureWidth: 512,
  textureHeight: 512,
  waterNormals: new THREE.TextureLoader().load(
    'https://threejs.org/examples/textures/waternormals.jpg',
    (texture) => { texture.wrapS = texture.wrapT = THREE.RepeatWrapping; }
  ),
  sunDirection: new THREE.Vector3(),
  sunColor: 0xffffff,
  waterColor: 0x0a0a0a,
  distortionScale: 6.5,
  fog: false
});
water.rotation.x = -Math.PI / 2;
scene.add(water);

updateSun();

// ---- Live "standee" of the compass, captured as a texture from the untouched DOM ----
// This reads the compass SVG read-only (no edits to it) and paints it onto a real
// 3D plane standing in the scene, so the existing Water mirror-reflection pass
// picks it up automatically, the same way it would any other object.
const compassCanvas = document.createElement('canvas');
compassCanvas.width = 1024;
compassCanvas.height = 1024;
const compassCtx = compassCanvas.getContext('2d');
const compassTexture = new THREE.CanvasTexture(compassCanvas);

function refreshCompassTexture() {
  const svgEl = document.getElementById('compass-svg');
  if (!svgEl) return;
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('width', '1080');
  clone.setAttribute('height', '1080');
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const svgStr = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = () => {
    compassCtx.clearRect(0, 0, 1024, 1024);
    compassCtx.drawImage(img, 0, 0, 1024, 1024);
    compassTexture.needsUpdate = true;
    URL.revokeObjectURL(url);
  };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}
refreshCompassTexture();
setInterval(refreshCompassTexture, 200); // keep it in sync with the needle/glow animation

const compassPlaneZ = 20;
const compassDist = camera.position.z - compassPlaneZ;
const vFOV = camera.fov * Math.PI / 180;
// The real DOM compass is a square SVG (viewBox 1080x1080) that CSS letterboxes
// to fit the viewport via "meet" - on a landscape/square screen that means it's
// sized to the full HEIGHT, but on a PORTRAIT screen (most phones) it's sized to
// the full WIDTH instead, with empty space above/below. The previous version
// always assumed the height case, so on any portrait screen (which is exactly
// what phones are, iOS or otherwise) this plane rendered larger than the real
// compass - not actually a WebKit bug, just an aspect-ratio blind spot that
// happened to only show up on phones.
function computeCompassStandSize() {
  const verticalSize = 2 * Math.tan(vFOV / 2) * compassDist; // full-height footprint
  return verticalSize * Math.min(1, camera.aspect); // matches CSS "meet" letterboxing
}
const compassStandGeo = new THREE.PlaneGeometry(1, 1); // unit size - scaled dynamically below
const compassStandMat = new THREE.MeshBasicMaterial({ map: compassTexture, transparent: true, side: THREE.DoubleSide, depthWrite: false, depthTest: false, opacity: 0 });
const compassStand = new THREE.Mesh(compassStandGeo, compassStandMat);
compassStand.renderOrder = -1; // draw before/behind everything else in the direct view
compassStand.position.set(0, camera.position.y, compassPlaneZ); // dead-center on the camera's view axis, same height as camera
function updateCompassStandSize() {
  const s = computeCompassStandSize();
  compassStand.scale.set(s, s, 1);
}
updateCompassStandSize();
scene.add(compassStand);
// The compass plays a ~1.8s rotate+fade-in entrance animation. During that window the
// real DOM compass is semi-transparent, so it can't fully hide this standee behind it,
// and the texture snapshot (refreshed every 200ms) briefly lags the fast-moving intro -
// together that would show up as a mismatched "ghost" compass. So the standee starts
// fully transparent, waits out the intro, takes one fresh snapshot, then smoothly
// fades its reflection in once direct occlusion is reliable again.
// Watch the compass's OWN real animation state rather than guessing with a fixed
// timer - a timer risks drifting out of sync if the three.js module (fetched over
// the network) happens to load slower or faster than the compass's intro plays,
// which is exactly what could let a stale/mismatched "ghost" show through.
const compassRootEl = document.getElementById('compassRoot');
let compassFadeStart = null;
let compassFadeTriggered = false;
let opacitySettledSince = null;
const compassFadeDuration = 900;

// ---- Lightning: randomly-timed flashes with a quick multi-pulse flicker and a
// fast decay, rather than a static baked brightness gradient. Drives two things
// each flash: the cloud material's own color multiplier (so the clouds themselves
// light up brightest, since they're "closest" to the strike) and a brief boost to
// the overall scene exposure (so it reads as the whole sky flashing, not just the
// clouds turning white).
const baseExposure = renderer.toneMappingExposure;
let nextLightningAt = performance.now() + 3000 + Math.random() * 6000;
let lightningPulses = []; // { start, duration, peak }[]

function scheduleLightning(now) {
  const pulseCount = 1 + Math.floor(Math.random() * 3); // 1-3 quick flickers per strike
  let t = now;
  lightningPulses = [];
  for (let i = 0; i < pulseCount; i++) {
    t += 30 + Math.random() * 90;
    lightningPulses.push({ start: t, duration: 70 + Math.random() * 90, peak: 0.55 + Math.random() * 0.45 });
  }
  nextLightningAt = now + 4000 + Math.random() * 9000;
}

function lightningIntensity(now) {
  let v = 0;
  for (const p of lightningPulses) {
    const dt = now - p.start;
    if (dt < 0) continue;
    if (dt > p.duration) continue;
    // Fast rise, faster exponential-feeling decay within the pulse window.
    const t = dt / p.duration;
    const envelope = t < 0.12 ? (t / 0.12) : Math.pow(1 - (t - 0.12) / 0.88, 2);
    v = Math.max(v, p.peak * envelope);
  }
  return v;
}

function animate() {
  requestAnimationFrame(animate);
  water.material.uniforms['time'].value += 0.35 / 60.0;
  clouds.rotation.y += 0.00006; // slow drift so the sky doesn't feel static
  topBand1.material.map.offset.x += 0.00012;  // drifts one way
  topBand2.material.map.offset.x -= 0.00009;  // drifts the other way, at a different speed

  // Defensive fallback for mobile Safari: innerWidth/innerHeight can be stale
  // right after load (while the browser's own UI chrome/toolbar is still
  // settling), and a 'resize' event isn't always reliably fired afterward to
  // correct it. Since camera.aspect drives the WHOLE scene's projection, a
  // stale value there skews everything - our precisely-centered reflection
  // plane is just what makes that skew visible, but it isn't the actual bug.
  // Checking every frame (cheap - just two number comparisons) means it
  // self-corrects regardless of whether a resize event ever fires.
  if (innerWidth !== lastKnownWidth || innerHeight !== lastKnownHeight) {
    lastKnownWidth = innerWidth;
    lastKnownHeight = innerHeight;
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    updateCompassStandSize();
    syncViewportUnits();
  }

  const now = performance.now();
  if (now >= nextLightningAt) scheduleLightning(now);
  const flash = lightningIntensity(now);
  const flashBoost = 1 + flash * 11; // how much brighter the clouds themselves get
  cloudMaterial.color.setScalar(flashBoost);
  renderer.toneMappingExposure = baseExposure + flash * 0.9; // brief whole-scene brightening
  // The compass's own animation timer wraps every ~31.8s, and its intro-rotation
  // logic doesn't distinguish "first ever playback" from "wrapped back around to
  // a low value" - so the whole rotate-in intro silently REPLAYS every ~32
  // seconds, indefinitely. A one-shot guard (fade in once, never again) only
  // protected the very first playback; every later replay went unguarded, with
  // the standee sitting at full opacity while the real compass rotated through
  // its intro again - exactly the rotated-duplicate ghosting reported. So this
  // now runs continuously every frame: whenever the compass is mid-intro
  // (opacity not yet settled), actively fade the standee back OUT; once it's
  // been settled for a buffer period, fade back IN. Works uniformly whether
  // it's the first playback or the hundredth.
  const rootOpacity = compassRootEl ? parseFloat(compassRootEl.getAttribute('opacity')) || 0 : 1;
  if (rootOpacity >= 0.995) {
    if (opacitySettledSince === null) opacitySettledSince = now;
  } else {
    opacitySettledSince = null;
    if (compassFadeTriggered) {
      // Compass has started re-playing its intro after already having settled
      // once before - snap the standee back out immediately rather than
      // waiting for a fade, since the mismatch is visible right away.
      compassFadeTriggered = false;
      compassStandMat.opacity = 0;
    }
  }
  if (!compassFadeTriggered && opacitySettledSince !== null && now - opacitySettledSince >= 900) {
    refreshCompassTexture();
    compassFadeTriggered = true;
    compassFadeStart = now;
  }
  if (compassFadeTriggered) {
    const t = Math.min(1, (now - compassFadeStart) / compassFadeDuration);
    compassStandMat.opacity = t * t * (3 - 2 * t); // smoothstep ease
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  updateCompassStandSize();
  syncViewportUnits();
});
</script>
