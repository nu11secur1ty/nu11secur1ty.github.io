<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The Future of SOC is ∞</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #f5f5f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
  }
  .lang-bar {
    display: flex;
    gap: 6px;
    padding: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    margin-bottom: 1.5rem;
  }
  .lang-bar button {
    appearance: none;
    border: 0;
    background: transparent;
    color: rgba(245,245,247,0.55);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.2px;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 160ms ease, background-color 160ms ease;
  }
  .lang-bar button:hover { color: rgba(245,245,247,0.85); }
  .lang-bar button.active {
    background: rgba(255,255,255,0.10);
    color: #f5f5f7;
  }
  .diagram-wrap {
    width: min(100%, 980px);
  }


  #pub-link {
    position: fixed;
    bottom: 16px;
    right: 18px;
    z-index: 50;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
    line-height: 1.6;
    text-align: right;
    max-width: 46%;
    pointer-events: auto;
  }
  #pub-link a {
    text-decoration: none;
    color: rgba(255,255,255,0.75);
    transition: color 160ms ease;
  }
  #pub-link a#t-pub-title { display: block; color: rgba(255,255,255,0.75); }
  #pub-link a:hover { color: #ffffff; }
  #pub-link .pub-doi { font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 2px; }
  #pub-link .pub-doi a { color: rgba(255,255,255,0.55); }
  #pub-link .pub-doi a:hover { color: rgba(255,255,255,0.9); }
  #page-credit {
    position: fixed;
    bottom: 16px;
    left: 18px;
    z-index: 50;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
    line-height: 1.6;
    text-align: left;
    pointer-events: auto;
  }
  #page-credit a {
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    transition: color 160ms ease;
  }
  #page-credit a:hover { color: #ffffff; }

  /* ============================================================
     CTA PILL TOOLTIP — appears over the central compass on hover
     Pattern reference: cta_pill_tooltip_example.html
     ============================================================ */
  .cta-tooltip {
    position: fixed;
    z-index: 100;
    padding: 7px 14px;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1.5px solid #E01C24;
    border-radius: 999px;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.015em;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -100%) translateY(-14px) scale(0.95);
    transform-origin: center bottom;
    transition: opacity 200ms ease,
                transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }
  .cta-tooltip.visible {
    opacity: 1;
    transform: translate(-50%, -100%) translateY(-14px) scale(1);
  }
  .cta-tooltip.flipped {
    transform: translate(-50%, 0) translateY(20px) scale(0.95);
    transform-origin: center top;
  }
  .cta-tooltip.flipped.visible {
    transform: translate(-50%, 0) translateY(20px) scale(1);
  }

  /* ============================================================
     NODE INFO TOOLTIP — appears over SOC / CROC on hover or tap
     ============================================================ */
  .node-tooltip {
    position: fixed;
    z-index: 100;
    width: min(320px, 78vw);
    padding: 14px 18px;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 14px;
    color: #f0f0f4;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 13.5px;
    line-height: 1.5;
    letter-spacing: 0.01em;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -100%) translateY(-16px) scale(0.96);
    transform-origin: center bottom;
    transition: opacity 200ms ease,
                transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  .node-tooltip.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -100%) translateY(-16px) scale(1);
  }
  .node-tooltip.flipped {
    transform: translate(-50%, 0) translateY(16px) scale(0.96);
    transform-origin: center top;
  }
  .node-tooltip.flipped.visible {
    transform: translate(-50%, 0) translateY(16px) scale(1);
  }
  .node-tooltip.soc { border: 1.5px solid #aab2ff; }
  .node-tooltip.croc { border: 1.5px solid #ff9d8a; }
  .node-tooltip strong {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .node-tooltip.soc strong { color: #aab2ff; }
  .node-tooltip.croc strong { color: #ff9d8a; }
  .node-tip-link {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
    pointer-events: auto;
    border-bottom: 1px solid currentColor;
    padding-bottom: 1px;
    width: fit-content;
  }
  .node-tooltip.soc .node-tip-link { color: #aab2ff; }
  .node-tooltip.croc .node-tip-link { color: #ff9d8a; }
  .node-tip-link:hover { opacity: 0.8; }
</style>
</head>
<body>

<div class="lang-bar" role="tablist" aria-label="Language">
  <button type="button" role="tab" data-lang="en" class="active" aria-selected="true">EN</button>
  <button type="button" role="tab" data-lang="es" aria-selected="false">ES</button>
  <button type="button" role="tab" data-lang="pt" aria-selected="false">PT</button>
  <button type="button" role="tab" data-lang="fr" aria-selected="false">FR</button>
  <button type="button" role="tab" data-lang="ja" aria-selected="false">JA</button>
  <button type="button" role="tab" data-lang="ar" aria-selected="false">AR</button>
</div>

<div class="diagram-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="335 -53 1000 1000" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="vign" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- The loop stroke: cool SOC side to red CROC side -->
    <linearGradient id="loopGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#3a4cff"/>
      <stop offset="0.30" stop-color="#6b6fe0"/>
      <stop offset="0.50" stop-color="#e8e8ee"/>
      <stop offset="0.70" stop-color="#ff5a3c"/>
      <stop offset="1.00" stop-color="#ff2018"/>
    </linearGradient>
    <linearGradient id="titleInf" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0.00" stop-color="#3a4cff"/>
      <stop offset="0.40" stop-color="#6b6fe0"/>
      <stop offset="0.60" stop-color="#ff5a3c"/>
      <stop offset="1.00" stop-color="#ff2018"/>
    </linearGradient>

    <radialGradient id="socNode" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset="1" stop-color="#222a7a"/>
    </radialGradient>
    <radialGradient id="crocNode" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ff5238"/>
      <stop offset="1" stop-color="#7a1810"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- The infinity path. Two lobes centered at x=560 and x=1040, y=470 -->
    <path id="infinity" fill="none"
      d="M 560 470
         C 560 340, 720 340, 800 470
         C 880 600, 1040 600, 1040 470
         C 1040 340, 880 340, 800 470
         C 720 600, 560 600, 560 470 Z"/>
  </defs>

  <rect x="0" y="-100" width="1600" height="1200" fill="url(#bg)"/>
  <rect x="0" y="-100" width="1600" height="1200" fill="url(#vign)"/>

  <!-- Title -->
  <text id="t-title" x="1015" y="120" text-anchor="end" fill="#f5f5f7" font-size="52" font-weight="700" letter-spacing="0.5">The Future of SOC is</text>
  <!-- Title infinity drawn as a vector path so the gradient is renderer-independent -->
  <g id="title-infinity" transform="translate(1073, 104)">
    <path d="M -34 0
             C -34 -19, -7 -19, 0 0
             C 7 19, 34 19, 34 0
             C 34 -19, 7 -19, 0 0
             C -7 19, -34 19, -34 0 Z"
          fill="none" stroke="url(#titleInf)" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text id="t-subtitle" x="800" y="166" text-anchor="middle" fill="#8a8a93" font-size="23" font-weight="400" letter-spacing="3">A LOOP THAT DOES NOT MOVE IS NOT A LOOP</text>

  <!-- Soft glow under the loop -->
  <use href="#infinity" stroke="#ff3520" stroke-width="20" opacity="0.18" filter="url(#softGlow)"/>

  <!-- The loop itself -->
  <use href="#infinity" stroke="url(#loopGrad)" stroke-width="6" opacity="0.95" filter="url(#glow)"/>
  <!-- faint dashed underlay to suggest "the diagram" beneath the live loop -->
  <use href="#infinity" stroke="#3a3a45" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.6"/>

  <!-- Moving intelligence: particles traveling the path -->
  <g filter="url(#glow)">
    <circle r="7" fill="#dfe2ff">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto"><mpath href="#infinity"/></animateMotion>
    </circle>
    <circle r="6" fill="#ff6a4a">
      <animateMotion dur="6s" begin="-1.5s" repeatCount="indefinite" rotate="auto"><mpath href="#infinity"/></animateMotion>
    </circle>
    <circle r="7" fill="#ffd0c4">
      <animateMotion dur="6s" begin="-3s" repeatCount="indefinite" rotate="auto"><mpath href="#infinity"/></animateMotion>
    </circle>
    <circle r="6" fill="#9aa0ff">
      <animateMotion dur="6s" begin="-4.5s" repeatCount="indefinite" rotate="auto"><mpath href="#infinity"/></animateMotion>
    </circle>
  </g>

  <!-- SOC node (left lobe) -->
  <circle cx="560" cy="470" r="92" fill="url(#socNode)" filter="url(#glow)"/>
  <circle cx="560" cy="470" r="92" fill="none" stroke="#aab2ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Power pulse: 1.5s initial delay, then a 2.5s pulse, then 1.5s wait before it repeats -->
  <circle cx="560" cy="470" r="92" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0;0" keyTimes="0;0.075;0.625;1" begin="1.5s" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="470" r="92" fill="none" stroke="#dfe2ff" stroke-width="3" opacity="0">
    <animate attributeName="r" values="88;88;115;115" keyTimes="0;0.0625;0.625;1" calcMode="spline"
      keySplines="0.2 0.8 0.2 1;0.2 0.8 0.2 1;0 0 1 1" begin="1.5s" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.0625;0.625;1" calcMode="spline"
      keySplines="0.2 0.8 0.2 1;0.3 0 0.6 1;0 0 1 1" begin="1.5s" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="4;3;0.5;0.5" keyTimes="0;0.0625;0.625;1" begin="1.5s" dur="4s" repeatCount="indefinite"/>
  </circle>

  <text x="560" y="452" text-anchor="middle" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="2">SOC</text>
  <text id="t-soc-sub" x="560" y="478" text-anchor="middle" fill="#aab2ff" font-size="14" font-weight="500" letter-spacing="1">SecOps</text>
  <text id="t-soc-1" x="560" y="506" text-anchor="middle" fill="#cdd2ff" font-size="17" font-weight="600" letter-spacing="1">PROTECTS</text>
  <text id="t-soc-2" x="560" y="528" text-anchor="middle" fill="#cdd2ff" font-size="17" font-weight="600" letter-spacing="1">TODAY</text>

  <!-- CROC node (right lobe) -->
  <circle cx="1040" cy="470" r="92" fill="url(#crocNode)" filter="url(#glow)"/>
  <circle cx="1040" cy="470" r="92" fill="none" stroke="#ff9d8a" stroke-width="1.5" opacity="0.5"/>

  <!-- Power pulse: 1.5s initial delay, then a 2.5s pulse, then 1.5s wait before it repeats -->
  <circle cx="1040" cy="470" r="92" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0;0" keyTimes="0;0.075;0.625;1" begin="1.5s" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="470" r="92" fill="none" stroke="#ffb8a8" stroke-width="3" opacity="0">
    <animate attributeName="r" values="88;88;115;115" keyTimes="0;0.0625;0.625;1" calcMode="spline"
      keySplines="0.2 0.8 0.2 1;0.2 0.8 0.2 1;0 0 1 1" begin="1.5s" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.0625;0.625;1" calcMode="spline"
      keySplines="0.2 0.8 0.2 1;0.3 0 0.6 1;0 0 1 1" begin="1.5s" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="4;3;0.5;0.5" keyTimes="0;0.0625;0.625;1" begin="1.5s" dur="4s" repeatCount="indefinite"/>
  </circle>

  <text x="1040" y="452" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="2">CROC</text>
  <text id="t-croc-sub" x="1040" y="478" text-anchor="middle" fill="#ff9d8a" font-size="14" font-weight="500" letter-spacing="1">CyberRiskOps</text>
  <text id="t-croc-1" x="1040" y="506" text-anchor="middle" fill="#ffd2c8" font-size="17" font-weight="600" letter-spacing="1">PROTECTS</text>
  <text id="t-croc-2" x="1040" y="528" text-anchor="middle" fill="#ffd2c8" font-size="17" font-weight="600" letter-spacing="1">TOMORROW</text>

  <!-- Crossover label at the center -->
  <text id="t-crossover" x="800" y="635" text-anchor="middle" fill="#e8e8ee" font-size="22" font-weight="600" letter-spacing="0.5">Intelligence moves at machine speed, or it is history.</text>

  <!-- Process verbs over each arc, from the loop's two cycles -->
  <text id="t-proc-left" x="560" y="238" text-anchor="middle" fill="#c6cbff" font-size="16" font-weight="600" letter-spacing="1">DETECT  ·  INVESTIGATE  ·  RESPOND</text>
  <text id="t-proc-right" x="1040" y="238" text-anchor="middle" fill="#ffb0a0" font-size="16" font-weight="600" letter-spacing="1">IDENTIFY · PRIORITIZE · REDUCE · VERIFY · MONITOR</text>

  <!-- Flow captions: what travels each way -->
  <text id="t-flow-left" x="560" y="266" text-anchor="middle" fill="#9aa0ff" font-size="15" font-weight="500" letter-spacing="0.5">incidents, detections, actionable insight</text>
  <text id="t-flow-right" x="1040" y="266" text-anchor="middle" fill="#ff8a73" font-size="15" font-weight="500" letter-spacing="0.5">exposures, risk scores, asset criticality</text>
  <text id="t-bot-left" x="560" y="712" text-anchor="middle" fill="#6f6f7a" font-size="15" font-weight="400" letter-spacing="0.5">what is happening right now?</text>
  <text id="t-bot-right" x="1040" y="712" text-anchor="middle" fill="#6f6f7a" font-size="15" font-weight="400" letter-spacing="0.5">what is our exposure, and what do we do today?</text>

  <!-- Feedback note -->
  <text id="t-footer" x="800" y="800" text-anchor="middle" fill="#5a5a63" font-size="15" font-weight="400" letter-spacing="2">EVERY CYCLE POWERS THE NEXT</text>

  <!-- Compass triple-arrow ring (thin body, wedge tip, spinning clockwise) -->
  <g id="compass-arrows">
    <animateTransform attributeName="transform" attributeType="XML"
      type="rotate"
      from="0 800 470" to="360 800 470"
      dur="12s" repeatCount="indefinite"/>
    
    <path d="M 805.23 420.27 A 50 50 0 0 1 848.06 483.78 L 851.91 484.88 L 839.84 493.00 L 836.53 480.47 L 840.37 481.58 A 42 42 0 0 0 804.39 428.23 Z" fill="#B71C1C" stroke="none"/>

  </g>

  function centerTitleGroup() {

    if (!titleEl || !iconGroup) return;
    const GAP = 24;        // gap between end of title text and start of the infinity glyph
    const ICON_WIDTH = 68; // the glyph path spans -34..+34
    const CENTER_X = 800;  // same horizontal center used by the subtitle below
    let textWidth;
    try { textWidth = titleEl.getBBox().width; } catch (e) { return; }
    const combinedWidth = textWidth + GAP + ICON_WIDTH;
    const leftEdge = CENTER_X - combinedWidth / 2;
    const textEndX = leftEdge + textWidth;
    titleEl.setAttribute('x', textEndX);
    const iconCenterX = textEndX + GAP + ICON_WIDTH / 2;
    iconGroup.setAttribute('transform', 'translate(' + iconCenterX + ', 104)');
  }

  function setLang(lang) {
    const dict = T[lang];
    if (!dict) return;
    Object.entries(dict).forEach(([id, text]) => {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    });
    buttons.forEach(b => {
      const isActive = b.dataset.lang === lang;
      b.classList.toggle('active', isActive);
      b.setAttribute('aria-selected', String(isActive));
    });
    document.documentElement.setAttribute('lang', lang);
    centerTitleGroup();
  }

    setLang(supported.indexOf(code) !== -1 ? code : 'en');
  })();

    const labelForCurrentLang = () => {
      const lang = document.documentElement.getAttribute('lang') || 'en';

    };

    let active = false;

    function positionAt(x, y) {
      cta.style.left = x + 'px';
      cta.style.top  = y + 'px';
      cta.classList.remove('flipped');
      requestAnimationFrame(() => {
        const r = cta.getBoundingClientRect();
        // Flip below cursor if no room above
        if (r.top < 8) cta.classList.add('flipped');
        // Clamp horizontally to ±12px from viewport edges
        const halfW = r.width / 2;
        if (x - halfW < 12) {
          cta.style.left = (12 + halfW) + 'px';
        } else if (x + halfW > window.innerWidth - 12) {
          cta.style.left = (window.innerWidth - 12 - halfW) + 'px';
        }
      });
    }

    trigger.addEventListener('mouseenter', e => {
      active = true;
      ctaText.textContent = labelForCurrentLang();
      positionAt(e.clientX, e.clientY);
      cta.classList.add('visible');
      cta.setAttribute('aria-hidden', 'false');
    });
    trigger.addEventListener('mousemove', e => {
      if (!active) return;
      positionAt(e.clientX, e.clientY);
      // Update text in case the language was switched mid-hover
      ctaText.textContent = labelForCurrentLang();
    });
    trigger.addEventListener('mouseleave', () => {
      active = false;
      cta.classList.remove('visible');
      cta.setAttribute('aria-hidden', 'true');
    });
    // Hide the pill once the modal opens, in case the click lands before mouseleave fires
    trigger.addEventListener('click', () => {
      active = false;
      cta.classList.remove('visible');
      cta.setAttribute('aria-hidden', 'true');
    });
  })();

    };

      const hit = document.getElementById(hitId);
      const tip = document.getElementById(tipId);
      const label = document.getElementById(labelId);
      const text = document.getElementById(textId);
      const link = document.getElementById(linkId);
      if (!hit || !tip || !label || !text || !link) return;

      let active = false;

      function fillCopy() {
        const c = copyForCurrentLang();
        label.textContent = key === 'soc' ? c.socLabel : c.crocLabel;
        text.textContent = c[key];
        link.textContent = key === 'soc' ? c.socLink : c.crocLink;
      }

      function positionAt(x, y) {
        tip.style.left = x + 'px';
        tip.style.top  = y + 'px';
        tip.classList.remove('flipped');
        requestAnimationFrame(() => {
          const r = tip.getBoundingClientRect();
          if (r.top < 8) tip.classList.add('flipped');

          if (x - halfW < 12) {
            tip.style.left = (12 + halfW) + 'px';
          } else if (x + halfW > window.innerWidth - 12) {
            tip.style.left = (window.innerWidth - 12 - halfW) + 'px';

        clearTimeout(hideTimer);

      function hide() {

      // tooltip itself (to click the link) doesn't dismiss it first.

        clearTimeout(hideTimer);
        hideTimer = setTimeout(hide, 150);
      }

      hit.addEventListener('mousemove', e => { if (active) positionAt(e.clientX, e.clientY); });
      hit.addEventListener('mouseleave', scheduleHide);
      tip.addEventListener('mouseenter', () => clearTimeout(hideTimer));
      tip.addEventListener('mouseleave', scheduleHide);

      // its link directly, so the person doesn't have to aim for the
      // small link text.
      hit.addEventListener('click', () => {

      link.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
      link.addEventListener('click', e => e.stopPropagation());
    }

     b:"التكنولوجيا هي مضاعف القوة في استراتيجية الأمن السيبراني الخاصة بك، لكن فقط عندما تخدم هدفًا واضحًا. تحويل المخاطر السيبرانية إلى أرقام (CRQ) يترجم المخاطر التقنية إلى لغة مالية يمكن للمسؤولين التنفيذيين التصرف بناءً عليها. إدارة التعرض للمخاطر السيبرانية (CREM) ترسم وتحدد أولويات سطح الهجوم الخاص بك باستمرار قبل أن يتمكن الخصوم من استغلاله. الكشف والاستجابة الموسعة (XDR) توحد الرؤية عبر نقاط النهاية والشبكات والسحابة والهوية في صورة واحدة مترابطة. استخبارات التهديدات تغذي بوصلتك بسياق الخصم، محوّلة التنبيهات التفاعلية إلى قرارات استباقية. الأتمتة تزيل الاحتكاك اليدوي الذي يبطئ الاستجابة وتسمح لفرقك بالعمل بسرعة الآلة دون إرهاق. منصة موحدة تربط كل هذا معًا، لتحل محل الحلول المجزأة بذكاء متكامل. الذكاء الاصطناعي يوسّع ما يمكن للفرق البشرية القيام به عبر كل طبقة. التكنولوجيا لا تحدد استراتيجيتك. إنها تنفذها."}
  ]
};

const IDS={crm:'t-crm',pap:'t-pap',bab:'t-bab',dar:'t-dar',rad:'t-rad',dub:'t-dub',cr:'t-cr',rai:'t-rai',aab:'t-aab',ppl:'t-ppl',prc:'t-prc',tch:'t-tch'};

let lang=(()=>{const n=(navigator.language||'en').slice(0,2).toLowerCase();return T[n]?n:'en';})();

function applyLang(l){
  lang=l;
  const t=T[l];
  Object.entries(IDS).forEach(([k,id])=>{
    const el=document.getElementById(id);
    if(el) el.textContent=t[k];
    else console.warn('Missing element:',id);
  });
  document.getElementById('compass-title').textContent=t.title;
  document.getElementById('credit').innerHTML=t.credit+'<br><a href="https://www.linkedin.com/in/jpcastro/" target="_blank" style="color:rgba(255,255,255,.5);text-decoration:none;">Juan Pablo Castro Vilaró</a>';
  // Line1 stays on its own line; line2 follows on same line if space allows,
  // otherwise breaks cleanly below line1 (never mid-word)
  document.getElementById('pub-link').innerHTML=
    '<a href="'+t.pubUrl+'" target="_blank" style="color:rgba(255,255,255,.45);text-decoration:none;display:block;margin-bottom:3px;">'+
      '<span style="display:inline;white-space:nowrap;">'+t.pubLine1+'</span> '+
      '<span style="display:inline;white-space:nowrap;">'+t.pubLine2+'</span>'+
    '</a>'+
    '<a href="'+t.pubDoiUrl+'" target="_blank" style="color:rgba(255,255,255,.28);text-decoration:none;">DOI: '+t.pubDoi+'</a>';
  ['en','es','pt','fr','ja','ar'].forEach(c=>{
    const b=document.getElementById('btn-'+c);
    b.style.background=c===l?'#E01C24':'rgba(255,255,255,0.1)';
    b.style.color=c===l?'#fff':'#888';
  });
}

function setLang(l){applyLang(l);}

// Tooltip
const tt=document.getElementById('tt');
const tth=document.getElementById('tt-h');
const tts=document.getElementById('tt-s');
const ttb=document.getElementById('tt-b');
const stage=document.getElementById('stage');

function posTT(cx,cy){
  const W=285,H=tt.offsetHeight||220;
  const sw=stage.offsetWidth,sh=stage.offsetHeight;
  let x=cx+14,y=cy+14;
  if(x+W>sw) x=cx-W-14;
  if(y+H>sh) y=cy-H-14;
  if(x<6) x=6;
  if(y<6) y=6;
  tt.style.left=x+'px';
  tt.style.top=y+'px';
}

// Unified mouse handler - single source of truth
// All tooltip logic driven from one mousemove on the stage overlay
let puzzleAngle=0;
let lastCX=0, lastCY=0;
let hoverState=-1; // -1=none, 0/1/2=sector, 3/4/5=puzzle piece

const CX=540, CY=540;
const PUZZLE_OUTER=200, PUZZLE_INNER=122;
const SECTOR_OUTER=432, SECTOR_INNER=210;

function getZone(svgX, svgY){
  const dx=svgX-CX, dy=svgY-CY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  // Angle 0=top, clockwise
  const angle=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;

  // Puzzle ring
  if(dist>=PUZZLE_INNER && dist<=PUZZLE_OUTER){
    // At rotation=0: People=300°-60°, Process=60°-180°, Technology=180°-300°
    // Subtract puzzleAngle to get piece-local angle, then offset by 300° so People starts at 0
    const local=((angle-puzzleAngle)%360+360)%360;
    const adjusted=(local-300+360)%360;
    return 3+Math.floor(adjusted/120); // 3=People,4=Process,5=Technology
  }

  // Outer sector ring
  if(dist>=SECTOR_INNER && dist<=SECTOR_OUTER){
    // Boundaries at 15°, 135°, 255° (from SVG path endpoints)
    // Sector 0 (CRM):         15°-135°  (top-right)
    // Sector 1 (D&R):        135°-255°  (bottom)
    // Sector 2 (Resilience): 255°-360° and 0°-15° (top-left, wraps)
    if(angle>=15  && angle<135) return 0;
    if(angle>=135 && angle<255) return 1;
    return 2;
  }
  return -1;
}

function showTT(zone, cx, cy){
  const d = zone<3 ? TT[lang][zone] : TTP[lang][zone-3];
  tth.textContent=d.h; tts.textContent=d.s; ttb.textContent=d.b;
  tt.classList.add('on');
  posTT(cx, cy);
}

// Single mousemove listener on the hits SVG (sits above everything)
const hitsSvg=document.getElementById('hits');
hitsSvg.style.pointerEvents='all';
// Remove individual hit path pointer events - we handle everything here
[0,1,2].forEach(i=>{
  const el=document.getElementById('hit'+i);
  if(el) el.style.pointerEvents='none';
});

hitsSvg.addEventListener('mousemove', function(e){
  const r=stage.getBoundingClientRect();
  const cx=e.clientX-r.left, cy=e.clientY-r.top;
  lastCX=cx; lastCY=cy;
  const scale=1080/r.width;
  const zone=getZone(cx*scale, cy*scale);
  // If in puzzle ring, mark as -2 so tick loop keeps refreshing even when not moving
  hoverState=(zone>=3)?-2:zone;
  if(zone===-1){ tt.classList.remove('on'); hitsSvg.style.cursor='default'; }
  else { showTT(zone, cx, cy); hoverState=zone; hitsSvg.style.cursor='pointer'; }
});

hitsSvg.addEventListener('mouseleave', function(){
  tt.classList.remove('on');
  hoverState=-1;
  hitsSvg.style.cursor='default';
});

// Animation
const A={T:31.8,t:0,spin:0,needle:0,lastActive:75,centers:[75,195,315],cd:6.0,pc:[1.0,3.0,5.0],W:1.3,last:0};
function easeOut(x){return 1-Math.pow(1-x,3);}
function pulse(cp,c){let d=Math.abs(cp-c);d=Math.min(d,A.cd-d);return d>A.W?0:0.5*(1+Math.cos(Math.PI*d/A.W));}
function lerp(a,b,p){return a+(b-a)*p;}

function tick(now){
  const dt=Math.min(0.05,(now-A.last)/1000);
  A.last=now; A.t+=dt; if(A.t>=A.T)A.t-=A.T; A.spin+=dt;

  const root=document.getElementById('compassRoot');
  const needleEl=document.getElementById('needle');
  const grps=[document.getElementById('grp0'),document.getElementById('grp1'),document.getElementById('grp2')];
  const glows=[document.getElementById('glow0'),document.getElementById('glow1'),document.getElementById('glow2')];
  const puzzle=document.getElementById('puzzle');

  const id=1.8,p=Math.max(0,Math.min(1,A.t/id)),e=easeOut(p);
  if(root){
    root.setAttribute('transform','translate(540,540) rotate('+lerp(-150,0,e).toFixed(2)+') scale('+lerp(0.80,1,e).toFixed(3)+') translate(-540,-540)');
    root.setAttribute('opacity',Math.max(0,Math.min(1,p*1.7)).toFixed(3));
  }

  const tc=A.t-id,cp=tc<0?-99:((tc%A.cd+A.cd)%A.cd);
  const ps=[0,1,2].map(i=>tc<0?0:pulse(cp,A.pc[i]));
  const sum=ps.reduce((a,b)=>a+b,0);

  grps.forEach((g,i)=>{if(g)g.setAttribute('opacity',lerp(0.40,1.0,Math.min(1,0.50+(0.50)*ps[i])).toFixed(3));});
  glows.forEach((g,i)=>{if(g){const gw=Math.max(0,Math.min(1,(Math.min(1,0.50+(0.50)*ps[i])-0.55)/0.45));g.setAttribute('opacity',(gw*0.20).toFixed(3));}});

  let target=A.lastActive;
  if(sum>0.04){
    let sx=0,sy=0;
    ps.forEach((v,i)=>{const a=A.centers[i]*Math.PI/180;sx+=v*Math.sin(a);sy+=v*Math.cos(a);});
    target=Math.atan2(sx,sy)*180/Math.PI;
    let mi=0;ps.forEach((v,i)=>{if(v>ps[mi])mi=i;});A.lastActive=A.centers[mi];
  }
  let diff=((target-A.needle+540)%360)-180;
  A.needle+=diff*0.10;
  const sway=(sum<0.15?4:1.2)*Math.sin(A.t*2.0);
  if(needleEl)needleEl.setAttribute('transform','rotate('+((A.needle+sway).toFixed(2))+' 540 540)');
  const pAngle=(A.spin*13)%360;
  puzzleAngle=pAngle;
  if(puzzle)puzzle.setAttribute('transform','rotate('+pAngle.toFixed(2)+' 540 540)');
  // Refresh tooltip live every frame when cursor is over puzzle ring
  if(hoverState>=3 || hoverState===-2){
    const scale=1080/stage.offsetWidth;
    const zone=getZone(lastCX*scale, lastCY*scale);
    if(zone!==hoverState){
      hoverState=zone;
      if(zone===-1){ tt.classList.remove('on'); hitsSvg.style.cursor='default'; }
      else { showTT(zone, lastCX, lastCY); hitsSvg.style.cursor='pointer'; }
    }
  }

  requestAnimationFrame(tick);
}

// Init
applyLang(lang);
A.last=performance.now();
requestAnimationFrame(tick);

// --- injected: receive language from parent ---
window.addEventListener('message', function(e){
  if (e && e.data && e.data.type === 'setLang' && e.data.lang) {
    try { setLang(e.data.lang); } catch (err) {}
  }
});
<\/script>

  const active = document.querySelector('.lang-bar button.active');

function openCompass() {

  // Set srcdoc fresh each open so the animation starts clean
  ccIframe.srcdoc = COMPASS_HTML;

  ccIframe.onload = function () {

      ccIframe.contentWindow.postMessage({ type: 'setLang', lang: lang }, '*');
    } catch (e) {}

}

function closeCompass() {
  ccModal.classList.remove('open');
  document.body.style.overflow = '';
  // Stop the inner requestAnimationFrame loop by tearing down the document
  setTimeout(function () { ccIframe.srcdoc = ''; }, 240);
}

ccClose.addEventListener('click', closeCompass);
ccBackdrop.addEventListener('click', closeCompass);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && ccModal.classList.contains('open')) closeCompass();
});

// Expose for the SVG's onclick
window.openCompass = openCompass;

<script>
// JS-driven needle animation. Replaces SMIL because SMIL chaining/value
// mutation is unreliable across browsers. We keep the original stepped
// motion (10 keyTimes) and alternate direction CW -> CCW -> CW -> ... at
// every 16-second cycle boundary.
(function () {
  const needle = document.getElementById('needle');
  if (!needle) return;
  const TIMES   = [0, 0.19, 0.205, 0.42, 0.435, 0.65, 0.665, 0.88, 0.895, 1];
  const CW      = [0, 430, 430, 920, 920, 1390, 1390, 1940, 1940, 2160];
  const CCW     = CW.map(function (a) { return -a; });
  // Per-segment easing: SMIL had spline curves for moves and linear for
  // pauses. Approximate with ease-out for moves, identity for pauses.
  // Each entry is [x1, y1, x2, y2] for cubic-bezier(x1,y1,x2,y2).
  const SPL = [
    [0.25, 0.10, 0.18, 1.00], // move
    [0.00, 0.00, 1.00, 1.00], // pause (linear, no movement anyway)
    [0.30, 0.10, 0.20, 1.00],
    [0.00, 0.00, 1.00, 1.00],
    [0.22, 0.10, 0.18, 1.00],
    [0.00, 0.00, 1.00, 1.00],
    [0.30, 0.10, 0.20, 1.00],
    [0.00, 0.00, 1.00, 1.00],
    [0.25, 0.10, 0.20, 1.00]
  ];
  const CYCLE_MS = 16000;

  // Solve y on a cubic-bezier curve given x (Newton's method).
  function bezier(t, x1, y1, x2, y2) {
    let u = t;
    for (let i = 0; i < 8; i++) {
      const cx = 3*(1-u)*(1-u)*u*x1 + 3*(1-u)*u*u*x2 + u*u*u;
      const dx = 3*(1-u)*(1-u)*x1 - 6*u*(1-u)*x1
               + 6*(1-u)*u*x2 - 3*u*u*x2 + 3*u*u;
      if (Math.abs(dx) < 1e-6) break;
      u -= (cx - t) / dx;
      if (u < 0) u = 0; else if (u > 1) u = 1;
    }
    return 3*(1-u)*(1-u)*u*y1 + 3*(1-u)*u*u*y2 + u*u*u;
  }

  const startTime = performance.now();

  function frame(now) {
    const elapsed     = now - startTime;
    const cycleIndex  = Math.floor(elapsed / CYCLE_MS);   // 0, 1, 2, 3, ...
    const t           = (elapsed % CYCLE_MS) / CYCLE_MS;  // 0..1 within current cycle
    // Alternate every cycle. Even cycle = CW, odd cycle = CCW.
    const useCW       = cycleIndex % 2 === 0;
    const angles = useCW ? CW : CCW;
    // Locate current segment
    let i = 0;
    while (i < TIMES.length - 1 && TIMES[i+1] <= t) i++;
    if (i >= TIMES.length - 1) i = TIMES.length - 2;
    const segStart = TIMES[i];
    const segEnd   = TIMES[i+1];
    const segT     = (t - segStart) / (segEnd - segStart);
    const eased    = bezier(segT, SPL[i][0], SPL[i][1], SPL[i][2], SPL[i][3]);
    const angle    = angles[i] + (angles[i+1] - angles[i]) * eased;
    needle.setAttribute('transform', 'rotate(' + angle.toFixed(2) + ' 800 470)');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
