<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberRiskOps &middot; build sequence</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000; --steel:#6D6E71; --croc:#C40000; --crem:#6E0000;
    --red-bright:#D7191F; --red-deep:#6E0000;
    --accent:#C4322B;
    --ui:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    --paper:#FFFFFF;
    --label-weight:400;
    --face:"Saira Extra Condensed","Barlow Condensed","Fira Sans Extra Condensed","Arial Narrow",Arial,sans-serif;
    --ease:cubic-bezier(.4,0,.2,1); --morph:cubic-bezier(.32,1.14,.6,1);
    --dx:0px;   /* how far the big gears draw in to mesh */
    --grow:1.1s; --fade:.85s;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink)}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--face);color:#D8D8D8}
  .stage{position:relative;width:100%;max-width:1600px}
  svg{display:block;width:100%;height:auto}

  /* ---- Japanese: a system CJK stack, its own type scale, and no glyph squeezing.
     CJK glyphs sit on a fixed full-width em, so compressing them wrecks the stroke
     balance; where a label will not fit, the size comes down instead. ---- */
  :root{
    --spin:16s;   /* one revolution; all three gears share it, being 8-toothed */
    --face-jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,
              "Noto Sans JP","Noto Sans CJK JP",Meiryo,sans-serif;
    /* the latin faces only, with no generic terminator: a generic family would
       claim the kanji before the CJK stack was ever reached */
    --face-ja:"Saira Extra Condensed","Barlow Condensed","Fira Sans Extra Condensed",
              "Arial Narrow","Helvetica Neue Condensed",var(--face-jp);
    --ui-ja:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,var(--face-jp);
  }
  /* Latin first, CJK second. A font is only used for the glyphs it actually has,
     so the acronyms keep the original condensed face while the kana and kanji fall
     through to the system CJK stack. One rule covers CROC, CREM and the hinge. */
  svg.ja .t{font-family:var(--face-ja);letter-spacing:0}
  svg.ja .t-ring{font-size:16px}
  svg.ja .t-flow{font-size:24px}
  svg.ja .t-gear{font-size:22px}
  svg.ja .t-arc{font-size:26px}
  body.ja{font-family:var(--ui-ja)}
  body.ja .eyebrow{letter-spacing:.08em}
  body.ja .acronym{letter-spacing:.14em}
  body.ja .page-title .main{line-height:1.3;letter-spacing:0}
  body.ja #tip b{letter-spacing:.04em}
  body.ja #tip span{line-height:1.75}
  body.ja .read{letter-spacing:.02em}
  .lang-selector{position:fixed;top:22px;right:28px;z-index:20;font-family:var(--ui);
                 font-size:10.5px;font-weight:600;letter-spacing:.12em;user-select:none}
  .lang-current{display:flex;align-items:center;gap:7px;background:none;border:1px solid #303030;
                color:#888;padding:5px 9px 4px 11px;cursor:pointer;font:inherit;letter-spacing:inherit;
                transition:color .15s ease,border-color .15s ease}
  .lang-current:hover{color:#FFFFFF;border-color:#555}
  .lang-current i{font-style:normal;font-size:7px;line-height:1;color:#666;transition:transform .18s ease}
  .lang-selector.open .lang-current{color:#FFFFFF;border-color:#555}
  .lang-selector.open .lang-current i{transform:rotate(180deg)}
  .lang-list{position:absolute;top:calc(100% + 5px);right:0;min-width:100%;margin:0;padding:4px 0;
             list-style:none;background:rgba(8,8,8,.96);border:1px solid #2A2A2A;
             opacity:0;visibility:hidden;transform:translateY(-4px);
             transition:opacity .15s ease,transform .15s ease,visibility .15s}
  .lang-selector.open .lang-list{opacity:1;visibility:visible;transform:none}
  .lang-list button{display:block;width:100%;background:none;border:none;color:#888;padding:5px 11px;
                    cursor:pointer;font:inherit;letter-spacing:inherit;text-align:right;
                    transition:color .15s ease}
  .lang-list button:hover{color:#FFFFFF}
  .lang-list button.active{color:var(--accent)}

  /* ---- page title, credit and citation: taken from the CRML page's own CSS ---- */
  .page-title{position:fixed;top:30px;left:36px;z-index:10;user-select:none;max-width:480px;pointer-events:none}
  .page-title .eyebrow{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.24em;
                       color:#888;margin-bottom:18px;pointer-events:auto}
  .page-title .main{font-size:clamp(24px,2.8vw,36px);font-weight:400;color:#FFFFFF;line-height:1.12;
                    letter-spacing:-.005em;margin-bottom:16px;pointer-events:auto}
  .page-title .main em{font-style:normal;color:var(--accent);font-weight:500}
  /* tight chip: line-height 1 removes the line-box slack above and below the caps,
     and the right padding is lighter than the left because the .34em tracking leaves
     its own trailing space after the last letter */
  .acronyms{display:flex;flex-wrap:nowrap;gap:7px;align-items:center;
             width:max-content;pointer-events:auto}
  .page-title .acronym{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
                       letter-spacing:.34em;line-height:1;color:var(--accent);padding:4px 5px 3px 9px;
                       border:1px solid rgba(196,50,43,.4);border-radius:3px}
  a.acronym{text-decoration:none;transition:color .15s ease,border-color .15s ease}
  a.acronym:hover{color:#FFFFFF;border-color:rgba(196,50,43,.85)}
  .compass-link{cursor:pointer;transition:color .15s ease;color:inherit;text-decoration:none}
  .compass-link:hover{color:var(--accent)}

  .credit{position:fixed;bottom:18px;left:22px;font-size:12px;line-height:1.5;color:#666;user-select:none}
  .credit .label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
                 color:#555;margin-bottom:2px}
  .credit a{color:#888;text-decoration:none;font-size:11px;transition:color .15s}
  .credit a:hover{color:var(--accent)}

  .publication{position:fixed;bottom:22px;right:28px;z-index:10;user-select:none;text-align:right;line-height:1.4}
  .pub-title{font-size:11px;font-weight:500;color:#888;text-decoration:none;display:block;
             margin-bottom:5px;white-space:nowrap;transition:color .15s ease}
  .pub-title:hover{color:var(--accent)}
  .pub-doi{font-size:9.5px;font-weight:500;color:#666;letter-spacing:.02em}
  .pub-doi a{color:inherit;text-decoration:none;transition:color .15s ease}
  .pub-doi a:hover{color:var(--accent)}

  @media (max-width:820px){
    .page-title{top:18px;left:20px;max-width:calc(100vw - 40px)}
    .page-title .eyebrow{font-size:9px;letter-spacing:.2em;margin-bottom:10px}
    .credit{bottom:22px;left:20px}
    .pub-title{white-space:normal}
  }




  .t{fill:var(--paper);font-family:var(--face);font-weight:var(--label-weight);letter-spacing:.01em}
  .t-ring{font-size:21px}
  .t-flow{font-size:30px}
  .t-arc{font-size:30px}
  .t-gear{font-size:30px}
  .t-core{font-size:28px}

  /* ---- anything with data-from appears at its stage and stays ---- */
  [data-from]{opacity:0;transition:opacity var(--fade) ease}
  [data-from].on{opacity:1}
  /* identification and mitigation wait for the slide to finish before going: the
     delay lives in the off state, so it applies on the way out and not on the way in */
  .lateOut{transition:opacity .5s ease .9s}
  .lateOut.on{transition:opacity var(--fade) ease 0s}
  /* the band waits for the slide to land before it appears, so its end arcs take
     over from the two halves rather than materialising underneath them */
  .lateIn{transition:opacity .6s ease .85s}
  /* once the scoring ring is there, the gaps between the arrows read as that layer
     showing through, so they take its colour */
  #bandSeams{transition:stroke .8s ease}
  svg.st9 #bandSeams{stroke:var(--steel)}
  .ringIn{transform-origin:800px 450px;transform:scale(.965);
          transition:transform var(--grow) var(--morph),opacity var(--fade) ease}
  .ringIn.on{transform:scale(1)}
  /* The four phase labels peek in from behind the chevron they flow out of: the
     window is a fixed aperture and the lettering slides through it, overshooting
     a little and settling back. Top pair left to right, bottom pair right to
     left, each following its own arrow. */
  .peek{transform:translateX(var(--enter,0px));transition:opacity .12s linear}
  /* A fixed overshoot rather than a bouncy easing: an easing overshoots a share of
     the distance, and the distance here is the label's own width, so a long label
     would fly far past its mark. Keyframes hold the bounce at a constant 11 units
     whatever the language. */
  @keyframes peekIn{
    0%   {transform:translateX(var(--enter,0px))}
    74%  {transform:translateX(var(--over,0px))}
    100% {transform:translateX(0px)}
  }
  svg.st8 .peek{animation:peekIn .8s cubic-bezier(.33,0,.2,1) both}
  /* the arc lettering sweeps along its own curve, identification then mitigation */
  #sIdf,#sMit{transition:transform .9s cubic-bezier(.3,0,.2,1)}
  #sIdf{transform-origin:510px 450px;transform:rotate(var(--from,-222.7deg))}
  #sMit{transform-origin:1090px 450px;transform:rotate(var(--from,-36deg));transition-delay:.45s}
  svg.st6 #sIdf{transform:rotate(var(--to,-137.3deg))}
  svg.st6 #sMit{transform:rotate(var(--to,36deg))}

  /* one after another, in the order the loop runs */
  svg.st8 .peek[data-i18n="ctx"]{animation-delay:0s}
  svg.st8 .peek[data-i18n="pri"]{animation-delay:1s}
  svg.st8 .peek[data-i18n="ver"]{animation-delay:2s}
  svg.st8 .peek[data-i18n="mon"]{animation-delay:3s}
  /* the three bodies zoom in on arrival. The zoom rides a wrapper, so body and
     teeth scale together and no tooth can peek out of the circle on the way in. */
  .zL,.zR,.zC{transform:scale(.25);transition:transform var(--grow) var(--morph),opacity var(--fade) ease}
  .zL.on{transform:translateX(var(--dx))}
  .zR.on{transform:translateX(calc(0px - var(--dx)))}
  .zC.on{transform:none}
  .zL{transform-origin:580px 450px}
  .zR{transform-origin:1020px 450px}
  .zC{transform-origin:800px 450px}

  /* ---- Suspending motion. Safari commits style changes on a different schedule
     from Blink, so any DOM work that changes measured layout has to happen with
     transitions off, or the element animates from its previous values and the
     effect appears to replay. .nofx holds transitions only, so gear rotation is
     left alone; .wipe-now also stops animations, for a true reset. ---- */
  svg.nofx, svg.nofx *{transition:none !important}
  svg.wipe-now, svg.wipe-now *{transition:none !important;animation:none !important}

  /* ---- Step 3 rearranges the lettering. Any line that survives the rephrasing
     travels to its new place, and the fade happens while it moves, so it reads as
     one line sliding rather than two crossing. --dy is set per line at run time by
     matching the two phrasings against each other. ---- */
  .blk-short text,.blk-full text{transition:transform var(--grow) var(--ease)}
  .blk-full text{transform:translateY(var(--dy,0px))}
  svg.st3 .blk-full text{transform:none}
  .blk-short text{transform:none}
  svg.st3 .blk-short text{transform:translateY(var(--dy,0px))}

  /* ---- Three size states. The teeth sit at the silhouette radius from the
         start, hidden flush inside the body, so the morph at step 4 is the body
         shrinking to its root circle and the valleys opening up: the outline
         never moves and the three stay meshed exactly where they were. ---- */
  .body,.teeth,#lblL,#lblR,#lblC{transition:transform var(--grow) var(--morph)}
  #bL,#tL,#lblL{transform-origin:580px 450px}
  #bR,#tR,#lblR{transform-origin:1020px 450px}
  #bC,#tC,#lblC{transform-origin:800px 450px}
  #bL,#bR{transform:scale(var(--kb,1))}
  #tL,#tR{transform:scale(var(--kt,1))}
  #bC{transform:scale(var(--kbc,1))}
  #tC{transform:scale(var(--ktc,1))}
  #lblL,#lblR{transform:scale(var(--kl,1))}
  #lblC{transform:scale(var(--klc,1))}
  /* steps 1-3: the body IS the silhouette, i.e. the tip circle (r 143.6 and 84) */
  svg.st13{--kb:1.632;--kt:1.355;--kbc:1.647;--ktc:1.355;--kl:1.6;--klc:1.6}
  /* Step 4 is a single move: everything releases to 1, the finished size, and the two
     big gears draw 58 units inward at the same time. That lands their centres 162
     apart from the hinge, which puts each tooth tip 56 from the hinge's centre - inside
     a valley that spans 51 to 62. So they shrink and stay meshed rather than parting.
     They hold that position through steps 5 and 6, and open out at step 7. */
  svg.st46{--dx:58px}

  /* ---- stage 5 and 6: each loop sits concentric with its gear, then slides
         out to become the end arc of the stadium ---- */
  /* Steps 5-6: each loop is the finished end arc, held 128 units inward so it sits
     concentric with its gear in the meshed position, which also makes the two loops
     overlap by 28 across the hinge. At step 7 it releases into the stadium's arc. */
  .tuckL,.tuckR{transition:transform var(--grow) var(--ease)}
  .tuckL{transform-origin:510px 450px}
  .tuckR{transform-origin:1090px 450px}
  svg.tucked .tuckL{transform:translateX(128px)}
  svg.tucked .tuckR{transform:translateX(-128px)}


  /* ---- the lifecycle turns once the gears are cut ---- */
  @keyframes cw {to{transform:rotate(360deg)}}
  @keyframes ccw{to{transform:rotate(-360deg)}}
  .spin{transform-origin:580px 450px;will-change:transform}
  .spin.r{transform-origin:1020px 450px}
  .spin.c{transform-origin:800px 450px}
  svg.running .spin{animation:cw var(--spin) linear infinite}
  svg.running .spin.c{animation-name:ccw}   /* the middle gear reverses, as a train does */
  @media (prefers-reduced-motion:reduce){svg.running .spin{animation:none}}

  /* ---- inspect mode: dormant until the sequence finishes ---- */
  #scrim{opacity:0;transition:opacity .18s ease;pointer-events:none}
  .stage.dim #scrim{opacity:.62}
  #holes use{display:none}
  #holes use.on{display:inline}
  .hit{fill:transparent;stroke:transparent;pointer-events:none}
  svg.done .hit{pointer-events:all;cursor:pointer}

  /* ---- chrome ---- */
  .bar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
       display:flex;align-items:center;gap:8px;opacity:.28;transition:opacity .2s}
  .stage:hover .bar,.bar:focus-within{opacity:1}
  .bar button{background:transparent;border:1px solid #3A3A3A;color:#C9C9C9;
    font:500 11px/1 var(--face);letter-spacing:.1em;text-transform:uppercase;
    padding:7px 10px;border-radius:2px;cursor:pointer}
  .bar button:hover{border-color:#C40000;color:#fff;background:#170000}
  .bar button:focus-visible{outline:2px solid var(--red-bright);outline-offset:2px}
  #tip{
    position:absolute;pointer-events:none;opacity:0;transform:translateY(4px);
    transition:opacity .15s ease,transform .15s ease;
    max-width:390px;padding:11px 14px;border:1px solid #3B0000;border-left:3px solid var(--croc);
    background:rgba(8,8,8,.95);backdrop-filter:blur(2px);
  }
  #tip.show{opacity:1;transform:translateY(0)}
  #tip b{display:block;font-family:var(--face);font-size:13px;font-weight:500;letter-spacing:.11em;
         text-transform:uppercase;color:#fff;margin-bottom:5px}
  #tip span{display:block;font:400 13px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#ABABAB}
  .read{min-width:345px;text-align:center;font:500 11px/1 var(--face);
        letter-spacing:.12em;text-transform:uppercase;color:#8A8A8A}
  .read b{color:#fff;font-weight:500}
</style>
</head>

  <g id="hits">
    <use class="hit" href="#sec-idf" xlink:href="#sec-idf" data-lit="lb-idf"
         data-t="Cyber Risk Identification"
         data-d="Discovery and mapping of cyber risk across the digital ecosystem: vulnerabilities in systems, applications and processes, plus external threats and emerging risk. It rests on a continuous asset inventory that captures the relationships and interdependencies between assets, not merely a catalogue of what exists. Identification is not a static inventory. It is continuous exposure discovery, and it has to reach past what the organization owns to what it connects to and consumes."/>
    <use class="hit" href="#sec-ctx" xlink:href="#sec-ctx" data-lit="lb-ctx"
         data-t="Cyber Risk Contextualization"
         data-d="Risk without context is just noise. The same vulnerability or misconfiguration carries radically different consequences depending on where it sits and what it touches in the business. This is the stage that asks which process the component supports, what data it handles, what it can influence, and what the blast radius is if it fails or is abused. Context is what turns exposure into priority: it moves the question from what is vulnerable to what could truly hurt us, and why."/>
    <use class="hit" href="#sec-pri" xlink:href="#sec-pri" data-lit="lb-pri"
         data-t="Cyber Risk Prioritization"
         data-d="In most organizations this is where good intentions go to die, with teams drowning in alerts, vulnerability counts and control gaps. Treated as a continuous risk decision rather than a patching queue, the objective is not to fix everything but to reduce the risks that matter most to the business, fastest, with the greatest measurable impact. That means weighing technical severity against exploitability, business criticality, data sensitivity, exposure pathways and likely downstream impact. It is also where heatmaps fail."/>
    <use class="hit" href="#sec-mit" xlink:href="#sec-mit" data-lit="lb-mit"
         data-t="Cyber Risk Mitigation"
         data-d="Broader than remediation. Mitigation reduces exposure, likelihood, impact and uncertainty: sometimes patching, sometimes reconfiguring, sometimes guardrails, tighter permissions, hardened integrations or redesigned workflows so trust is not assumed where it should be verified. It is not about activity, it is about reduction. If reduced exposure, reduced consequence or reduced uncertainty cannot be demonstrated, the risk has not been mitigated."/>
    <use class="hit" href="#sec-ver" xlink:href="#sec-ver" data-lit="lb-ver"
         data-t="Cyber Risk Verification"
         data-d="The most overlooked stage. Teams assume that once an issue is fixed the risk is reduced, but controls are often partially deployed, inconsistently applied, bypassed by architecture or broken by change. Verification tests whether the mitigation actually moved the risk posture: did the exposure path close, did permissions shrink, did governance become enforceable. Exposure validation, control testing and adversarial simulation are how it is done. This is where the organization moves from assumption to evidence."/>
    <use class="hit" href="#sec-mon" xlink:href="#sec-mon" data-lit="lb-mon"
         data-t="Cyber Risk Monitoring"
         data-d="Monitoring closes the loop and restarts it. It is not passive logging but continuous awareness of changing exposure, changing business context and changing control effectiveness. What was low risk yesterday can be critical tomorrow because the surrounding context moved. Monitoring is the proof that the loop is alive: if risk cannot be observed continuously, it cannot be operated continuously."/>
    <use class="hit" href="#sec-croc" xlink:href="#sec-croc" data-lit="lb-croc"
         data-t="Cyber Risk Operations Center (CROC)"
         data-d="The operational nerve centre, and the outer ring for a reason: it is where risk is continuously observed, analysed, prioritized and acted upon. A traditional SOC monitors events. A CROC monitors risk, bringing telemetry, exposure intelligence, business context, scoring and operational decisions into one continuous cycle. It is what a mature organization needs when a SOC alone is no longer sufficient."/>
    <use class="hit" href="#sec-crem" xlink:href="#sec-crem" data-lit="lb-crem"
         data-t="Cyber Risk Exposure Management (CREM)"
         data-d="The layer that gives the organization the ability to understand exposure across the environment continuously, rather than in periodic snapshots. CREM makes exposure visible: which assets, identities, services and third-party dependencies are exposed, by what path, and how that picture is changing."/>
    <use class="hit" href="#sec-score" xlink:href="#sec-score" data-lit="lb-score"
         data-t="Continuous Cyber Risk Scoring &amp; Quantification"
         data-d="The measurement spine that runs around the whole loop. Scoring gives leaders a way to compare unlike risks in one operational language and track whether exposure is rising or falling. Quantification translates that into economic and business terms, so the conversation covers not only that a risk exists but what it would mean as disruption, financial impact or lost resilience. Scoring makes risk comparable. Quantification makes it intelligible to the board and the CFO."/>
    <use class="hit" href="#sec-assess" xlink:href="#sec-assess" data-lit="lb-assess"
         data-t="Continuous Cyber Risk Assessment"
         data-d="One of two gears in the same machine. Assessment continuously maps how the environment is changing, where exposure is increasing and which business processes are affected. It answers what is exposed and what it would cost us. Assessment without reduction becomes reporting."/>
    <use class="hit" href="#sec-reduce" xlink:href="#sec-reduce" data-lit="lb-reduce"
         data-t="Continuous Cyber Risk Reduction"
         data-d="The other gear. Reduction continuously translates that intelligence into action: architectural change, governance enforcement, control tuning and business protection. It answers what we changed and what it bought us. Reduction without assessment becomes guesswork."/>
    <use class="hit" href="#sec-core" xlink:href="#sec-core" data-lit="lb-core"
         data-t="CyberRiskOps"
         data-d="The connective tissue between strategy and execution, and the continuous operationalization of cyber risk. It turns risk management from a static process into a living system, driven by feedback loops rather than periodic review. The Cybersecurity Compass provides the strategic why, the CROC the operational where, and CyberRiskOps the process-driven how."/>
  </g>

<script>
(function(){
/* ---- i18n: autodetect, switch, and refit every label ---------------------- */
const NS = 'http://www.w3.org/2000/svg';

/* Run DOM work with motion suspended, then restore it. Two frames are needed:
   the first commits the new styles, the second re-enables transitions, so Safari
   cannot coalesce both into one recalculation and animate the difference. */
function withoutMotion(svg, fn, alsoAnimations){
  const cls = alsoAnimations ? 'wipe-now' : 'nofx';
  svg.classList.add(cls);
  fn();
  void getComputedStyle(svg).opacity;          // force the flush Safari needs
  requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.remove(cls)));
}

function pickLang(){
  const pref = (navigator.languages && navigator.languages.length ? navigator.languages
                : [navigator.language || 'en']).map(s => (s || '').toLowerCase());
  for (const l of pref){
    if (l.startsWith('ja')) return 'ja';
    if (l.startsWith('es')) return 'es';
    if (l.startsWith('pt')) return 'pt';
    if (l.startsWith('en')) return 'en';
  }
  return 'en';
}
/* Set a string and decide its width: the dictionary may carry a measured width
   (English, taken from the reference render); otherwise the label runs at its
   natural width and is only compressed if it would overflow its slot. */
const CJK = /[\u3040-\u30FF\u3400-\u9FFF\uFF00-\uFF60\uFFE0-\uFFE6]/;
function setText(el, val, slot){
  const str = Array.isArray(val) ? val[0] : val;
  const forced = Array.isArray(val) ? val[1] : null;
  /* compression is a latin device; a CJK glyph sits on a fixed em and must not be
     squeezed, so the test is on the script of the string, not the interface language */
  const cjk = CJK.test(str);
  el.textContent = str;
  el.removeAttribute('textLength'); el.removeAttribute('lengthAdjust');
  el.style.fontSize = '';
  if (cjk){
    /* never compress a CJK glyph: shrink the whole label instead */
    const nat = el.getComputedTextLength();
    if (slot && nat > slot){
      const base = parseFloat(getComputedStyle(el).fontSize) || 24;
      el.style.fontSize = (base * slot / nat).toFixed(2) + 'px';
    }
    return el.getComputedTextLength();
  }
  let len = forced || null;
  if (!len && slot){
    const nat = el.getComputedTextLength();
    if (nat > slot) len = slot;
  }
  if (len){ el.setAttribute('textLength', len); el.setAttribute('lengthAdjust', 'spacingAndGlyphs'); }
  return len || el.getComputedTextLength();
}
/* A gear's lettering: any number of lines, centred as a block, each line capped
   by the chord available at its own height inside the body circle. */
function setBlock(g, lines, D){
  const cx = +g.dataset.cx, cy = +g.dataset.cy, r = +g.dataset.r,
        lh = +g.dataset.lh, size = +g.dataset.size, cls = g.dataset.cls;
  const cap = size * 0.688, n = lines.length;
  while (g.children.length > n) g.removeChild(g.lastChild);
  const top = cy - ((n - 1) * lh) / 2;
  lines.forEach((v, i) => {
    const yc = top + i * lh;
    let t = g.children[i];
    if (!t){
      t = document.createElementNS(NS, 'text');
      t.setAttribute('text-anchor', 'middle');
      g.appendChild(t);
    }
    t.setAttribute('class', cls);
    t.setAttribute('x', cx);
    t.setAttribute('y', (yc + cap / 2).toFixed(1));
    const dy = Math.abs(yc - cy) + cap / 2;
    const slot = 2 * Math.sqrt(Math.max(1, r * r - dy * dy)) - 12;
    setText(t, v, slot);
  });
}
/* Curved lettering: recentre on the path, since the string length changed. */
function setArc(tp, val, slot){
  const len = setText(tp, val, slot);
  const path = document.getElementById(tp.dataset.arc);
  const total = path.getTotalLength();
  tp.setAttribute('startOffset', ((total - len) / 2).toFixed(1));
  return len;
}
function applyLang(code, D, after){
  withoutMotion(document.getElementById('loop'), () => applyLangNow(code, D, after));
}
function applyLangNow(code, D, after){
  const d = D[code] || D.en;
  document.documentElement.setAttribute('lang', d.lang);
  document.title = d.doc;
  const svg = document.getElementById('loop');
  svg.setAttribute('aria-label', d.aria);
  const cjk = code === 'ja';
  svg.classList.toggle('ja', cjk);
  document.body.classList.toggle('ja', cjk);
  /* chrome */
  const put = (sel, txt) => { const e = document.querySelector(sel); if (e) e.textContent = txt; };
  put('.eyebrow .compass-link', d.eyebrow_a);
  const eb = document.querySelector('.eyebrow');
  if (eb) eb.lastChild.textContent = ' \u00B7 ' + d.eyebrow_b;
  const h1 = document.querySelector('.page-title .main');
  if (h1) h1.innerHTML = d.h1_a + '<em>' + d.h1_em + '</em>' + d.h1_b;
  put('.credit .label', d.credit);
  put('.pub-title', d.pub);
  /* labels */
  svg.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n, slot = +el.dataset.slot || 0;
    if (el.dataset.arc) setArc(el, d[key], slot);
    else setText(el, d[key], slot);
  });
  svg.querySelectorAll('[data-block]').forEach(g => setBlock(g, d[g.dataset.block], D[code] || D.en));
  /* Pair the two phrasings by role, declared per language, because the surviving
     line is not always the same string: CYBER RISK stays CYBER RISK, but
     EVALUACION DE becomes EVALUACION. Line 0 of the short phrasing becomes line
     map[0] of the full one, so it travels there and changes wording on the way. */
  svg.querySelectorAll('.blk-short').forEach(sg => {
    const fg = sg.parentNode.querySelector('.blk-full');
    if (!fg) return;
    const S = [...sg.children], F = [...fg.children], y = el => +el.getAttribute('y');
    const map = d.map || [];
    F.forEach((f, k) => {
      const i = map.indexOf(k);
      f.style.setProperty('--dy', ((i >= 0 && S[i]) ? y(S[i]) - y(f) : 0).toFixed(1) + 'px');
    });
    S.forEach((s2, i) => {
      const k = map[i];
      s2.style.setProperty('--dy', ((k != null && F[k]) ? y(F[k]) - y(s2) : 0).toFixed(1) + 'px');
    });
  });
  /* tooltips */
  svg.querySelectorAll('.hit').forEach(h => {
    const k = (h.getAttribute('href') || h.getAttribute('xlink:href')).replace('#sec-', '');
    h.dataset.t = d['t_' + k]; h.dataset.d = d['d_' + k];
  });
  document.querySelectorAll('.lang-list button').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === code));
  const trig = document.querySelector('.lang-current');
  if (trig) trig.firstChild.textContent = code.toUpperCase();
  if (after) after(d);
}

ether exposure is rising or falling. Quantification translates that into economic and business terms, so the conversation covers not only that a risk exists but what it would mean as disruption, financial impact or lost resilience. Scoring makes risk comparable. Quantification makes it intelligible to the board and the CFO.", "d_assess": "One of two gears in the same machine. Assessment continuously maps how the environment is changing, where exposure is increasing and which business processes are affected. It answers what is exposed and what it would cost us. Assessment without reduction becomes reporting.", "d_reduce": "The other gear. Reduction continuously translates that intelligence into action: architectural change, governance enforcement, control tuning and business protection. It answers what we changed and what it bought us. Reduction without assessment becomes guesswork.", "d_core": "The connective tissue between strategy and execution, and the continuous operationalization of cyber risk. It turns risk management from a static process into a living system, driven by feedback loops rather than periodic review. The Cybersecurity Compass provides the strategic why, the CROC the operational where, and CyberRiskOps the process-driven how.", "assess2": [["CYBER RISK", 100], ["ASSESSMENT", 109]], "reduce2": [["CYBER RISK", 100], ["REDUCTION", 95]], "map": [1, 2]}, "es": {"lang": "es", "doc": "CyberRiskOps · Centro de Operaciones de Ciber Riesgo (CROC)", "aria": "CyberRiskOps: el ciclo del Centro de Operaciones de Ciber Riesgo, que opera la evaluación continua y la reducción continua de ciber riesgos mediante contextualización, priorización, verificación y monitoreo.", "eyebrow_a": "Cybersecurity Compass", "eyebrow_b": "Antes de una Brecha", "h1_a": "La ", "h1_em": "Operacionalización", "h1_b": " del Ciber Riesgo", "credit": "Creado y Diseñado por", "pub": "CyberRiskOps: El Modelo Operativo para la Ciber Resiliencia en la Era de la IA", "btn_pause": "Pausar engranajes", "btn_run": "Girar engranajes", "btn_svg": "Descargar SVG", "btn_png": "Descargar PNG", "btn_replay": "Repetir", "croc": "CENTRO DE OPERACIONES DE CIBER RIESGO (CROC)", "crem": "GESTIÓN DE EXPOSICIÓN A CIBER RIESGOS (CREM)", "score": "PUNTUACIÓN Y CUANTIFICACIÓN CONTINUA DE CIBER RIESGOS", "idf": "IDENTIFICACIÓN DE CIBER RIESGOS", "mit": "MITIGACIÓN DE CIBER RIESGOS", "ctx": "CONTEXTUALIZACIÓN", "pri": "PRIORIZACIÓN", "mon": "MONITOREO", "ver": "VERIFICACIÓN", "assess": ["EVALUACIÓN", "CONTINUA DE", "CIBER RIESGOS"], "reduce": ["REDUCCIÓN", "CONTINUA DE", "CIBER RIESGOS"], "core": ["CYBER", "RISKOPS"], "st": ["", "evaluación y reducción de ciber riesgos", "cyberriskops, la bisagra", "ciber riesgo continuo, no periódico", "los engranajes de ciber riesgo engranan", "el flujo de ciber riesgo toma forma", "identificación y mitigación de ciber riesgos", "el ciclo de ciber riesgo se cierra", "las cuatro fases de ciber riesgo, nombradas", "puntuación y cuantificación de ciber riesgos", "gestión de exposición a ciber riesgos (crem)", "centro de operaciones de ciber riesgo (croc)"], "t_idf": "Identificación de Ciber Riesgos", "t_ctx": "Contextualización de Ciber Riesgos", "t_pri": "Priorización de Ciber Riesgos", "t_mit": "Mitigación de Ciber Riesgos", "t_ver": "Verificación de Ciber Riesgos", "t_mon": "Monitoreo de Ciber Riesgos", "t_croc": "Centro de Operaciones de Ciber Riesgo (CROC)", "t_crem": "Gestión de Exposición a Ciber Riesgos (CREM)", "t_score": "Puntuación y Cuantificación Continua de Ciber Riesgos", "t_assess": "Evaluación Continua de Ciber Riesgos", "t_reduce": "Reducción Continua de Ciber Riesgos", "t_core": "CyberRiskOps", "d_idf": "Descubrimiento y mapeo del ciber riesgo en todo el ecosistema digital: vulnerabilidades en sistemas, aplicaciones y procesos, además de amenazas externas y riesgos emergentes. Se apoya en un inventario continuo de activos que captura las relaciones e interdependencias entre ellos, no en un simple catálogo de lo que existe. La identificación no es un inventario estático: es descubrimiento continuo de exposición, y debe ir más allá de lo que la organización posee para incluir aquello con lo que se conecta y consume.", "d_ctx": "El riesgo sin contexto es solo ruido. La misma vulnerabilidad o configuración incorrecta tiene consecuencias radicalmente distintas según dónde exista y qué toque en el negocio. Esta etapa pregunta qué proceso soporta el componente, qué datos maneja, qué sistemas puede influir y cuál es el radio de impacto si falla o es abusado. El contexto es lo que convierte la exposición en prioridad: cambia la pregunta de qué es vulnerable a qué podría realmente hacernos daño, y por qué.", "d_pri": "En la mayoría de las organizaciones aquí mueren las buenas intenciones, con equipos ahogados en alertas, conteos de vulnerabilidades y brechas de control. Tratada como una decisión continua de riesgo y no como una cola de parches, la prioridad no es arreglar todo, sino reducir los riesgos que más importan al negocio, más rápido y con el mayor impacto medible. Eso exige contrastar la severidad técnica con la explotabilidad, la criticidad del negocio, la sensibilidad de los datos, las rutas de exposición y el impacto probable. Es también donde fallan los mapas de calor.", "d_mit": "Más amplia que la remediación. La mitigación reduce exposición, probabilidad, impacto e incertidumbre: a veces parchear, a veces reconfigurar, a veces añadir barreras, ajustar permisos, endurecer integraciones o rediseñar flujos para no asumir confianza donde debe verificarse. No se trata de actividad, se trata de reducción. Si no se puede demostrar menor exposición, menor consecuencia o menor incertidumbre, el riesgo no ha sido mitigado.", "d_ver": "La etapa más pasada por alto. Se asume que al corregir un hallazgo el riesgo baja, pero los controles suelen estar parcialmente desplegados, aplicados de forma inconsistente, evadidos por la arquitectura o roto por el cambio. La verificación prueba si la mitigación movió realmente la postura de riesgo: se cerró la ruta de exposición, se redujeron los permisos, la gobernanza se volvió exigible. Validación de exposición, pruebas de control y simulación adversaria son el cómo. Aquí la organización pasa de la suposición a la evidencia.", "d_mon": "El monitoreo cierra el ciclo y lo reinicia. No es registro pasivo, sino conciencia continua de la exposición que cambia, del contexto de negocio que cambia y de la efectividad de los controles que cambia. Lo que ayer era riesgo bajo puede ser crítico mañana porque el contexto se movió. El monitoreo es la prueba de que el ciclo está vivo: si el riesgo no se puede observar de forma continua, no se puede operar de forma continua.", "d_croc": "El centro neurálgico operativo, y el anillo exterior por una razón: es donde el riesgo se observa, analiza, prioriza y atiende de forma continua. Un SOC tradicional monitorea eventos. Un CROC monitorea riesgo, integrando telemetría, inteligencia de exposición, contexto de negocio, puntuación y decisiones operativas en un mismo ciclo continuo. Es lo que una organización madura necesita cuando el SOC por sí solo ya no alcanza.", "d_crem": "La capa que permite entender la exposición en todo el entorno de forma continua, en lugar de instantáneas periódicas. CREM hace visible la exposición: qué activos, identidades, servicios y dependencias de terceros están expuestos, por qué ruta y cómo cambia ese panorama.", "d_score": "La columna de medición que recorre todo el ciclo. La puntuación da a los líderes una forma de comparar riesgos distintos en un mismo lenguaje operativo y seguir si la exposición sube o baja. La cuantificación lo traduce a términos económicos y de negocio, de modo que la conversación no cubra solo la existencia del riesgo sino lo que significaría como disrupción, impacto financiero o pérdida de resiliencia. La puntuación hace el riesgo comparable. La cuantificación lo hace inteligible para el consejo y el CFO.", "d_assess": "Uno de los dos engranajes de la misma máquina. La evaluación mapea de forma continua cómo cambia el entorno, dónde crece la exposición y qué procesos de negocio se ven afectados. Responde qué está expuesto y cuánto nos costaría. Evaluación sin reducción se convierte en reporte.", "d_reduce": "El otro engranaje. La reducción traduce continuamente esa inteligencia en acción: cambio arquitectónico, aplicación de gobernanza, ajuste de controles y protección del negocio. Responde qué cambiamos y qué obtuvimos con ello. Reducción sin evaluación se convierte en adivinanza.", "d_core": "El tejido conectivo entre estrategia y ejecución, y la operacionalización continua del ciber riesgo. Convierte la gestión de riesgo de un proceso estático en un sistema vivo, movido por bucles de retroalimentación y no por revisiones periódicas. El Cybersecurity Compass aporta el por qué estratégico, el CROC el dónde operativo, y CyberRiskOps el cómo del proceso.", "assess2": ["EVALUACIÓN DE", "CIBER RIESGOS"], "reduce2": ["REDUCCIÓN DE", "CIBER RIESGOS"], "map": [0, 2]}, "pt": {"lang": "pt", "doc": "CyberRiskOps · Centro de Operações de Ciber Risco (CROC)", "aria": "CyberRiskOps: o ciclo do Centro de Operações de Ciber Risco, que opera a avaliação contínua e a redução contínua de ciber riscos por meio de contextualização, priorização, verificação e monitoramento.", "eyebrow_a": "Cybersecurity Compass", "eyebrow_b": "Antes de uma Violação", "h1_a": "A ", "h1_em": "Operacionalização", "h1_b": " do Ciber Risco", "credit": "Criado e Desenhado por", "pub": "CyberRiskOps: O Modelo Operacional para a Ciber Resiliência na Era da IA", "btn_pause": "Pausar engrenagens", "btn_run": "Girar engrenagens", "btn_svg": "Baixar SVG", "btn_png": "Baixar PNG", "btn_replay": "Repetir", "croc": "CENTRO DE OPERAÇÕES DE CIBER RISCO (CROC)", "crem": "GESTÃO DA EXPOSIÇÃO A CIBER RISCOS (CREM)", "score": "PONTUAÇÃO E QUANTIFICAÇÃO CONTÍNUA DE CIBER RISCOS", "idf": "IDENTIFICAÇÃO DE CIBER RISCOS", "mit": "MITIGAÇÃO DE CIBER RISCOS", "ctx": "CONTEXTUALIZAÇÃO", "pri": "PRIORIZAÇÃO", "mon": "MONITORAMENTO", "ver": "VERIFICAÇÃO", "assess": ["AVALIAÇÃO", "CONTÍNUA DE", "CIBER RISCOS"], "reduce": ["REDUÇÃO", "CONTÍNUA DE", "CIBER RISCOS"], "core": ["CYBER", "RISKOPS"], "st": ["", "avaliação e redução de ciber riscos", "cyberriskops, a dobradiça", "ciber risco contínuo, não periódico", "as engrenagens de ciber risco engrenam", "o fluxo de ciber risco toma forma", "identificação e mitigação de ciber riscos", "o ciclo de ciber risco se fecha", "as quatro fases de ciber risco, nomeadas", "pontuação e quantificação de ciber riscos", "gestão da exposição a ciber riscos (crem)", "centro de operações de ciber risco (croc)"], "t_idf": "Identificação de Ciber Riscos", "t_ctx": "Contextualização de Ciber Riscos", "t_pri": "Priorização de Ciber Riscos", "t_mit": "Mitigação de Ciber Riscos", "t_ver": "Verificação de Ciber Riscos", "t_mon": "Monitoramento de Ciber Riscos", "t_croc": "Centro de Operações de Ciber Risco (CROC)", "t_crem": "Gestão da Exposição a Ciber Riscos (CREM)", "t_score": "Pontuação e Quantificação Contínua de Ciber Riscos", "t_assess": "Avaliação Contínua de Ciber Riscos", "t_reduce": "Redução Contínua de Ciber Riscos", "t_core": "CyberRiskOps", "d_idf": "Descoberta e mapeamento do ciber risco em todo o ecossistema digital: vulnerabilidades em sistemas, aplicações e processos, além de ameaças externas e riscos emergentes. Apoia-se num inventário contínuo de ativos que captura as relações e interdependências entre eles, e não num simples catálogo do que existe. A identificação não é um inventário estático: é descoberta contínua de exposição, e precisa ir além do que a organização possui para incluir aquilo a que se conecta e consome.", "d_ctx": "Risco sem contexto é apenas ruído. A mesma vulnerabilidade ou configuração incorreta carrega consequências radicalmente diferentes conforme onde existe e o que toca no negócio. Esta etapa pergunta qual processo o componente sustenta, quais dados manipula, o que pode influenciar e qual é o raio de impacto se falhar ou for abusado. O contexto é o que transforma exposição em prioridade: muda a pergunta de o que é vulnerável para o que poderia realmente nos ferir, e por quê.", "d_pri": "Na maioria das organizações é aqui que morrem as boas intenções, com equipes afogadas em alertas, contagens de vulnerabilidades e lacunas de controle. Tratada como decisão contínua de risco e não como fila de correções, a meta não é corrigir tudo, mas reduzir os riscos que mais importam ao negócio, mais rápido e com o maior impacto mensurável. Isso exige pesar a severidade técnica contra a explorabilidade, a criticidade do negócio, a sensibilidade dos dados, os caminhos de exposição e o impacto provável. É também onde os mapas de calor falham.", "d_mit": "Mais ampla que a remediação. A mitigação reduz exposição, probabilidade, impacto e incerteza: às vezes corrigir, às vezes reconfigurar, às vezes acrescentar barreiras, ajustar permissões, endurecer integrações ou redesenhar fluxos para não presumir confiança onde ela deve ser verificada. Não se trata de atividade, trata-se de redução. Se não for possível demonstrar menor exposição, menor consequência ou menor incerteza, o risco não foi mitigado.", "d_ver": "A etapa mais negligenciada. Presume-se que, corrigido o problema, o risco caiu, mas os controles muitas vezes estão parcialmente implantados, aplicados de forma inconsistente, contornados pela arquitetura ou quebrados pela mudança. A verificação testa se a mitigação realmente moveu a postura de risco: o caminho de exposição fechou, as permissões diminuíram, a governança tornou-se exigível. Validação de exposição, teste de controles e simulação adversária são o como. Aqui a organização passa da suposição à evidência.", "d_mon": "O monitoramento fecha o ciclo e o reinicia. Não é registro passivo, mas consciência contínua da exposição que muda, do contexto de negócio que muda e da eficácia dos controles que muda. O que ontem era risco baixo pode ser crítico amanhã porque o contexto ao redor se moveu. O monitoramento é a prova de que o ciclo está vivo: se o risco não pode ser observado continuamente, não pode ser operado continuamente.", "d_croc": "O centro nervoso operacional, e o anel externo por um motivo: é onde o risco é observado, analisado, priorizado e tratado continuamente. Um SOC tradicional monitora eventos. Um CROC monitora risco, reunindo telemetria, inteligência de exposição, contexto de negócio, pontuação e decisões operacionais em um único ciclo contínuo. É o que uma organização madura precisa quando o SOC sozinho já não basta.", "d_crem": "A camada que dá à organização a capacidade de entender a exposição em todo o ambiente de forma contínua, em vez de instantâneos periódicos. O CREM torna a exposição visível: quais ativos, identidades, serviços e dependências de terceiros estão expostos, por qual caminho e como esse quadro está mudando.", "d_score": "A espinha de medição que percorre todo o ciclo. A pontuação dá aos líderes uma forma de comparar riscos distintos em uma mesma linguagem operacional e acompanhar se a exposição sobe ou desce. A quantificação traduz isso em termos econômicos e de negócio, de modo que a conversa cubra não apenas a existência do risco, mas o que ele significaria como disrupção, impacto financeiro ou perda de resiliência. A pontuação torna o risco comparável. A quantificação o torna inteligível para o conselho e o CFO.", "d_assess": "Uma das duas engrenagens da mesma máquina. A avaliação mapeia continuamente como o ambiente muda, onde a exposição cresce e quais processos de negócio são afetados. Responde o que está exposto e quanto nos custaria. Avaliação sem redução torna-se relatório.", "d_reduce": "A outra engrenagem. A redução traduz continuamente essa inteligência em ação: mudança arquitetural, aplicação de governança, ajuste de controles e proteção do negócio. Responde o que mudamos e o que isso nos trouxe. Redução sem avaliação torna-se adivinhação.", "d_core": "O tecido conectivo entre estratégia e execução, e a operacionalização contínua do ciber risco. Transforma a gestão de risco de um processo estático em um sistema vivo, movido por ciclos de realimentação e não por revisões periódicas. O Cybersecurity Compass fornece o porquê estratégico, o CROC o onde operacional, e o CyberRiskOps o como do processo.", "assess2": ["AVALIAÇÃO DE", "CIBER RISCOS"], "reduce2": ["REDUÇÃO DE", "CIBER RISCOS"], "map": [0, 2]}, "ja": {"lang": "ja", "doc": "CyberRiskOps · サイバーリスクオペレーションセンター（CROC）", "aria": "CyberRiskOps：サイバーリスクオペレーションセンターのループ。継続的サイバーリスクアセスメントと継続的サイバーリスク低減を、コンテキスト化、優先順位付け、検証、監視によって運用する。", "eyebrow_a": "Cybersecurity Compass", "eyebrow_b": "侵害の前に", "h1_a": "サイバーリスクの", "h1_em": "運用化", "h1_b": "", "credit": "制作・デザイン", "pub": "CyberRiskOps：AI時代のサイバーレジリエンスのための運用モデル", "btn_pause": "歯車を停止", "btn_run": "歯車を回転", "btn_svg": "SVGを保存", "btn_png": "PNGを保存", "btn_replay": "再生", "croc": "サイバーリスクオペレーションセンター（CROC）", "crem": "サイバーリスクエクスポージャー管理（CREM）", "score": "継続的サイバーリスクスコアリングと定量化", "idf": "サイバーリスク特定", "mit": "サイバーリスク軽減", "ctx": "コンテキスト化", "pri": "優先順位付け", "mon": "監視", "ver": "検証", "assess": ["継続的", "サイバーリスク", "アセスメント"], "assess2": ["サイバーリスク", "アセスメント"], "reduce": ["継続的", "サイバーリスク", "低減"], "reduce2": ["サイバーリスク", "低減"], "core": ["CYBER", "RISKOPS"], "map": [1, 2], "st": ["", "サイバーリスクのアセスメントと低減", "CyberRiskOps、二つをつなぐ軸", "継続的なサイバーリスク、定期的ではない", "サイバーリスクの歯車が噛み合う", "サイバーリスクの流れが形になる", "サイバーリスクの特定と軽減", "サイバーリスクのループが閉じる", "四つのサイバーリスク段階に名前がつく", "サイバーリスクのスコアリングと定量化", "サイバーリスクエクスポージャー管理（CREM）", "サイバーリスクオペレーションセンター（CROC）"], "t_idf": "サイバーリスク特定", "t_ctx": "サイバーリスクのコンテキスト化", "t_pri": "サイバーリスクの優先順位付け", "t_mit": "サイバーリスク軽減", "t_ver": "サイバーリスクの検証", "t_mon": "サイバーリスクの監視", "t_croc": "サイバーリスクオペレーションセンター（CROC）", "t_crem": "サイバーリスクエクスポージャー管理（CREM）", "t_score": "継続的サイバーリスクスコアリングと定量化", "t_assess": "継続的サイバーリスクアセスメント", "t_reduce": "継続的サイバーリスク低減", "t_core": "CyberRiskOps", "d_idf": "デジタルエコシステム全体にわたるサイバーリスクの発見とマッピング。システム、アプリケーション、プロセスの脆弱性に加え、外部脅威と新たなリスクを対象とする。基盤となるのは、資産の一覧ではなく資産間の関係と相互依存を捉える継続的な資産インベントリである。特定は静的な棚卸しではなく、継続的なエクスポージャーの発見であり、自社が保有するものだけでなく、接続し利用しているものまで及ぶ必要がある。", "d_ctx": "コンテキストのないリスクは単なるノイズにすぎない。同じ脆弱性や設定不備でも、どこに存在し事業の何に触れているかで結果は大きく変わる。この段階では、その構成要素がどの業務プロセスを支え、どのデータを扱い、何に影響を与えられるのか、そして侵害された場合の影響範囲はどこまでかを問う。コンテキストこそがエクスポージャーを優先順位に変える。問いは「何が脆弱か」から「何が本当に損害をもたらすのか、そしてなぜか」へ移る。", "d_pri": "多くの組織では、ここで善意が尽きる。アラート、脆弱性の件数、統制のギャップに現場が溺れるからである。パッチの待ち行列ではなく継続的なリスク意思決定として扱えば、目的はすべてを修正することではなく、事業にとって最も重要なリスクを、最短で、最大の測定可能な効果をもって低減することになる。そのためには技術的深刻度を、悪用可能性、事業上の重要度、データの機微性、エクスポージャー経路、想定される波及影響と併せて判断する必要がある。ヒートマップが力を失うのもここである。", "d_mit": "是正措置よりも広い概念である。軽減はエクスポージャー、発生可能性、影響、そして不確実性を下げる。パッチ適用のこともあれば、再設定、ガードレールの追加、権限の絞り込み、連携の堅牢化、あるいは信頼を前提とせず検証する設計への作り替えのこともある。重要なのは活動量ではなく低減である。エクスポージャー、結果、不確実性のいずれかが下がったと示せないなら、そのリスクは軽減されていない。", "d_ver": "最も見落とされる段階である。問題を直せばリスクは下がると考えられがちだが、統制は部分的にしか適用されていない、運用が一貫しない、設計上迂回される、変更によって壊れるということが実際には起こる。検証は、その軽減が本当にリスク態勢を動かしたかを試す。エクスポージャー経路は閉じたか、権限は縮小したか、ガバナンスは強制可能になったか。エクスポージャーの妥当性確認、統制テスト、攻撃者視点のシミュレーションがその手段である。ここで組織は前提から証拠へ移る。", "d_mon": "監視はループを閉じ、同時に再び始める。受動的なログ収集ではなく、変化するエクスポージャー、変化する事業コンテキスト、変化する統制の有効性に対する継続的な認識である。昨日は低リスクだったものが、周囲のコンテキストが動いたために明日は重大になりうる。監視はループが生きている証拠である。リスクを継続的に観測できなければ、継続的に運用することはできない。", "d_croc": "運用上の神経中枢であり、外側のリングに置かれているのには理由がある。ここでリスクが継続的に観測され、分析され、優先順位づけされ、対処される。従来のSOCはイベントを監視する。CROCはリスクを監視し、テレメトリ、エクスポージャーインテリジェンス、事業コンテキスト、スコアリング、運用上の意思決定を一つの継続的なサイクルにまとめる。SOCだけでは足りなくなった成熟した組織が必要とするものである。", "d_crem": "環境全体のエクスポージャーを、定期的なスナップショットではなく継続的に把握する力を組織に与える層である。CREMはエクスポージャーを可視化する。どの資産、アイデンティティ、サービス、サードパーティ依存が、どの経路で露出しているのか、そしてその像がどう変化しているのかを示す。", "d_score": "ループ全体を貫く測定の背骨である。スコアリングは、性質の異なるリスクを一つの運用言語で比較し、エクスポージャーが上がっているのか下がっているのかを追う手段を経営に与える。定量化はそれを経済と事業の言葉に翻訳し、リスクが存在するという事実だけでなく、それが事業中断、財務影響、レジリエンスの喪失として何を意味するのかまで議論の対象にする。スコアリングはリスクを比較可能にし、定量化は取締役会とCFOに理解可能にする。", "d_assess": "同じ機械の二つの歯車のうちの一つ。アセスメントは、環境がどう変化し、どこでエクスポージャーが増え、どの業務プロセスが影響を受けるのかを継続的にマッピングする。「何が露出していて、それはいくらの損失になりうるか」に答える。低減を伴わないアセスメントは報告書になる。", "d_reduce": "もう一方の歯車。低減はその知見を継続的に行動へ翻訳する。アーキテクチャの変更、ガバナンスの強制、統制のチューニング、事業の保護である。「何を変え、それで何を得たか」に答える。アセスメントを伴わない低減は当て推量になる。", "d_core": "戦略と実行をつなぐ結合組織であり、サイバーリスクの継続的な運用化である。リスク管理を静的なプロセスから、定期的なレビューではなくフィードバックループで動く生きた仕組みへと変える。Cybersecurity Compassが戦略上の「なぜ」を、CROCが運用上の「どこで」を、CyberRiskOpsがプロセスとしての「どのように」を担う。"}};
  const svg = document.getElementById('loop'), stageEl = document.getElementById('stage');
  const read = document.getElementById('read');
  const els = [...svg.querySelectorAll('[data-from]')];
  let NAMES = ['',
    'cyber risk assessment and reduction',      // 1
    'cyber riskops, the hinge',                 // 2
    'continuous cyber risk, not periodic',      // 3
    'the cyber risk gears engage',              // 4
    'the cyber risk flow takes shape',          // 5
    'cyber risk identification and mitigation', // 6
    'the cyber risk loop closes',               // 7
    'the four cyber risk phases, named',        // 8
    'cyber risk scoring and quantification',    // 9
    'cyber risk exposure management (crem)',    // 10
    'cyber risk operations center (croc)'];     // 11       // 11
  const LAST = 11, GAP = 2000;
  /* Step 8 has to outlast its own contents: the four phase labels are staggered a
     second apart and each takes .8s to land, so the step holds until monitoring has
     arrived rather than handing over on the usual beat. Kept in step with the CSS
     delays above. */
  const PEEK_LAST = 3000, PEEK_RUN = 800;
  const DWELL = { 8: PEEK_LAST + PEEK_RUN + 400 };
  let stage = 0, timer = null;

  function render(){
    els.forEach(el => {
      const from = +el.dataset.from, until = el.dataset.until ? +el.dataset.until : 99;
      el.classList.toggle('on', stage >= from && stage <= until);
    });
    svg.classList.toggle('st13',    stage <= 3);
    svg.classList.toggle('st3',     stage >= 3);
    svg.classList.toggle('st46',    stage >= 4 && stage <= 6);
    svg.classList.toggle('tucked',  stage <= 6);
    svg.classList.toggle('st6',     stage >= 6);
    svg.classList.toggle('st8',     stage >= 8);
    svg.classList.toggle('st9',     stage >= 9);
    svg.classList.toggle('done',    stage >= LAST);
    if (stage < LAST) clearTip();
    svg.classList.toggle('running', stage >= 4);
    read.innerHTML = '<b>' + Math.max(stage,1) + ' / ' + LAST + '</b> &middot; ' + NAMES[Math.max(stage,1)];
  }
  function go(n){ stage = Math.max(0, Math.min(LAST, n)); render(); }
  function stop(){ clearTimeout(timer); timer = null; }
  function run(){
    stop();
    (function tick(){
      if (stage >= LAST) { timer = null; return; }
      go(stage + 1);
      timer = setTimeout(tick, DWELL[stage] || GAP);
    })();
  }
  /* Clear on the spot, hold the empty canvas for one beat, then rebuild. */
  function hardReset(){ withoutMotion(svg, () => go(0), true); }
  function replay(){ stop(); hardReset(); setTimeout(run, GAP); }

  document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); stop(); go(stage+1); });
  document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); stop(); go(stage-1); });
  document.getElementById('play').addEventListener('click', e => { e.stopPropagation(); replay(); });
  stageEl.addEventListener('click', () => { if (stage >= LAST) return; stop(); go(stage+1); });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight'){ stop(); go(stage+1); }
    else if (e.key === 'ArrowLeft'){ stop(); go(stage-1); }
    else if (e.key === ' '){ e.preventDefault(); timer ? stop() : (stage >= LAST ? replay() : run()); }
    else if (e.key.toLowerCase() === 'r'){ replay(); }
  });

  /* ---- inspect mode, live at the last step ---- */
  const tip = document.getElementById('tip');
  const tipT = tip.querySelector('b'), tipD = tip.querySelector('span');
  const holes = [...document.querySelectorAll('#holes use')];
  let raf = null;
  function trackHole(u){
    cancelAnimationFrame(raf);
    const g = document.getElementById(u.dataset.spin);
    const c = u.dataset.c.split(' ');
    (function step(){
      const t = g && getComputedStyle(g).transform;
      let a = 0;
      if (t && t !== 'none'){
        const m = t.match(/-?[\d.e+-]+/g);
        if (m && m.length >= 4) a = Math.atan2(+m[1], +m[0]) * 180 / Math.PI;
      }
      u.setAttribute('transform', 'rotate(' + a.toFixed(2) + ' ' + c[0] + ' ' + c[1] + ')');
      raf = requestAnimationFrame(step);
    })();
  }
  function showHole(id){
    let tracking = false;
    holes.forEach(u => {
      const on = u.id === id;
      u.classList.toggle('on', on);
      // a gear-shaped hole follows the gear frame by frame: mask content is not
      // repainted on its own, so the angle is written in from the live element
      if (on && u.dataset.spin){ trackHole(u); tracking = true; }
    });
    if (!tracking){ cancelAnimationFrame(raf); raf = null; }
  }
  let lit = null;
  function clearTip(){
    if (!lit) return;
    lit = null; showHole(null);
    stageEl.classList.remove('dim');
    tip.classList.remove('show');
  }
  function place(e){
    const r = stageEl.getBoundingClientRect();
    let x = e.clientX - r.left + 16, y = e.clientY - r.top + 16;
    x = Math.min(x, r.width - 410); y = Math.min(y, r.height - 150);
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top  = Math.max(8, y) + 'px';
  }
  // one handler for the whole canvas: off a section is off, even in the black
  svg.addEventListener('pointermove', e => {
    if (stage < LAST) return;
    const hit = e.target.classList && e.target.classList.contains('hit') ? e.target : null;
    if (!hit){ clearTip(); return; }
    const ref = hit.getAttribute('href') || hit.getAttribute('xlink:href');
    if (lit !== ref){
      lit = ref;
      showHole('hole' + ref.replace('#sec',''));
      stageEl.classList.add('dim');
      tipT.textContent = hit.dataset.t;
      tipD.textContent = hit.dataset.d;
      tip.classList.add('show');
    }
    place(e);
  });
  svg.addEventListener('pointerleave', clearTip);

  hardReset();
  setTimeout(run, 420);

  /* ---- language ---- */
  let L = I18N.en;
  function fitWipe(key){
    const t = svg.querySelector('[data-i18n="' + key + '"][data-wipe]');
    const r = document.getElementById('wr' + t.dataset.wipe.slice(1));
    const b = t.getBBox();
    /* The aperture is a fixed window in user units, widened on the side the label
       travels toward so the bounce is not clipped. The label starts offset by the
       whole aperture, which puts it out of sight behind the chevron. */
    const fromRight = r.classList.contains('r'), lead = 22, over = 11;
    const x = b.x - 4 - (fromRight ? lead : 0), y = b.y - 4;
    const w = b.width + 8 + lead, h = b.height + 8;
    r.setAttribute('x', x.toFixed(1));
    r.setAttribute('y', y.toFixed(1));
    r.setAttribute('width', w.toFixed(1));
    r.setAttribute('height', h.toFixed(1));
    t.style.setProperty('--enter', (fromRight ? w : -w).toFixed(1) + 'px');
    t.style.setProperty('--over',  (fromRight ? -over : over).toFixed(1) + 'px');
  }
  function fitSweep(rectId, arcId, left){
    const tp = svg.querySelector('[data-arc="' + arcId + '"]');
    const a = (tp.getComputedTextLength() / 2 / 137) * 180 / Math.PI;
    const r = document.getElementById(rectId);
    r.style.setProperty('--from', (left ? -(180 + a) : -a).toFixed(1) + 'deg');
    r.style.setProperty('--to',   (left ? -(180 - a) : +a).toFixed(1) + 'deg');
  }
  function afterLang(d){
    L = d; NAMES = d.st;
    document.getElementById('play').textContent = d.btn_replay;
    ['ctx','pri','mon','ver'].forEach(fitWipe);
    fitSweep('sIdf', 'arcL', true);
    fitSweep('sMit', 'arcR', false);
    clearTip();
    render();
  }

  /* ---- language dropdown ---- */
  const langBox = document.getElementById('lang');
  const langCur = langBox.querySelector('.lang-current');
  langCur.addEventListener('click', e => {
    e.stopPropagation();
    const open = langBox.classList.toggle('open');
    langCur.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  function closeLang(){ langBox.classList.remove('open'); langCur.setAttribute('aria-expanded','false'); }
  document.addEventListener('click', closeLang);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLang(); });

  /* Compose twice: once now so the lettering is never blank, and again once the
     webfont has actually arrived. Every width here is measured, so measuring against
     a fallback face would fix the wrong layout in place — which is why the first
     paint looked unconditioned until a language was switched. */
  const draw = () => applyLang(document.documentElement.dataset.lang || pickLang(), I18N, afterLang);
  document.querySelectorAll('.lang-list button').forEach(b =>
    b.addEventListener('click', e => {
      e.stopPropagation();
      document.documentElement.dataset.lang = b.dataset.lang;
      closeLang(); draw();
    }));
  draw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
