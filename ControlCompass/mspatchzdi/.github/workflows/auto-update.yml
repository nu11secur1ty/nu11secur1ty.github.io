name: MS Patch & ZDI Auto Update

on:
  schedule:
    - cron: '0 8 * * 2,3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Update Script
        run: |
          # Тук пускаш скрипта, който обновява index.html в съответната папка
          python update_data.py

      - name: Commit and Push Changes directly
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update patch data [skip ci]" && git push)
