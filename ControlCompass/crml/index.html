<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Cyber Risk Management Lifecycle (CRML)</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans JP', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage {
    width: 100%;
    max-width: 1600px;
    padding: 24px;
  }
  .stage svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .credit {
    position: fixed;
    bottom: 18px;
    left: 22px;
    font-size: 12px;
    line-height: 1.5;
    color: #666;
    user-select: none;
  }
  .credit .label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 2px;
  }
  .credit a {
    color: #888;
    text-decoration: none;
    font-size: 11px;
    transition: color 0.15s;
  }
  .credit a:hover {
    color: #C4322B;
  }
  .info-label { cursor: pointer; }
  .tooltip {
    position: fixed;
    max-width: 480px;
    min-width: 320px;
    padding: 26px 30px;
    background: rgba(12, 12, 12, 0.97);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    color: #e6e6e6;
    font-size: 14px;
    line-height: 1.6;
    /* Default is none: at cursor+22px the panel usually covers the next label the
       user is heading for, and pointer-events:auto made it eat that label's hover.
       Re-enabled via .interactive only when the cursor is on the panel with no
       label beneath it, or when the panel is pinned. */
    pointer-events: none;
    z-index: 1000;
    opacity: 0;
    transform: scale(0.82) translateY(10px);
    transform-origin: top left;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.92), 0 0 0 1px rgba(255, 255, 255, 0.02);
  }
  .tooltip strong {
    display: block;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--tip-accent, #F19A38);
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .tooltip .meta {
    display: block;
    font-size: 10.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: #888;
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .tooltip .body {
    display: block;
    font-size: 14px;
    line-height: 1.65;
    color: #e6e6e6;
  }
  .tooltip .quote {
    display: block;
    margin-top: 18px;
    padding: 4px 0 4px 16px;
    border-left: 2px solid var(--tip-accent, #F19A38);
    font-style: italic;
    color: #c2c2c2;
    font-size: 13px;
    line-height: 1.6;
  }
  .tooltip.visible {
    animation: tipIn 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .tooltip.interactive { pointer-events: auto; }
  .tooltip.pinned { border-color: rgba(255, 255, 255, 0.14); }
  @keyframes tipIn {
    0%   { opacity: 0; transform: scale(0.82) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .page-title {
    position: fixed;
    top: 30px;
    left: 36px;
    z-index: 10;
    user-select: none;
    max-width: 480px;
  }
  .page-title .eyebrow {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    color: #888;
    margin-bottom: 18px;
  }
  .page-title .main {
    font-size: clamp(24px, 2.8vw, 36px);
    font-weight: 400;
    color: #FFFFFF;
    line-height: 1.12;
    letter-spacing: -0.005em;
    margin-bottom: 16px;
  }
  .page-title .main em {
    font-style: normal;
    color: #C4322B;
    font-weight: 500;
  }
  .page-title .acronym-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .page-title .acronym {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.34em;
    color: #C4322B;
    padding: 5px 12px 4px 14px;
    border: 1px solid rgba(196, 50, 43, 0.4);
    border-radius: 3px;
  }
  /* Sibling badge that links out to the CyberRiskOps framework */
  .page-title .acronym-link {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.34em;
    color: #C4322B;
    text-decoration: none;
    padding: 5px 12px 4px 14px;
    border: 1px solid rgba(196, 50, 43, 0.4);
    border-radius: 3px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .page-title .acronym-link:hover,
  .page-title .acronym-link:focus-visible {
    border-color: rgba(196, 50, 43, 0.85);
    background: rgba(196, 50, 43, 0.12);
    outline: none;
  }
  button.replay {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    color: #888;
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 8px 18px;
    font: inherit;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: color 0.15s ease, border-color 0.15s ease;
    user-select: none;
    z-index: 10;
  }
  button.replay:hover {
    color: #C4322B;
    border-color: rgba(196, 50, 43, 0.5);
  }
  .tooltip a {
    color: var(--tip-accent, #F19A38);
    text-decoration: underline;
    text-decoration-color: rgba(255, 255, 255, 0.22);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition: text-decoration-color 0.15s ease, color 0.15s ease;
  }
  .tooltip a:hover {
    text-decoration-color: var(--tip-accent, #F19A38);
  }
  .tooltip .quote a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: rgba(255, 255, 255, 0.18);
    text-decoration-style: dotted;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition: text-decoration-color 0.15s ease, text-decoration-style 0.15s ease;
  }
  .tooltip .quote a:hover {
    text-decoration-color: var(--tip-accent, #F19A38);
    text-decoration-style: solid;
  }
  #cr-modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; }
  #cr-modal.open { display: flex; }
  #cr-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.93); opacity: 0; transition: opacity 220ms ease; }
  #cr-modal.open #cr-backdrop { opacity: 1; }
  #cr-frame-wrap { position: relative; width: min(94vw, calc(94vh * 16 / 9)); aspect-ratio: 16 / 9; transform: scale(0.96); opacity: 0; transition: opacity 240ms ease 60ms, transform 240ms ease 60ms; }
  #cr-modal.open #cr-frame-wrap { opacity: 1; transform: scale(1); }
  #cr-iframe { width: 100%; height: 100%; border: 0; background: transparent; display: block; }
  #cr-close { position: absolute; top: 14px; right: 14px; z-index: 1001; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(0, 0, 0, 0.55); color: #f5f5f7; font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background 160ms ease, border-color 160ms ease; padding: 0; font-family: inherit; }
  #cr-close:hover { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.30); }
  @keyframes venn-pulse {
    0%, 100% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.15);
      opacity: 0.55;
    }
  }
  #venn-pulse-group {
    transform-origin: 1140px 450px;
    transform-box: view-box;
    animation: venn-pulse 1.8s ease-in-out 20s infinite;
  }
  #venn-pulse-group circle,
  #venn-pulse-group path {
    transform-origin: 1140px 450px;
  }
  @keyframes venn-stroke-pulse {
    0%, 100% { stroke-width: 1.6; }
    50% { stroke-width: 3.2; }
  }
  #venn-pulse-group circle {
    animation: venn-stroke-pulse 1.8s ease-in-out 30s infinite;
  }
  .publication {
    position: fixed;
    bottom: 22px;
    right: 28px;
    z-index: 10;
    user-select: none;
    text-align: right;
    line-height: 1.4;
  }
  .publication .pub-title {
    font-size: 11px;
    font-weight: 500;
    color: #888;
    text-decoration: none;
    display: block;
    margin-bottom: 5px;
    white-space: nowrap;
    transition: color 0.15s ease;
  }
  .publication .pub-title:hover {
    color: #C4322B;
  }
  .publication .pub-doi {
    font-size: 9.5px;
    font-weight: 500;
    color: #666;
    letter-spacing: 0.02em;
  }
  .publication .pub-doi a {
    color: inherit;
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .publication .pub-doi a:hover {
    color: #C4322B;
  }
  .page-title, .credit, .publication, button.replay {
    transition: opacity 220ms ease;
  }
  body.cr-modal-open .page-title,
  body.cr-modal-open .credit,
  body.cr-modal-open .publication,
  body.cr-modal-open button.replay {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  /* ===== Language selector (dropdown) ===== */
  .lang-selector {
    position: fixed;
    top: 22px;
    right: 28px;
    z-index: 20;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    user-select: none;
    transition: opacity 220ms ease;
  }
  .lang-trigger {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 4px;
    color: #C4322B;
    padding: 5px 9px 5px 11px;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .lang-trigger:hover {
    border-color: rgba(196, 50, 43, 0.55);
  }
  .lang-trigger .lang-caret {
    width: 7px;
    height: 7px;
    flex: none;
    opacity: 0.65;
    transition: transform 0.18s ease;
  }
  .lang-selector.open .lang-trigger .lang-caret {
    transform: rotate(180deg);
  }
  .lang-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 132px;
    padding: 4px;
    background: rgba(10, 10, 10, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 5px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: none;
    flex-direction: column;
    gap: 1px;
  }
  .lang-selector.open .lang-menu { display: flex; }
  .lang-menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: none;
    border: none;
    border-radius: 3px;
    color: #888;
    padding: 7px 10px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
    transition: color 0.13s ease, background 0.13s ease;
  }
  .lang-menu button:hover {
    color: #FFFFFF;
    background: rgba(255, 255, 255, 0.06);
  }
  .lang-menu button.active { color: #C4322B; }
  .lang-menu .lang-code {
    flex: none;
    width: 20px;
    opacity: 0.75;
  }
  .lang-menu .lang-name {
    letter-spacing: 0.04em;
    text-transform: none;
    font-weight: 500;
  }
  body.cr-modal-open .lang-selector {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* CTA tooltip — pill that appears above the cursor on the Identify satellite, centered horizontally */
  .cta-tooltip {
    position: fixed;
    z-index: 100;
    padding: 7px 14px;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1.5px solid #C4322B;
    border-radius: 999px;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.015em;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    /* Anchor point: bottom-center of the pill sits at (left, top). 14px gap above cursor. */
    transform: translate(-50%, -100%) translateY(-14px) scale(0.95);
    transform-origin: center bottom;
    transition: opacity 200ms ease, transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  }
  .cta-tooltip.visible {
    opacity: 1;
    transform: translate(-50%, -100%) translateY(-14px) scale(1);
  }
  /* Flip-below variant: bottom-center anchor → top-center anchor when there's no room above */
  .cta-tooltip.flipped {
    transform: translate(-50%, 0) translateY(20px) scale(0.95);
    transform-origin: center top;
  }
  .cta-tooltip.flipped.visible {
    transform: translate(-50%, 0) translateY(20px) scale(1);
  }
  body.cr-modal-open .cta-tooltip {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* ===== Cybersecurity Compass modal (mirrors the Cyber Risk modal pattern) ===== */
  #cc-modal { position: fixed; inset: 0; z-index: 999; display: none; align-items: center; justify-content: center; }
  #cc-modal.open { display: flex; }
  #cc-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.93); opacity: 0; transition: opacity 220ms ease; }
  #cc-modal.open #cc-backdrop { opacity: 1; }
  #cc-frame-wrap { position: relative; width: min(94vw, 94vh); aspect-ratio: 1/1; transform: scale(0.96); opacity: 0; transition: opacity 240ms ease 60ms, transform 240ms ease 60ms; }
  #cc-modal.open #cc-frame-wrap { opacity: 1; transform: scale(1); }
  #cc-iframe { width: 100%; height: 100%; border: 0; background: transparent; display: block; }
  #cc-close { position: absolute; top: 14px; right: 14px; z-index: 1001; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.13); background: rgba(0,0,0,0.55); color: #f5f5f7; font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background 160ms ease, border-color 160ms ease; }
  #cc-close:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.30); }

  /* Clickable "Cybersecurity Compass" inside the eyebrow */
  .compass-link {
    cursor: pointer;
    transition: color 0.15s ease;
    color: inherit;
    border-bottom: 1px dotted rgba(255, 255, 255, 0.25);
  }
  .compass-link:hover { color: #C4322B; border-bottom-color: #C4322B; }

  /* Hide host chrome when the Compass modal is open (same pattern as cr-modal-open) */
  body.cc-modal-open .page-title,
  body.cc-modal-open .credit,
  body.cc-modal-open .publication,
  body.cc-modal-open button.replay,
  body.cc-modal-open .lang-selector {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }

  /* Hover indicator on the lower-right compass click target — soft transparent circle that fades in */
  #lr-compass-hit { transition: fill 0.2s ease; fill: transparent; }
  /* Hover fill only applies once the compass has appeared (class added via JS gate). */
  #lr-compass-hit.compass-ready:hover { fill: rgba(255,255,255,0.10); }
</style>
</head>
<body>
  <div class="lang-selector" id="lang-selector">
    <button type="button" class="lang-trigger" id="lang-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Language selector">
      <span id="lang-trigger-label">EN</span>
      <svg class="lang-caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="lang-menu" id="lang-menu" role="listbox" aria-label="Language">
      <button type="button" role="option" data-lang="en" class="active"><span class="lang-code">EN</span><span class="lang-name">English</span></button>
      <button type="button" role="option" data-lang="es"><span class="lang-code">ES</span><span class="lang-name">Español</span></button>
      <button type="button" role="option" data-lang="pt"><span class="lang-code">PT</span><span class="lang-name">Português</span></button>
      <button type="button" role="option" data-lang="ja"><span class="lang-code">JA</span><span class="lang-name">日本語</span></button>
    </div>
  </div>
  <div id="cta-tip" class="cta-tooltip" role="status" aria-hidden="true" aria-live="polite">
    <span data-i18n="cta.venn">Click for the Cyber Risk Visual Definition →</span>
  </div>


  <div class="page-title">
    <div class="eyebrow" data-i18n-html="page.eyebrow"><span id="compass-trigger" class="compass-link" role="button" tabindex="0" onclick="openCompass()">Cybersecurity Compass</span> · Before a Breach</div>
    <div class="main" data-i18n-html="page.main">The Cyber Risk Management <em>Lifecycle</em></div>
    <div class="acronym-row">
      <div class="acronym">CRML</div>
      <a class="acronym-link" href="https://cybersecuritycompass.github.io/cyberriskops" target="_blank" rel="noopener" title="CyberRiskOps">Cyber Risk Ops</a>
    </div>
  </div>
  <div class="stage">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" preserveAspectRatio="xMidYMid meet" font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', Meiryo, 'Noto Sans JP', sans-serif">
  <!-- Black background -->
  <rect width="1600" height="900" fill="#000000"/>

  <defs>
    <!-- Arrow marker (white, filled chevron) -->
    <marker id="arrowhead" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,1.5 L10,6 L0,10.5 L2.5,6 Z" fill="#FFFFFF"/>
    </marker>

    <!-- Radial gradient for the central puzzle ring -->
    <radialGradient id="puzzleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6A6964"/>
      <stop offset="60%" stop-color="#A6A39A"/>
      <stop offset="100%" stop-color="#CDC9BF"/>
    </radialGradient>

    <!-- Curved text paths along outer dashed circle - labels at r=275, spans 70 deg -->
    <path id="p-monitoring"  d="M 649.18 402.26 A 275 275 0 0 1 872.26 179.18" fill="none"/>
    <path id="p-asset"       d="M 967.74 179.18 A 275 275 0 0 1 1190.82 402.26" fill="none"/>
    <path id="p-consolidate" d="M 1190.82 497.74 A 275 275 0 0 1 967.74 720.82" fill="none"/>
    <path id="p-apply"       d="M 872.26 720.82 A 275 275 0 0 1 649.18 497.74" fill="none"/>

    <!-- Inner wheel labels (People, Process, Technology) - centered on piece centers at radius 120 (moved 20 inward) -->
    <path id="p-people"     d="M 842.87 358.07 A 120 120 0 0 1 997.13 358.07" fill="none"/>
    <path id="p-process"    d="M 1038.18 429.17 A 120 120 0 0 1 961.04 562.76" fill="none"/>
    <path id="p-technology" d="M 878.96 562.76 A 120 120 0 0 1 801.82 429.17" fill="none"/>
  </defs>

  <!-- Outer dashed circle - r=255 -->
  <circle cx="920" cy="450" r="255" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="11 8" opacity="0"><animate attributeName="opacity" from="0" to="0.75" begin="2s" dur="0.5s" fill="freeze"/></circle>

  <!-- Animated travelers along the dashed line.
       Circle 1 (amber): Inventory -> Identify, loops every 3s starting at t=0.
       Circle 2 (oxblood): Identify -> Prioritization, loops every 3s starting at t=3s.
       Result: when Circle 1 finishes its first trip, Circle 2 begins AND Circle 1 restarts.
       Placed AFTER the dashed circle so they cover the dash line, but BEFORE the satellites. -->
  <circle r="13" fill="#F19A38" opacity="0">
    <animateMotion dur="2s" begin="12s" repeatCount="indefinite"
                   path="M 920 195 A 255 255 0 0 1 1175 450"/>
    <animate attributeName="opacity"
             values="0;1;1;1;0"
             keyTimes="0;0.08;0.5;0.92;1"
             dur="2s" begin="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="13" fill="#A8201D" opacity="0">
    <animateMotion dur="2s" begin="14s" repeatCount="indefinite"
                   path="M 1175 450 A 255 255 0 0 1 920 705"/>
    <animate attributeName="opacity"
             values="0;1;1;1;0"
             keyTimes="0;0.08;0.5;0.92;1"
             dur="2s" begin="14s" repeatCount="indefinite"/>
  </circle>
  <circle r="13" fill="#FF6A2C" opacity="0">
    <animateMotion dur="2s" begin="16s" repeatCount="indefinite"
                   path="M 920 705 A 255 255 0 0 1 665 450"/>
    <animate attributeName="opacity"
             values="0;1;1;1;0"
             keyTimes="0;0.08;0.5;0.92;1"
             dur="2s" begin="16s" repeatCount="indefinite"/>
  </circle>

  <!-- Circle 6: Mitigation -> Inventory traveler along the dashed line.
       Quarter-arc through the upper-left of the dashed circle, closing the lifecycle loop. -->
  <circle r="13" fill="#E62E22" opacity="0">
    <animateMotion dur="2s" begin="22s" repeatCount="indefinite"
                   path="M 665 450 A 255 255 0 0 1 920 195"/>
    <animate attributeName="opacity"
             values="0;1;1;1;0"

  <!-- Curved labels along outer dashed circle -->
  <text font-size="20" font-weight="400" fill="#B9B6AC" letter-spacing="0.5" opacity="0" data-tip-key="tip.monitoring" data-tip="&lt;strong&gt;Cyber Risk Monitoring&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;CONTINUOUS · SOC + CROC · REAL TIME&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;Continuous oversight that runs around all five stages and never stops. Cyber risk monitoring is not a project, it is a posture: new assets appear, new vulnerabilities surface, the threat landscape shifts, and a recalculation that was right last week is wrong today. Monitoring is what tells the loop when to turn again. Executed by a dedicated &lt;a href=&quot;https://www.researchgate.net/publication/388194441&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cyber Risk Operations Center (CROC)&lt;/a&gt; alongside the SOC.&lt;/span&gt;" data-color="#F19A38" class="info-label">
    <textPath href="#p-monitoring" startOffset="50%" text-anchor="middle" data-i18n="arc.monitoring">Cyber Risk Monitoring</textPath>
    <animate attributeName="opacity" from="0" to="1" begin="10s" dur="0.5s" fill="freeze"/>
  </text>
  <path d="M 649.18 402.26 A 275 275 0 0 1 872.26 179.18" fill="none" stroke="transparent" stroke-width="40" pointer-events="stroke" class="info-label" data-tip-key="tip.monitoring" data-tip="&lt;strong&gt;Cyber Risk Monitoring&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;CONTINUOUS · SOC + CROC · REAL TIME&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;Continuous oversight that runs around all five stages and never stops. Cyber risk monitoring is not a project, it is a posture: new assets appear, new vulnerabilities surface, the threat landscape shifts, and a recalculation that was right last week is wrong today. Monitoring is what tells the loop when to turn again. Executed by a dedicated &lt;a href=&quot;https://www.researchgate.net/publication/388194441&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cyber Risk Operations Center (CROC)&lt;/a&gt; alongside the SOC.&lt;/span&gt;" data-color="#F19A38" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="10s" dur="0.5s" fill="freeze"/></path>
  <text font-size="20" font-weight="400" fill="#B9B6AC" letter-spacing="0.5" opacity="0" data-tip-key="tip.asset" data-tip="&lt;strong&gt;For Each Digital Asset&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;PER ASSET · DYNAMIC · SHARED · CONTINUOUS&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;The CRML is applied to every digital asset individually, the point where threat, vulnerability, and consequence converge into cyber risk. Every device, identity, application, and connection implies a cyber risk that must be calculated, and in the age of AI, &lt;a href=&quot;https://www.researchgate.net/publication/406634241&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;agents now create their own connections&lt;/a&gt; through APIs and Model Context Protocol that are each a new exposure of their own. Cyber risk is dynamic, shared, and continuous: it evolves in real time, requires collaboration across all stakeholders, and demands ongoing reassessment rather than point-in-time snapshots.&lt;/span&gt;" data-color="#F19A38" class="info-label">
    <textPath href="#p-asset" startOffset="50%" text-anchor="middle" data-i18n="arc.asset">For Each Digital Asset</textPath>
    <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.5s" fill="freeze"/>
  </text>
  <path d="M 967.74 179.18 A 275 275 0 0 1 1190.82 402.26" fill="none" stroke="transparent" stroke-width="40" pointer-events="stroke" class="info-label" data-tip-key="tip.asset" data-tip="&lt;strong&gt;For Each Digital Asset&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;PER ASSET · DYNAMIC · SHARED · CONTINUOUS&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;The CRML is applied to every digital asset individually, the point where threat, vulnerability, and consequence converge into cyber risk. Every device, identity, application, and connection implies a cyber risk that must be calculated, and in the age of AI, &lt;a href=&quot;https://www.researchgate.net/publication/406634241&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;agents now create their own connections&lt;/a&gt; through APIs and Model Context Protocol that are each a new exposure of their own. Cyber risk is dynamic, shared, and continuous: it evolves in real time, requires collaboration across all stakeholders, and demands ongoing reassessment rather than point-in-time snapshots.&lt;/span&gt;" data-color="#F19A38" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.5s" fill="freeze"/></path>
  <text font-size="20" font-weight="400" fill="#B9B6AC" letter-spacing="0.5" opacity="0" data-tip-key="tip.consolidate" data-tip="&lt;strong&gt;Consolidate Cyber Risk&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;AGGREGATE · ORGANIZATIONAL VIEW · STRATEGIC&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;All per-asset cyber risk scores from the previous stage are normalized and aggregated. Consolidation can run at the organization level for a unified view, or at sub-levels by tagged asset groups (business units, geographies, application portfolios, or any operational dimension) for targeted visibility. This moves the conversation from isolated technical findings to a holistic, business-aligned picture that executives and board members can act on.&lt;/span&gt;" data-color="#F19A38" class="info-label">
    <textPath href="#p-consolidate" startOffset="50%" text-anchor="middle" data-i18n="arc.consolidate">Consolidate Cyber Risk</textPath>
    <animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.5s" fill="freeze"/>
  </text>
  <path d="M 1190.82 497.74 A 275 275 0 0 1 967.74 720.82" fill="none" stroke="transparent" stroke-width="40" pointer-events="stroke" class="info-label" data-tip-key="tip.consolidate" data-tip="&lt;strong&gt;Consolidate Cyber Risk&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;AGGREGATE · ORGANIZATIONAL VIEW · STRATEGIC&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;All per-asset cyber risk scores from the previous stage are normalized and aggregated. Consolidation can run at the organization level for a unified view, or at sub-levels by tagged asset groups (business units, geographies, application portfolios, or any operational dimension) for targeted visibility. This moves the conversation from isolated technical findings to a holistic, business-aligned picture that executives and board members can act on.&lt;/span&gt;" data-color="#F19A38" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6s" dur="0.5s" fill="freeze"/></path>
  <text font-size="20" font-weight="400" fill="#B9B6AC" letter-spacing="0.5" opacity="0" data-tip-key="tip.apply" data-tip="&lt;strong&gt;Apply Defenses &amp; Controls&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;DEPLOY · TECHNICAL + ADMINISTRATIVE · PRIORITIZED&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;Based on the prioritized cyber risk profile from the previous stage, deploy the appropriate defenses, technical solutions such as firewalls and encryption, plus administrative controls such as access policies and training. Controls are chosen to address the highest-priority cyber risks, not as a one-size-fits-all checklist.&lt;/span&gt;" data-color="#F19A38" class="info-label">
    <textPath href="#p-apply" startOffset="50%" text-anchor="middle" data-i18n="arc.apply">Apply Defenses and Controls</textPath>
    <animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.5s" fill="freeze"/>
  </text>
  <path d="M 872.26 720.82 A 275 275 0 0 1 649.18 497.74" fill="none" stroke="transparent" stroke-width="40" pointer-events="stroke" class="info-label" data-tip-key="tip.apply" data-tip="&lt;strong&gt;Apply Defenses &amp; Controls&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;DEPLOY · TECHNICAL + ADMINISTRATIVE · PRIORITIZED&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;Based on the prioritized cyber risk profile from the previous stage, deploy the appropriate defenses, technical solutions such as firewalls and encryption, plus administrative controls such as access policies and training. Controls are chosen to address the highest-priority cyber risks, not as a one-size-fits-all checklist.&lt;/span&gt;" data-color="#F19A38" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="8s" dur="0.5s" fill="freeze"/></path>

  <!-- Central puzzle ring: THREE interlocking pieces of 120deg each. ROTATING.
       Pieces centered at 0 (People), 120 (Process), 240 (Technology).
       Seams at 60, 180, 300 deg. Each piece has TAB on its CCW edge, NOTCH on its CW edge.
       Bulb: R=16, perpendicular offset h=12, attachment chord=20, peak perpendicular extent 28 (~62% pinch). -->
  <g id="crml-rotor">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 920 450" to="360 920 450"
                      dur="30s" repeatCount="indefinite"/>
    <!-- People (top, centered 0 deg): tab on 300 seam (into Technology), notch on 60 seam (Process's tab into People) -->
    <path fill="#6D6E71" class="info-label" data-tip-key="tip.people" data-tip="&lt;strong&gt;People&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;FOUNDATIONAL PILLAR · CULTURE · CYBER RISK HUNTERS&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;One of the three foundational pillars of cybersecurity. Encompasses the human element, security awareness, training, and organizational culture, alongside dedicated &lt;a href=&quot;https://www.researchgate.net/publication/395721548&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cyber Risk Hunters&lt;/a&gt; who ask where the organization could be compromised, complementing the threat hunters who ask whether it already is.&lt;/span&gt;" data-color="#F19A38" d="M 768.45 362.50 A 175 175 0 0 1 1071.55 362.50 L 1041.24 380.00 A 16 16 0 1 1 1023.92 390.00 L 993.61 407.50 A 85 85 0 0 0 846.39 407.50 L 816.08 390.00 A 16 16 0 1 0 798.76 380.00 L 768.45 362.50 Z"/>
    <!-- Process (lower-right, centered 120 deg): tab on 60 seam (into People), notch on 180 seam (Technology's tab into Process) -->
    <path fill="#808285" class="info-label" data-tip-key="tip.process" data-tip="&lt;strong&gt;Process&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;FOUNDATIONAL PILLAR · CYBERRISKOPS · CROC + CROM&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;One of the three foundational pillars. The policies, procedures, and methodologies, including the CRML itself, that structure how cybersecurity is practiced. Modern programs operationalize this through &lt;a href=&quot;https://www.researchgate.net/publication/402149983&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CyberRiskOps&lt;/a&gt;: continuous, adaptive processes that fuse cyber risk assessment and &lt;a href=&quot;https://www.researchgate.net/publication/388564202&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cyber risk reduction&lt;/a&gt; into a single loop, eliminating the traditional gap between identifying cyber risks and actually reducing them. CyberRiskOps is executed by a dedicated &lt;a href=&quot;https://www.researchgate.net/publication/388194441&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cyber Risk Operations Center (CROC)&lt;/a&gt; that works before a breach, continuously hunting exposure and driving reduction, while the SOC handles what is already happening. The &lt;a href=&quot;https://www.researchgate.net/publication/390490235&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cyber Risk Operational Model (CROM)&lt;/a&gt; provides the maturity path that moves the program from static risk mapping toward proactive operations.&lt;/span&gt;" data-color="#F19A38" d="M 1071.55 362.50 A 175 175 0 0 1 920 625 L 920 590 A 16 16 0 1 1 920 570 L 920 535 A 85 85 0 0 0 993.61 407.50 L 1023.92 390.00 A 16 16 0 1 0 1041.24 380.00 L 1071.55 362.50 Z"/>
    <!-- Technology (lower-left, centered 240 deg): tab on 180 seam (into Process), notch on 300 seam (People's tab into Technology) -->
    <path fill="#939598" class="info-label" data-tip-key="tip.technology" data-tip="&lt;strong&gt;Technology&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;FOUNDATIONAL PILLAR · CREM + CRQ + AEV&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;One of the three foundational pillars. The platforms that operationalize cyber risk management at scale. Cyber Risk Exposure Management (CREM) unifies asset inventory, AI-powered asset contextualization, the &lt;a href=&quot;https://www.researchgate.net/publication/388321083&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cyber Risk Asset Graph&lt;/a&gt; that maps relationships across the attack surface, &lt;a href=&quot;https://www.researchgate.net/publication/388421250&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Risk-Based Vulnerability Management (RBVM)&lt;/a&gt;, and exposure assessment. &lt;a href=&quot;https://www.researchgate.net/publication/396206049&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cyber Risk Quantification (CRQ)&lt;/a&gt; expresses cyber risk in financial terms executives can act on, turning likelihood and impact into a probable loss and a range, not a color. Adversarial Exposure Validation (AEV) tests defenses against real attack techniques to verify whether controls actually work. Together these capabilities make cyber risk measurable, prioritized, and continuously reducible.&lt;/span&gt;" data-color="#F19A38" d="M 920 625 A 175 175 0 0 1 768.45 362.50 L 798.76 380.00 A 16 16 0 1 1 816.08 390.00 L 846.39 407.50 A 85 85 0 0 0 920 535 L 920 570 A 16 16 0 1 0 920 590 L 920 625 Z"/>
  </g>

  <!-- Inner black hub - STATIC, drawn on top of rotating pieces' inner notches -->
  <circle cx="920" cy="450" r="85" fill="#000000" class="info-label" data-tip-key="tip.crml" data-tip="&lt;strong&gt;Cyber Risk Management Lifecycle (CRML)&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;BEFORE A BREACH · STRATEGIC FRAMEWORK · CONTINUOUS LOOP&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;A continuous, before-a-breach loop that runs for every digital asset, the operating engine of the &lt;a href=&quot;https://www.researchgate.net/publication/389628862&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cybersecurity Compass&lt;/a&gt; and complementary to outcome-oriented frameworks and regulations such as NIST CSF 2.0, DORA, NIS2, and ISO 27001. Where these frameworks name the destinations, CRML supplies the route and the cadence: identify, assess, mitigate, and verify reduction. In the age of AI, where &lt;a href=&quot;https://www.researchgate.net/publication/398971490&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;attackers move at machine speed&lt;/a&gt;, the loop must run at machine speed too, while staying under human governance. These three forces, threat, vulnerability, and consequence, converge into cyber risk, which the CRML applies per digital asset, before a breach.&lt;/span&gt;&lt;span class=&quot;quote&quot;&gt;“&lt;a href=&quot;https://www.researchgate.net/publication/388653064&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;What is not defined cannot be measured. What is not measured, cannot be improved. What is not improved, is always degraded.&lt;/a&gt;”&lt;/span&gt;" data-color="#F19A38"/>

  <g pointer-events="none">

  <!-- Mini Venn diagram inside Identify satellite: Threats × Vulnerabilities × Consequences -->

  <!-- Satellite labels -->
  <!-- Top: Inventory, Contextualize and Value Digital Assets -->
  <text x="920" y="110" text-anchor="middle" font-size="22" font-weight="500" fill="#F19A38" opacity="0" data-tip-key="tip.inventory" data-tip="&lt;strong&gt;Inventory, Contextualize &amp; Value Digital Assets&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;STAGE 1 · ASSETS + CONTEXT · CRITICALITY&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;The lifecycle begins here. Identify all digital assets, devices, applications, data, and especially identities (frequently targeted by cybercriminals), and contextualize each within its &lt;a href=&quot;https://www.researchgate.net/publication/388321083&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;business role and dependencies&lt;/a&gt;. Context is what makes valuation meaningful: the same server may be peripheral in one organization and mission-critical in another. The result is the asset criticality that drives every later prioritization decision; without it, prioritization becomes guesswork.&lt;/span&gt;" data-color="#F19A38" class="info-label">
    <tspan x="920" dy="0" data-i18n="sat.inventory.l1">Inventory, Contextualize and</tspan>
    <tspan x="920" dy="28" data-i18n="sat.inventory.l2">Value Digital Assets</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.5s" fill="freeze"/>
  </text>
  <rect x="755" y="85" width="330" height="70" fill="transparent" pointer-events="all" class="info-label" data-tip-key="tip.inventory" data-tip="&lt;strong&gt;Inventory, Contextualize &amp; Value Digital Assets&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;STAGE 1 · ASSETS + CONTEXT · CRITICALITY&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;The lifecycle begins here. Identify all digital assets, devices, applications, data, and especially identities (frequently targeted by cybercriminals), and contextualize each within its &lt;a href=&quot;https://www.researchgate.net/publication/388321083&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;business role and dependencies&lt;/a&gt;. Context is what makes valuation meaningful: the same server may be peripheral in one organization and mission-critical in another. The result is the asset criticality that drives every later prioritization decision; without it, prioritization becomes guesswork.&lt;/span&gt;" data-color="#F19A38" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.5s" fill="freeze"/></rect>

  <!-- Right: Identify Vulnerabilities, Threats and Consequences -->
  <text x="1215" y="420" text-anchor="start" font-size="22" font-weight="500" fill="#D62A22" opacity="0" data-tip-key="tip.identify" data-tip="&lt;strong&gt;Identify Vulnerabilities, Threats &amp; Consequences&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;STAGE 2 · TRIAD ANALYSIS · DIAGNOSIS&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;For each asset, analyze &lt;a href=&quot;https://www.researchgate.net/publication/388386953&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;three intersecting elements&lt;/a&gt; to calculate its cyber risk score. Vulnerabilities: weaknesses such as unpatched software, misconfigurations, or social engineering exposure. Threats: actors or events that could exploit them, from external attackers to insider threats. Consequences: operational, reputational, legal, and financial impacts, weighted by the asset criticality established in the previous stage. Where the three converge, that is the cyber risk, computed per asset. This is the diagnostic moment of the lifecycle: without explicit triad analysis, mitigation aims at the wrong targets, and what looks like risk reduction is just activity.&lt;/span&gt;" data-color="#D62A22" class="info-label">
    <tspan x="1215" dy="0" data-i18n="sat.identify.l1">Identify Vulnerabilities,</tspan>
    <tspan x="1215" dy="28" data-i18n="sat.identify.l2">Threats and</tspan>
    <tspan x="1215" dy="28" data-i18n="sat.identify.l3">Consequences</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="5s" dur="0.5s" fill="freeze"/>
  </text>
  <rect x="1210" y="395" width="290" height="95" fill="transparent" pointer-events="all" class="info-label" data-tip-key="tip.identify" data-tip="&lt;strong&gt;Identify Vulnerabilities, Threats &amp; Consequences&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;STAGE 2 · TRIAD ANALYSIS · DIAGNOSIS&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;For each asset, analyze &lt;a href=&quot;https://www.researchgate.net/publication/388386953&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;three intersecting elements&lt;/a&gt; to calculate its cyber risk score. Vulnerabilities: weaknesses such as unpatched software, misconfigurations, or social engineering exposure. Threats: actors or events that could exploit them, from external attackers to insider threats. Consequences: operational, reputational, legal, and financial impacts, weighted by the asset criticality established in the previous stage. Where the three converge, that is the cyber risk, computed per asset. This is the diagnostic moment of the lifecycle: without explicit triad analysis, mitigation aims at the wrong targets, and what looks like risk reduction is just activity.&lt;/span&gt;" data-color="#D62A22" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5s" dur="0.5s" fill="freeze"/></rect>

  <!-- Bottom: Cyber Risk Assessment, Calculation and Prioritization -->
  <text x="920" y="770" text-anchor="middle" font-size="22" font-weight="500" fill="#FF6A2C" opacity="0" data-tip-key="tip.assessment" data-tip="&lt;strong&gt;Cyber Risk Assessment, Calculation &amp; Prioritization&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;STAGE 3 · CRI · NIST + MITRE ATT&amp;CK&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;Cyber risk is quantified as a &lt;a href=&quot;https://www.researchgate.net/publication/389001302&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cyber Risk Index (CRI)&lt;/a&gt;, a numerical value calculated using industry standards such as NIST and MITRE ATT&amp;CK, informed by expert judgment where the data runs out. The point of the number is not the number itself; it is the ranking. A clear cyber risk profile sends scarce resources to the most significant exposures first, instead of spreading them evenly across cyber risks that were never equal.&lt;/span&gt;" data-color="#FF6A2C" class="info-label">
    <tspan x="920" dy="0" data-i18n="sat.assessment.l1">Cyber Risk Assessment,</tspan>
    <tspan x="920" dy="28" data-i18n="sat.assessment.l2">Calculation and Prioritization</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="7s" dur="0.5s" fill="freeze"/>
  </text>
  <rect x="750" y="745" width="340" height="70" fill="transparent" pointer-events="all" class="info-label" data-tip-key="tip.assessment" data-tip="&lt;strong&gt;Cyber Risk Assessment, Calculation &amp; Prioritization&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;STAGE 3 · CRI · NIST + MITRE ATT&amp;CK&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;Cyber risk is quantified as a &lt;a href=&quot;https://www.researchgate.net/publication/389001302&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cyber Risk Index (CRI)&lt;/a&gt;, a numerical value calculated using industry standards such as NIST and MITRE ATT&amp;CK, informed by expert judgment where the data runs out. The point of the number is not the number itself; it is the ranking. A clear cyber risk profile sends scarce resources to the most significant exposures first, instead of spreading them evenly across cyber risks that were never equal.&lt;/span&gt;" data-color="#FF6A2C" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="7s" dur="0.5s" fill="freeze"/></rect>

  <!-- Left: Cyber Risk Mitigation -->
  <text x="570" y="442" text-anchor="middle" font-size="22" font-weight="500" fill="#E62E22" opacity="0" data-tip-key="tip.mitigation" data-tip="&lt;strong&gt;Cyber Risk Mitigation&lt;/strong&gt;&lt;span class=&quot;meta&quot;&gt;STAGE 4 · CONTROLS · ACTION&lt;/span&gt;&lt;span class=&quot;body&quot;&gt;Deploys actions and controls, technical (firewalls, encryption, segmentation) and administrative (access policies, training, incident response), to reduce the probability or impact of threats. Critically, mitigation is not the same as &lt;a href=&quot;https://www.researchgate.net/publication/388564202&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;cyber risk reduction&lt;/a&gt;; reduction is the measurable decrease in exposure once those mitigations actually take effect.&lt;/span&gt;" data-color="#E62E22" class="info-label">

    <tspan x="570" dy="28" data-i18n="sat.mitigation.l2">Mitigation</tspan>

  <div class="tooltip" id="tip" role="tooltip" aria-hidden="true"></div>
  <script>
    (function() {
      const tip = document.getElementById('tip');
      let activeEl = null;      // label whose content is currently in the panel
      let pinnedEl = null;      // label pinned by click/tap; hover is ignored while set
      let hideTimer = null;
      let lastX = 0, lastY = 0, rafPending = false, hasPointer = false;

      function cancelHide() {
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      }
      function scheduleHide(delay) {
        cancelHide();
        hideTimer = setTimeout(hide, delay);
      }
      function place(x, y) {
        tip.style.left = (x + 22) + 'px';
        tip.style.top = (y + 22) + 'px';
        const r = tip.getBoundingClientRect();
        if (r.right > window.innerWidth - 16) {
          tip.style.left = Math.max(16, x - r.width - 22) + 'px';
        }
        if (r.bottom > window.innerHeight - 16) {
          tip.style.top = Math.max(16, y - r.height - 22) + 'px';
        }
      }
      function show(el, x, y) {
        const op = parseFloat(getComputedStyle(el).opacity);
        if (!isNaN(op) && op < 0.5) return;   // label has not faded in yet
        cancelHide();
        tip.classList.remove('visible');
        void tip.offsetWidth;                 // restart the entry animation
        tip.innerHTML = el.dataset.tip;
        tip.style.setProperty('--tip-accent', el.dataset.color || '#F19A38');
        tip.setAttribute('aria-hidden', 'false');
        place(x, y);
        requestAnimationFrame(() => place(x, y));   // re-flip once content has laid out
        activeEl = el;
        tip.classList.add('visible');
      }
      function hide() {
        tip.classList.remove('visible', 'interactive', 'pinned');
        tip.setAttribute('aria-hidden', 'true');
        activeEl = null;
        pinnedEl = null;
        hideTimer = null;
      }

      // Topmost .info-label under the cursor. elementsFromPoint returns the whole
      // stack, so the panel lying on top of a label no longer hides it from us.
      function triggerAt(x, y) {
        if (!document.elementsFromPoint) return null;
        const stack = document.elementsFromPoint(x, y) || [];
        for (let i = 0; i < stack.length; i++) {
          const n = stack[i];
          if (n === tip || tip.contains(n)) continue;   // skip the panel itself
          const t = n.closest ? n.closest('.info-label') : null;
          if (t) return t;
        }
        return null;
      }
      function pointerOverTip() {
        if (!tip.classList.contains('visible')) return false;
        const r = tip.getBoundingClientRect();
        return lastX >= r.left && lastX <= r.right && lastY >= r.top && lastY <= r.bottom;
      }

      function evaluate() {
        rafPending = false;
        if (pinnedEl) return;                 // pinned panels ignore hover entirely
        const trg = triggerAt(lastX, lastY);
        if (trg) {
          tip.classList.remove('interactive');
          if (trg !== activeEl) show(trg, lastX, lastY);
          else place(lastX, lastY);
          return;
        }
        if (pointerOverTip()) {
          // On the panel with nothing behind it: allow clicks so links work.
          tip.classList.add('interactive');
          cancelHide();
          return;
        }
        tip.classList.remove('interactive');
        // Guard on hideTimer, otherwise continuous movement over empty space keeps
        // pushing the deadline back and the panel never closes.
        if (activeEl && !hideTimer) scheduleHide(260);
      }

      document.addEventListener('mousemove', (e) => {
        hasPointer = true;
        lastX = e.clientX; lastY = e.clientY;
        if (!rafPending) { rafPending = true; requestAnimationFrame(evaluate); }
      }, { passive: true });

      // The pillar ring rotates, so the label under a resting cursor changes with
      // no mousemove to trigger a re-check. Poll only while the cursor is actually
      // on that group, so there is no idle frame loop.
      const rotor = document.getElementById('crml-rotor');
      (function trackRotor() {
        requestAnimationFrame(trackRotor);
        if (!hasPointer || pinnedEl || !rotor) return;
        const onRotor = activeEl ? rotor.contains(activeEl) : false;
        if (onRotor && !rafPending) { rafPending = true; evaluate(); }
      })();

      // Cursor left the window entirely
      document.addEventListener('mouseleave', () => { if (!pinnedEl) scheduleHide(120); });

      // Scrolling or resizing invalidates the cached hit position
      window.addEventListener('resize', () => { if (!pinnedEl) hide(); });

      // Click / tap a label to pin it, so its links stay reachable even where the
      // panel overlaps another label. Also the only path on touch, which has no hover.
      document.querySelectorAll('.info-label').forEach(el => {
        el.addEventListener('click', (e) => {
          if (pinnedEl === el) { hide(); e.stopPropagation(); return; }
          pinnedEl = null;
          show(el, e.clientX || lastX, e.clientY || lastY);
          if (activeEl === el) {                 // show() may bail if not yet faded in
            pinnedEl = el;
            tip.classList.add('interactive', 'pinned');
          }
          e.stopPropagation();
        });
      });

      document.addEventListener('click', (e) => {
        if (activeEl && !tip.contains(e.target)) hide();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && activeEl) hide();
      });
    })();

        title: 'Cyber Risk',
        color: '#FF5552',
        body:  'Represents the potential for losses or damages that may occur due to a <span style="color:#F19A38">threat</span> exploiting a <span style="color:#E63A37">vulnerability</span> and resulting in a <span style="color:#FF6A2C">consequence</span>. The overarching concept that encompasses all aspects of the potential negative outcomes of cyber events. Cyber risk is <strong style="color:#A5B4FC">dynamic</strong>, <strong style="color:#38BDF8">shared</strong>, <strong style="color:#3B82F6">continuous</strong>, and <strong style="color:#6366F1">adversarial</strong>: it evolves in real time, propagates across vendors, partners, customers, and the digital supply chain, never stops expanding, and unlike other risks, faces an intelligent opponent that learns and adapts to every defense.'
      }
    };

    // Labels whose own position is in the bottom half of the diagram. Hovering any of these flips the info panel up to the top edge so the panel stays clear of the cursor.
    const BOTTOM_LABELS = new Set(['vulnerabilityLabel', 'consequenceLabel', 'exposureLabel']);

    let activeLabelId = null;
    let infoHideTimer = null;

    function cancelInfoHide() {
      if (infoHideTimer) { clearTimeout(infoHideTimer); infoHideTimer = null; }
    }
    function queueInfoHide() {
      cancelInfoHide();
      infoHideTimer = setTimeout(() => { hideInfo(); infoHideTimer = null; }, 120);
    }

    function hideInfo() {
      const panel = document.getElementById('infoPanel');
      if (panel) {
        panel.classList.remove('visible');
        panel.setAttribute('aria-hidden', 'true');
      }
      activeLabelId = null;
    }

    function showInfo(labelId) {
      const info = LABEL_INFO[labelId];
      const panel = document.getElementById('infoPanel');
      const titleEl = document.getElementById('infoTitle');
      const bodyEl  = document.getElementById('infoBody');
      if (!info || !panel || !titleEl || !bodyEl) return;
      titleEl.textContent = info.title;
      titleEl.style.color = info.color;
      bodyEl.innerHTML  = info.body;
      panel.style.borderColor = info.color;
      panel.classList.toggle('top', BOTTOM_LABELS.has(labelId));
      panel.classList.add('visible');
      panel.setAttribute('aria-hidden', 'false');
      activeLabelId = labelId;
    }

    // Tap anywhere outside a label or the panel closes it (mobile)
    document.addEventListener('click', (e) => {
      if (e.target.closest('.info-panel')) return;
      if (e.target.closest('.hot-label')) return;
      hideInfo();
    });

    // ---------------- Hover / Pulse ----------------
    // Length of the intro timeline, in ms. Matches the last SMIL animation end (pairwise labels fade-in: begin 7.4s + dur 1.2s = 8.6s). 100ms cushion so the activation can never beat the final frame.
    const INTRO_MS = 8700;

    // Hover: light up each circle/lens (or pulse the centre) while the cursor is on its label. Hover/click is only armed once the intro animation finishes; pressing Replay re-arms it.
    const restartHovers = (function setupHovers() {
      const entries = [
        { labelId: 'threatLabel',        targetId: 'threatCircle',        kind: 'fill'  },
        { labelId: 'vulnerabilityLabel', targetId: 'vulnerabilityCircle', kind: 'fill'  },
        { labelId: 'consequenceLabel',   targetId: 'consequenceCircle',   kind: 'fill'  },
        { labelId: 'potentialLabel',     targetId: 'potentialLens',       kind: 'fill'  },
        { labelId: 'theoreticalLabel',   targetId: 'theoreticalLens',     kind: 'fill'  },
        { labelId: 'exposureLabel',      targetId: 'exposureLens',        kind: 'fill'  },
        { labelId: 'cyberRiskLabel',     targetId: 'cyberRiskPulse',      kind: 'pulse' }
      ];

      const wired = entries
        .map(e => ({
          label:   document.getElementById(e.labelId),
          labelId: e.labelId,
          target:  document.getElementById(e.targetId),
          kind:    e.kind
        }))
        .filter(p => p.label && p.target);

      const showOf = ({ target, kind }) => kind === 'pulse'
        ? () => target.classList.add('pulsing')
        : () => target.setAttribute('fill-opacity', '0.4');

      const hideOf = ({ target, kind }) => kind === 'pulse'
        ? () => target.classList.remove('pulsing')
        : () => target.setAttribute('fill-opacity', '0');

      wired.forEach((p) => {
        const show = showOf(p);
        const hide = hideOf(p);

        // Hover shows the wash/pulse AND populates the info panel.
        p.label.addEventListener('mouseenter', () => {
          show();
          cancelInfoHide();
          showInfo(p.labelId);
        });
        p.label.addEventListener('mouseleave', () => {
          hide();
          queueInfoHide();
        });

        // Mobile: tap behaves like hover. The synthetic click fires too, but the document click handler ignores label targets, so nothing bad happens.
        p.label.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (p.label.classList.contains('active')) {
            show();
            cancelInfoHide();
            showInfo(p.labelId);
          }
        }, { passive: false });
      });

      // Touch devices: tapping anywhere outside a label clears hover effects (tooltip itself handles its own dismissal via close-on-outside-click).
      document.addEventListener('touchstart', (e) => {
        const onLabel = wired.some(({ label }) => label.contains(e.target));
        if (!onLabel) wired.forEach(p => hideOf(p)());
      });

      const setArmed = (armed) => {
        wired.forEach(({ label }) => label.classList.toggle('active', armed));
        if (!armed) wired.forEach(p => hideOf(p)());
      };

      let armTimer = setTimeout(() => setArmed(true), INTRO_MS);

      return function rearmAfterReplay() {
        setArmed(false);
        clearTimeout(armTimer);
        armTimer = setTimeout(() => setArmed(true), INTRO_MS);
      };
    })();

    function replayAnimation() {
      const svg = document.getElementById('cyberRiskSvg');
      if (svg && typeof svg.setCurrentTime === 'function') {
        svg.setCurrentTime(0);
        restartHovers();
        hideInfo();
      }
    }
  <\/script>


</body></html>`;

        // -- Tooltip HTML strings --
        'tip.crml': `<strong>Cyber Risk Management Lifecycle (CRML)</strong><span class="meta">BEFORE A BREACH · STRATEGIC FRAMEWORK · CONTINUOUS LOOP</span><span class="body">A continuous, before-a-breach loop that runs for every digital asset, the operating engine of the <a href="https://www.researchgate.net/publication/389628862" target="_blank" rel="noopener">Cybersecurity Compass</a> and complementary to outcome-oriented frameworks and regulations such as NIST CSF 2.0, DORA, NIS2, and ISO 27001. Where these frameworks name the destinations, CRML supplies the route and the cadence: identify, assess, mitigate, and verify reduction. In the age of AI, where <a href="https://www.researchgate.net/publication/398971490" target="_blank" rel="noopener">attackers move at machine speed</a>, the loop must run at machine speed too, while staying under human governance. These three forces, threat, vulnerability, and consequence, converge into cyber risk, which the CRML applies per digital asset, before a breach.</span><span class="quote">"<a href="https://www.researchgate.net/publication/388653064" target="_blank" rel="noopener">What is not defined cannot be measured. What is not measured, cannot be improved. What is not improved, is always degraded.</a>"</span>`,
        'tip.people': `<strong>People</strong><span class="meta">FOUNDATIONAL PILLAR · CULTURE · CYBER RISK HUNTERS</span><span class="body">One of the three foundational pillars of cybersecurity. Encompasses the human element, security awareness, training, and organizational culture, alongside dedicated <a href="https://www.researchgate.net/publication/395721548" target="_blank" rel="noopener">Cyber Risk Hunters</a> who ask where the organization could be compromised, complementing the threat hunters who ask whether it already is.</span>`,
        'tip.process': `<strong>Process</strong><span class="meta">FOUNDATIONAL PILLAR · CYBERRISKOPS · CROC + CROM</span><span class="body">One of the three foundational pillars. The policies, procedures, and methodologies, including the CRML itself, that structure how cybersecurity is practiced. Modern programs operationalize this through <a href="https://www.researchgate.net/publication/402149983" target="_blank" rel="noopener">CyberRiskOps</a>: continuous, adaptive processes that fuse cyber risk assessment and <a href="https://www.researchgate.net/publication/388564202" target="_blank" rel="noopener">cyber risk reduction</a> into a single loop, eliminating the traditional gap between identifying cyber risks and actually reducing them. CyberRiskOps is executed by a dedicated <a href="https://www.researchgate.net/publication/388194441" target="_blank" rel="noopener">Cyber Risk Operations Center (CROC)</a> that works before a breach, continuously hunting exposure and driving reduction, while the SOC handles what is already happening. The <a href="https://www.researchgate.net/publication/390490235" target="_blank" rel="noopener">Cyber Risk Operational Model (CROM)</a> provides the maturity path that moves the program from static risk mapping toward proactive operations.</span>`,
        'tip.technology': `<strong>Technology</strong><span class="meta">FOUNDATIONAL PILLAR · CREM + CRQ + AEV</span><span class="body">One of the three foundational pillars. The platforms that operationalize cyber risk management at scale. Cyber Risk Exposure Management (CREM) unifies asset inventory, AI-powered asset contextualization, the <a href="https://www.researchgate.net/publication/388321083" target="_blank" rel="noopener">Cyber Risk Asset Graph</a> that maps relationships across the attack surface, <a href="https://www.researchgate.net/publication/388421250" target="_blank" rel="noopener">Risk-Based Vulnerability Management (RBVM)</a>, and exposure assessment. <a href="https://www.researchgate.net/publication/396206049" target="_blank" rel="noopener">Cyber Risk Quantification (CRQ)</a> expresses cyber risk in financial terms executives can act on, turning likelihood and impact into a probable loss and a range, not a color. Adversarial Exposure Validation (AEV) tests defenses against real attack techniques to verify whether controls actually work. Together these capabilities make cyber risk measurable, prioritized, and continuously reducible.</span>`,
        'tip.inventory': `<strong>Inventory, Contextualize & Value Digital Assets</strong><span class="meta">STAGE 1 · ASSETS + CONTEXT · CRITICALITY</span><span class="body">The lifecycle begins here. Identify all digital assets, devices, applications, data, and especially identities (frequently targeted by cybercriminals), and contextualize each within its <a href="https://www.researchgate.net/publication/388321083" target="_blank" rel="noopener">business role and dependencies</a>. Context is what makes valuation meaningful: the same server may be peripheral in one organization and mission-critical in another. The result is the asset criticality that drives every later prioritization decision; without it, prioritization becomes guesswork.</span>`,
        'tip.identify': `<strong>Identify Vulnerabilities, Threats & Consequences</strong><span class="meta">STAGE 2 · TRIAD ANALYSIS · DIAGNOSIS</span><span class="body">For each asset, analyze <a href="https://www.researchgate.net/publication/388386953" target="_blank" rel="noopener">three intersecting elements</a> to calculate its cyber risk score. Vulnerabilities: weaknesses such as unpatched software, misconfigurations, or social engineering exposure. Threats: actors or events that could exploit them, from external attackers to insider threats. Consequences: operational, reputational, legal, and financial impacts, weighted by the asset criticality established in the previous stage. Where the three converge, that is the cyber risk, computed per asset. This is the diagnostic moment of the lifecycle: without explicit triad analysis, mitigation aims at the wrong targets, and what looks like risk reduction is just activity.</span>`,
        'tip.assessment': `<strong>Cyber Risk Assessment, Calculation & Prioritization</strong><span class="meta">STAGE 3 · CRI · NIST + MITRE ATT&amp;CK</span><span class="body">Cyber risk is quantified as a <a href="https://www.researchgate.net/publication/389001302" target="_blank" rel="noopener">Cyber Risk Index (CRI)</a>, a numerical value calculated using industry standards such as NIST and MITRE ATT&amp;CK, informed by expert judgment where the data runs out. The point of the number is not the number itself; it is the ranking. A clear cyber risk profile sends scarce resources to the most significant exposures first, instead of spreading them evenly across cyber risks that were never equal.</span>`,
        'tip.mitigation': `<strong>Cyber Risk Mitigation</strong><span class="meta">STAGE 4 · CONTROLS · ACTION</span><span class="body">Deploys actions and controls, technical (firewalls, encryption, segmentation) and administrative (access policies, training, incident response), to reduce the probability or impact of threats. Critically, mitigation is not the same as <a href="https://www.researchgate.net/publication/388564202" target="_blank" rel="noopener">cyber risk reduction</a>; reduction is the measurable decrease in exposure once those mitigations actually take effect.</span>`,
        'tip.recalc': `<strong>Cyber Risk Assessment &amp; Recalculation</strong><span class="meta">STAGE 5 · VERIFICATION · ORG + ASSET LEVELS</span><span class="body">The stage most programs skip. After controls are applied, the <a href="https://www.researchgate.net/publication/389001302" target="_blank" rel="noopener">Cyber Risk Index (CRI)</a> is recalculated at the organization level and at the asset level to verify whether each control actually reduced cyber risk, or only looked like it did. The ticket closing was activity; the number falling is the reduction. This is also what keeps the organization aligned with the speed of business and the <a href="https://www.researchgate.net/publication/398971490" target="_blank" rel="noopener">speed of the attacker</a>, not the speed of the last audit.</span>`,
        'tip.asset': `<strong>For Each Digital Asset</strong><span class="meta">PER ASSET · DYNAMIC · SHARED · CONTINUOUS</span><span class="body">The CRML is applied to every digital asset individually, the point where threat, vulnerability, and consequence converge into cyber risk. Every device, identity, application, and connection implies a cyber risk that must be calculated, and in the age of AI, <a href="https://www.researchgate.net/publication/406634241" target="_blank" rel="noopener">agents now create their own connections</a> through APIs and Model Context Protocol that are each a new exposure of their own. Cyber risk is dynamic, shared, and continuous: it evolves in real time, requires collaboration across all stakeholders, and demands ongoing reassessment rather than point-in-time snapshots.</span>`,
        'tip.consolidate': `<strong>Consolidate Cyber Risk</strong><span class="meta">AGGREGATE · ORGANIZATIONAL VIEW · STRATEGIC</span><span class="body">All per-asset cyber risk scores from the previous stage are normalized and aggregated. Consolidation can run at the organization level for a unified view, or at sub-levels by tagged asset groups (business units, geographies, application portfolios, or any operational dimension) for targeted visibility. This moves the conversation from isolated technical findings to a holistic, business-aligned picture that executives and board members can act on.</span>`,
        'tip.apply': `<strong>Apply Defenses &amp; Controls</strong><span class="meta">DEPLOY · TECHNICAL + ADMINISTRATIVE · PRIORITIZED</span><span class="body">Based on the prioritized cyber risk profile from the previous stage, deploy the appropriate defenses, technical solutions such as firewalls and encryption, plus administrative controls such as access policies and training. Controls are chosen to address the highest-priority cyber risks, not as a one-size-fits-all checklist.</span>`,
        'tip.monitoring': `<strong>Cyber Risk Monitoring</strong><span class="meta">CONTINUOUS · SOC + CROC · REAL TIME</span><span class="body">Continuous oversight that runs around all five stages and never stops. Cyber risk monitoring is not a project, it is a posture: new assets appear, new vulnerabilities surface, the threat landscape shifts, and a recalculation that was right last week is wrong today. Monitoring is what tells the loop when to turn again. Executed by a dedicated <a href="https://www.researchgate.net/publication/388194441" target="_blank" rel="noopener">Cyber Risk Operations Center (CROC)</a> alongside the SOC.</span>`,
      },

        'cta.compass': 'Clic para Explorar el Cybersecurity Compass →',
        // -- Tooltip HTML strings --
        'tip.crml': `<strong>Gestión del Ciclo de Vida del Ciber Riesgo (CRML)</strong><span class="meta">ANTES DE UNA BRECHA · MARCO ESTRATÉGICO · CICLO CONTINUO</span><span class="body">Un ciclo continuo, antes de una brecha, que se ejecuta para cada activo digital, el motor operativo del <a href="https://www.researchgate.net/publication/389628862" target="_blank" rel="noopener">Cybersecurity Compass</a> y complementario a marcos orientados a resultados y regulaciones como NIST CSF 2.0, DORA, NIS2, e ISO 27001. Donde estos marcos nombran los destinos, el CRML aporta la ruta y la cadencia: identificar, evaluar, mitigar y verificar la reducción. En la era de la IA, donde <a href="https://www.researchgate.net/publication/398971490" target="_blank" rel="noopener">los atacantes se mueven a velocidad de máquina</a>, el ciclo debe ejecutarse también a velocidad de máquina, manteniéndose bajo gobernanza humana. Estas tres fuerzas, amenaza, vulnerabilidad y consecuencia, convergen en el ciber riesgo, que el CRML aplica por activo digital, antes de una brecha.</span><span class="quote">"<a href="https://www.researchgate.net/publication/388653064" target="_blank" rel="noopener">Lo que no se define no se puede medir. Lo que no se mide, no se puede mejorar. Lo que no se mejora, siempre se degrada.</a>"</span>`,
        'tip.people': `<strong>Personas</strong><span class="meta">PILAR FUNDAMENTAL · CULTURA · CYBER RISK HUNTERS</span><span class="body">Uno de los tres pilares fundamentales de la ciberseguridad. Abarca el elemento humano, la concienciación en seguridad, la formación y la cultura organizacional, junto con <a href="https://www.researchgate.net/publication/395721548" target="_blank" rel="noopener">Cyber Risk Hunters</a> dedicados que se preguntan dónde la organización podría verse comprometida, complementando a los threat hunters que se preguntan si ya lo está.</span>`,
        'tip.process': `<strong>Proceso</strong><span class="meta">PILAR FUNDAMENTAL · CYBERRISKOPS · CROC + CROM</span><span class="body">Uno de los tres pilares fundamentales. Las políticas, procedimientos y metodologías, incluido el propio CRML, que estructuran cómo se practica la ciberseguridad. Los programas modernos operacionalizan esto a través de <a href="https://www.researchgate.net/publication/402149983" target="_blank" rel="noopener">CyberRiskOps</a>: procesos continuos y adaptativos que fusionan la evaluación del ciber riesgo y la <a href="https://www.researchgate.net/publication/388564202" target="_blank" rel="noopener">reducción del ciber riesgo</a> en un solo ciclo, eliminando la brecha tradicional entre identificar ciber riesgos y reducirlos efectivamente. CyberRiskOps es ejecutado por un <a href="https://www.researchgate.net/publication/388194441" target="_blank" rel="noopener">Cyber Risk Operations Center (CROC)</a> dedicado que trabaja antes de una brecha, cazando continuamente la exposición e impulsando la reducción, mientras el SOC se encarga de lo que ya está ocurriendo. El <a href="https://www.researchgate.net/publication/390490235" target="_blank" rel="noopener">Cyber Risk Operational Model (CROM)</a> proporciona la ruta de madurez que mueve el programa desde un mapeo estático del riesgo hacia operaciones proactivas.</span>`,
        'tip.technology': `<strong>Tecnología</strong><span class="meta">PILAR FUNDAMENTAL · CREM + CRQ + AEV</span><span class="body">Uno de los tres pilares fundamentales. Las plataformas que operacionalizan la gestión del ciber riesgo a escala. Cyber Risk Exposure Management (CREM) unifica el inventario de activos, la contextualización de activos potenciada por IA, el <a href="https://www.researchgate.net/publication/388321083" target="_blank" rel="noopener">Cyber Risk Asset Graph</a> que mapea las relaciones a través de la superficie de ataque, la <a href="https://www.researchgate.net/publication/388421250" target="_blank" rel="noopener">Gestión de Vulnerabilidades Basada en Ciber Riesgo (RBVM)</a>, y la evaluación de exposición. La <a href="https://www.researchgate.net/publication/396206049" target="_blank" rel="noopener">Cuantificación del Ciber Riesgo (CRQ)</a> expresa el ciber riesgo en términos financieros sobre los que los ejecutivos pueden actuar, convirtiendo la probabilidad y el impacto en una pérdida probable y un rango, no en un color. Adversarial Exposure Validation (AEV) prueba las defensas contra técnicas de ataque reales para verificar si los controles realmente funcionan. Juntas, estas capacidades hacen que el ciber riesgo sea medible, priorizable y reducible de forma continua.</span>`,
        'tip.inventory': `<strong>Inventariar, Contextualizar y Valorar Activos Digitales</strong><span class="meta">ETAPA 1 · ACTIVOS + CONTEXTO · CRITICIDAD</span><span class="body">El ciclo comienza aquí. Identifica todos los activos digitales, dispositivos, aplicaciones, datos, y especialmente identidades (frecuentemente atacadas por los cibercriminales), y contextualiza cada uno dentro de su <a href="https://www.researchgate.net/publication/388321083" target="_blank" rel="noopener">rol de negocio y dependencias</a>. El contexto es lo que hace que la valoración sea significativa: el mismo servidor puede ser periférico en una organización y crítico para la misión en otra. El resultado es la criticidad del activo que impulsa cada decisión posterior de priorización; sin ella, la priorización se convierte en conjeturas.</span>`,
        'tip.identify': `<strong>Identificar Vulnerabilidades, Amenazas y Consecuencias</strong><span class="meta">ETAPA 2 · ANÁLISIS DE TRÍADA · DIAGNÓSTICO</span><span class="body">Para cada activo, analiza <a href="https://www.researchgate.net/publication/388386953" target="_blank" rel="noopener">tres elementos que se intersectan</a> para calcular su puntuación de ciber riesgo. Vulnerabilidades: debilidades como software sin parchear, malas configuraciones, o exposición a ingeniería social. Amenazas: actores o eventos que podrían explotarlas, desde atacantes externos hasta amenazas internas. Consecuencias: impactos operativos, reputacionales, legales y financieros, ponderados por la criticidad del activo establecida en la etapa anterior. Donde los tres convergen, eso es el ciber riesgo, calculado por activo. Este es el momento diagnóstico del ciclo: sin un análisis explícito de la tríada, la mitigación apunta a los objetivos equivocados, y lo que parece reducción de riesgo es solo actividad.</span>`,
        'tip.assessment': `<strong>Evaluación, Cálculo y Priorización del Ciber Riesgo</strong><span class="meta">ETAPA 3 · CRI · NIST + MITRE ATT&amp;CK</span><span class="body">El ciber riesgo se cuantifica como un <a href="https://www.researchgate.net/publication/389001302" target="_blank" rel="noopener">Índice de Ciber Riesgo (CRI)</a>, un valor numérico calculado usando estándares de la industria como NIST y MITRE ATT&amp;CK, informado por el juicio experto donde los datos se agotan. El propósito del número no es el número en sí; es el ranking. Un perfil claro de ciber riesgo envía los recursos escasos primero a las exposiciones más significativas, en lugar de distribuirlos uniformemente entre ciber riesgos que nunca fueron iguales.</span>`,
        'tip.mitigation': `<strong>Mitigación del Ciber Riesgo</strong><span class="meta">ETAPA 4 · CONTROLES · ACCIÓN</span><span class="body">Despliega acciones y controles, técnicos (firewalls, cifrado, segmentación) y administrativos (políticas de acceso, formación, respuesta a incidentes), para reducir la probabilidad o el impacto de las amenazas. Críticamente, la mitigación no es lo mismo que la <a href="https://www.researchgate.net/publication/388564202" target="_blank" rel="noopener">reducción del ciber riesgo</a>; la reducción es la disminución medible de la exposición una vez que esas mitigaciones realmente surten efecto.</span>`,
        'tip.recalc': `<strong>Evaluación y Recálculo del Ciber Riesgo</strong><span class="meta">ETAPA 5 · VERIFICACIÓN · NIVELES ORG + ACTIVO</span><span class="body">La etapa que la mayoría de los programas omite. Después de aplicar los controles, el <a href="https://www.researchgate.net/publication/389001302" target="_blank" rel="noopener">Índice de Ciber Riesgo (CRI)</a> se recalcula a nivel de organización y a nivel de activo para verificar si cada control realmente redujo el ciber riesgo, o solo aparentó hacerlo. El cierre del ticket fue actividad; la caída del número es la reducción. Esto también es lo que mantiene a la organización alineada con la velocidad del negocio y la <a href="https://www.researchgate.net/publication/398971490" target="_blank" rel="noopener">velocidad del atacante</a>, no con la velocidad de la última auditoría.</span>`,
        'tip.asset': `<strong>Para Cada Activo Digital</strong><span class="meta">POR ACTIVO · DINÁMICO · COMPARTIDO · CONTINUO</span><span class="body">El CRML se aplica a cada activo digital individualmente, el punto donde amenaza, vulnerabilidad y consecuencia convergen en el ciber riesgo. Cada dispositivo, identidad, aplicación y conexión implica un ciber riesgo que debe calcularse, y en la era de la IA, <a href="https://www.researchgate.net/publication/406634241" target="_blank" rel="noopener">los agentes ahora crean sus propias conexiones</a> a través de APIs y Model Context Protocol que son, cada una, una nueva exposición por sí mismas. El ciber riesgo es dinámico, compartido y continuo: evoluciona en tiempo real, requiere colaboración entre todos los actores, y exige una reevaluación continua en lugar de instantáneas puntuales.</span>`,
        'tip.consolidate': `<strong>Consolidar Ciber Riesgo</strong><span class="meta">AGREGADO · VISTA ORGANIZACIONAL · ESTRATÉGICO</span><span class="body">Todas las puntuaciones de ciber riesgo por activo de la etapa anterior se normalizan y agregan. La consolidación puede ejecutarse a nivel de organización para una vista unificada, o a sub-niveles por grupos de activos etiquetados (unidades de negocio, geografías, portfolios de aplicaciones, o cualquier dimensión operativa) para visibilidad dirigida. Esto traslada la conversación desde hallazgos técnicos aislados hacia una imagen holística, alineada al negocio, sobre la que los ejecutivos y miembros del consejo pueden actuar.</span>`,
        'tip.apply': `<strong>Aplicar Defensas y Controles</strong><span class="meta">DESPLEGAR · TÉCNICO + ADMINISTRATIVO · PRIORIZADO</span><span class="body">Basándose en el perfil de ciber riesgo priorizado de la etapa anterior, despliega las defensas apropiadas, soluciones técnicas como firewalls y cifrado, más controles administrativos como políticas de acceso y formación. Los controles se eligen para abordar los ciber riesgos de mayor prioridad, no como una lista de verificación universal.</span>`,
        'tip.monitoring': `<strong>Monitoreo del Ciber Riesgo</strong><span class="meta">CONTINUO · SOC + CROC · TIEMPO REAL</span><span class="body">Supervisión continua que rodea las cinco etapas y nunca se detiene. El monitoreo del ciber riesgo no es un proyecto, es una postura: aparecen nuevos activos, surgen nuevas vulnerabilidades, el panorama de amenazas cambia, y un recálculo que era correcto la semana pasada es incorrecto hoy. El monitoreo es lo que le dice al ciclo cuándo girar de nuevo. Ejecutado por un <a href="https://www.researchgate.net/publication/388194441" target="_blank" rel="noopener">Cyber Risk Operations Center (CROC)</a> dedicado, junto con el SOC.</span>`,
      },
