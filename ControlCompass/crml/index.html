        // -- Tooltip HTML strings --
        'tip.crml': `<strong>Gestão do Ciclo de Vida do Ciber Risco (CRML)</strong><span class="meta">ANTES DE UMA BRECHA · MARCO ESTRATÉGICO · CICLO CONTÍNUO</span><span class="body">Um ciclo contínuo, antes de uma brecha, que se executa para cada ativo digital, o motor operacional do <a href="https://www.researchgate.net/publication/389628862" target="_blank" rel="noopener">Cybersecurity Compass</a> e complementar a marcos orientados a resultados e regulamentações como NIST CSF 2.0, DORA, NIS2, e ISO 27001. Onde estes marcos nomeiam os destinos, o CRML fornece a rota e a cadência: identificar, avaliar, mitigar e verificar a redução. Na era da IA, onde <a href="https://www.researchgate.net/publication/398971490" target="_blank" rel="noopener">os atacantes se movem em velocidade de máquina</a>, o ciclo deve executar-se também em velocidade de máquina, mantendo-se sob governança humana. Essas três forças, ameaça, vulnerabilidade e consequência, convergem no ciber risco, que o CRML aplica por ativo digital, antes de uma brecha.</span><span class="quote">"<a href="https://www.researchgate.net/publication/388653064" target="_blank" rel="noopener">O que não se define não se pode medir. O que não se mede, não se pode melhorar. O que não se melhora, sempre se degrada.</a>"</span>`,
        'tip.people': `<strong>Pessoas</strong><span class="meta">PILAR FUNDAMENTAL · CULTURA · CYBER RISK HUNTERS</span><span class="body">Um dos três pilares fundamentais da cibersegurança. Abrange o elemento humano, a conscientização em segurança, o treinamento e a cultura organizacional, junto com <a href="https://www.researchgate.net/publication/395721548" target="_blank" rel="noopener">Cyber Risk Hunters</a> dedicados que perguntam onde a organização poderia ser comprometida, complementando os threat hunters que perguntam se já está.</span>`,
        'tip.process': `<strong>Processo</strong><span class="meta">PILAR FUNDAMENTAL · CYBERRISKOPS · CROC + CROM</span><span class="body">Um dos três pilares fundamentais. As políticas, procedimentos e metodologias, incluindo o próprio CRML, que estruturam como a cibersegurança é praticada. Os programas modernos operacionalizam isso por meio do <a href="https://www.researchgate.net/publication/402149983" target="_blank" rel="noopener">CyberRiskOps</a>: processos contínuos e adaptativos que fundem a avaliação do ciber risco e a <a href="https://www.researchgate.net/publication/388564202" target="_blank" rel="noopener">redução do ciber risco</a> em um único ciclo, eliminando a lacuna tradicional entre identificar ciber riscos e reduzi-los efetivamente. CyberRiskOps é executado por um <a href="https://www.researchgate.net/publication/388194441" target="_blank" rel="noopener">Cyber Risk Operations Center (CROC)</a> dedicado que trabalha antes de uma brecha, caçando continuamente a exposição e impulsionando a redução, enquanto o SOC trata do que já está acontecendo. O <a href="https://www.researchgate.net/publication/390490235" target="_blank" rel="noopener">Cyber Risk Operational Model (CROM)</a> fornece o caminho de maturidade que move o programa de um mapeamento estático do risco para operações proativas.</span>`,
        'tip.technology': `<strong>Tecnologia</strong><span class="meta">PILAR FUNDAMENTAL · CREM + CRQ + AEV</span><span class="body">Um dos três pilares fundamentais. As plataformas que operacionalizam a gestão do ciber risco em escala. Cyber Risk Exposure Management (CREM) unifica o inventário de ativos, a contextualização de ativos potencializada por IA, o <a href="https://www.researchgate.net/publication/388321083" target="_blank" rel="noopener">Cyber Risk Asset Graph</a> que mapeia as relações através da superfície de ataque, a <a href="https://www.researchgate.net/publication/388421250" target="_blank" rel="noopener">Gestão de Vulnerabilidades Baseada em Ciber Risco (RBVM)</a>, e a avaliação de exposição. A <a href="https://www.researchgate.net/publication/396206049" target="_blank" rel="noopener">Quantificação do Ciber Risco (CRQ)</a> expressa o ciber risco em termos financeiros sobre os quais os executivos podem agir, convertendo a probabilidade e o impacto em uma perda provável e um intervalo, não em uma cor. Adversarial Exposure Validation (AEV) testa as defesas contra técnicas de ataque reais para verificar se os controles realmente funcionam. Juntas, essas capacidades tornam o ciber risco mensurável, priorizável e redutível de forma contínua.</span>`,
        'tip.inventory': `<strong>Inventariar, Contextualizar e Avaliar Ativos Digitais</strong><span class="meta">ETAPA 1 · ATIVOS + CONTEXTO · CRITICIDADE</span><span class="body">O ciclo começa aqui. Identifique todos os ativos digitais, dispositivos, aplicações, dados, e especialmente identidades (frequentemente atacadas pelos cibercriminosos), e contextualize cada um dentro de seu <a href="https://www.researchgate.net/publication/388321083" target="_blank" rel="noopener">papel de negócio e dependências</a>. O contexto é o que torna a valoração significativa: o mesmo servidor pode ser periférico em uma organização e crítico para a missão em outra. O resultado é a criticidade do ativo que impulsiona cada decisão posterior de priorização; sem ela, a priorização se torna conjecturas.</span>`,
        'tip.identify': `<strong>Identificar Vulnerabilidades, Ameaças e Consequências</strong><span class="meta">ETAPA 2 · ANÁLISE DA TRÍADE · DIAGNÓSTICO</span><span class="body">Para cada ativo, analise <a href="https://www.researchgate.net/publication/388386953" target="_blank" rel="noopener">três elementos que se intersectam</a> para calcular sua pontuação de ciber risco. Vulnerabilidades: fraquezas como software sem patch, configurações incorretas, ou exposição à engenharia social. Ameaças: atores ou eventos que poderiam explorá-las, desde atacantes externos até ameaças internas. Consequências: impactos operacionais, reputacionais, legais e financeiros, ponderados pela criticidade do ativo estabelecida na etapa anterior. Onde os três convergem, isso é o ciber risco, calculado por ativo. Este é o momento diagnóstico do ciclo: sem uma análise explícita da tríade, a mitigação mira nos alvos errados, e o que parece redução de risco é apenas atividade.</span>`,
        'tip.assessment': `<strong>Avaliação, Cálculo e Priorização do Ciber Risco</strong><span class="meta">ETAPA 3 · CRI · NIST + MITRE ATT&amp;CK</span><span class="body">O ciber risco é quantificado como um <a href="https://www.researchgate.net/publication/389001302" target="_blank" rel="noopener">Índice de Ciber Risco (CRI)</a>, um valor numérico calculado usando padrões da indústria como NIST e MITRE ATT&amp;CK, informado pelo julgamento de especialistas onde os dados se esgotam. O propósito do número não é o número em si; é o ranking. Um perfil claro de ciber risco envia os recursos escassos primeiro às exposições mais significativas, em vez de distribuí-los uniformemente entre ciber riscos que nunca foram iguais.</span>`,
        'tip.mitigation': `<strong>Mitigação do Ciber Risco</strong><span class="meta">ETAPA 4 · CONTROLES · AÇÃO</span><span class="body">Implanta ações e controles, técnicos (firewalls, criptografia, segmentação) e administrativos (políticas de acesso, treinamento, resposta a incidentes), para reduzir a probabilidade ou o impacto das ameaças. Criticamente, a mitigação não é o mesmo que a <a href="https://www.researchgate.net/publication/388564202" target="_blank" rel="noopener">redução do ciber risco</a>; a redução é a diminuição mensurável da exposição uma vez que essas mitigações realmente surtem efeito.</span>`,
        'tip.recalc': `<strong>Avaliação e Recálculo do Ciber Risco</strong><span class="meta">ETAPA 5 · VERIFICAÇÃO · NÍVEIS ORG + ATIVO</span><span class="body">A etapa que a maioria dos programas pula. Após aplicar os controles, o <a href="https://www.researchgate.net/publication/389001302" target="_blank" rel="noopener">Índice de Ciber Risco (CRI)</a> é recalculado no nível da organização e no nível do ativo para verificar se cada controle realmente reduziu o ciber risco, ou apenas pareceu reduzir. O fechamento do ticket foi atividade; a queda do número é a redução. Isso também é o que mantém a organização alinhada com a velocidade do negócio e a <a href="https://www.researchgate.net/publication/398971490" target="_blank" rel="noopener">velocidade do atacante</a>, não com a velocidade da última auditoria.</span>`,
        'tip.asset': `<strong>Para Cada Ativo Digital</strong><span class="meta">POR ATIVO · DINÂMICO · COMPARTILHADO · CONTÍNUO</span><span class="body">O CRML é aplicado a cada ativo digital individualmente, o ponto onde ameaça, vulnerabilidade e consequência convergem no ciber risco. Cada dispositivo, identidade, aplicação e conexão implica um ciber risco que deve ser calculado, e na era da IA, <a href="https://www.researchgate.net/publication/406634241" target="_blank" rel="noopener">os agentes agora criam suas próprias conexões</a> através de APIs e Model Context Protocol que são, cada uma, uma nova exposição por si mesmas. O ciber risco é dinâmico, compartilhado e contínuo: evolui em tempo real, requer colaboração entre todos os atores, e exige uma reavaliação contínua em vez de instantâneos pontuais.</span>`,
        'tip.consolidate': `<strong>Consolidar Ciber Risco</strong><span class="meta">AGREGADO · VISÃO ORGANIZACIONAL · ESTRATÉGICO</span><span class="body">Todas as pontuações de ciber risco por ativo da etapa anterior são normalizadas e agregadas. A consolidação pode ser executada no nível da organização para uma visão unificada, ou em sub-níveis por grupos de ativos etiquetados (unidades de negócio, geografias, portfólios de aplicações, ou qualquer dimensão operacional) para visibilidade direcionada. Isso move a conversa de achados técnicos isolados para uma imagem holística, alinhada ao negócio, sobre a qual os executivos e membros do conselho podem agir.</span>`,
        'tip.apply': `<strong>Aplicar Defesas e Controles</strong><span class="meta">IMPLANTAR · TÉCNICO + ADMINISTRATIVO · PRIORIZADO</span><span class="body">Com base no perfil de ciber risco priorizado da etapa anterior, implante as defesas apropriadas, soluções técnicas como firewalls e criptografia, mais controles administrativos como políticas de acesso e treinamento. Os controles são escolhidos para enfrentar os ciber riscos de maior prioridade, não como uma lista de verificação universal.</span>`,
        'tip.monitoring': `<strong>Monitoramento do Ciber Risco</strong><span class="meta">CONTÍNUO · SOC + CROC · TEMPO REAL</span><span class="body">Supervisão contínua que circunda as cinco etapas e nunca para. O monitoramento do ciber risco não é um projeto, é uma postura: novos ativos aparecem, novas vulnerabilidades surgem, o panorama de ameaças muda, e um recálculo que estava correto na semana passada está incorreto hoje. O monitoramento é o que diz ao ciclo quando girar novamente. Executado por um <a href="https://www.researchgate.net/publication/388194441" target="_blank" rel="noopener">Cyber Risk Operations Center (CROC)</a> dedicado, junto com o SOC.</span>`,
      },

        'tip.crml': `<strong>サイバーリスク管理ライフサイクル（CRML）</strong><span class="meta">侵害発生前 · 戦略フレームワーク · 継続的ループ</span><span class="body">デジタル資産ごとに、侵害が起きる前の段階で回り続ける継続的なループであり、<a href="https://www.researchgate.net/publication/389628862" target="_blank" rel="noopener">サイバーセキュリティ・コンパス</a>の運用エンジンとして機能し、NIST CSF 2.0、DORA、NIS2、ISO 27001 といった成果指向のフレームワークや規制を補完します。これらのフレームワークが目的地を示すのに対し、CRML は航路と周期を与えます。すなわち、特定し、評価し、緩和し、低減を検証する。<a href="https://www.researchgate.net/publication/398971490" target="_blank" rel="noopener">攻撃者がマシンスピードで動く</a>AI の時代においては、このループもマシンスピードで回らなければなりません。ただし常に人間のガバナンスの下で。脅威、脆弱性、影響という三つの力がサイバーリスクへと収束し、CRML はそれをデジタル資産ごとに、侵害が起きる前に適用します。</span><span class="quote">「<a href="https://www.researchgate.net/publication/388653064" target="_blank" rel="noopener">定義されないものは測定できない。測定されないものは改善できない。改善されないものは、常に劣化する。</a>」</span>`,
        'tip.people': `<strong>人材</strong><span class="meta">基盤の柱 · 文化 · サイバーリスクハンター</span><span class="body">サイバーセキュリティを支える三つの基盤の柱の一つ。人的要素、セキュリティ意識向上、トレーニング、組織文化を包含します。加えて、組織がどこから侵害され得るのかを問う専任の<a href="https://www.researchgate.net/publication/395721548" target="_blank" rel="noopener">サイバーリスクハンター</a>が含まれ、すでに侵害されているのかを問うスレットハンターと相互に補完し合います。</span>`,
        'tip.process': `<strong>プロセス</strong><span class="meta">基盤の柱 · CYBERRISKOPS · CROC + CROM</span><span class="body">三つの基盤の柱の一つ。CRML そのものを含め、サイバーセキュリティの実践方法を構造化するポリシー、手順、方法論です。先進的なプログラムはこれを<a href="https://www.researchgate.net/publication/402149983" target="_blank" rel="noopener">CyberRiskOps</a>によって運用に落とし込みます。CyberRiskOps は、サイバーリスクの評価と<a href="https://www.researchgate.net/publication/388564202" target="_blank" rel="noopener">サイバーリスクの低減</a>を単一のループに統合する継続的かつ適応的なプロセスであり、リスクを特定することと実際に低減することのあいだに従来存在してきた断絶を解消します。CyberRiskOps は専任の<a href="https://www.researchgate.net/publication/388194441" target="_blank" rel="noopener">Cyber Risk Operations Center（CROC）</a>が実行し、侵害発生前の段階で継続的にエクスポージャーを探索して低減を推進します。一方 SOC はすでに起きている事象に対応します。<a href="https://www.researchgate.net/publication/390490235" target="_blank" rel="noopener">Cyber Risk Operational Model（CROM）</a>は、静的なリスクマッピングから能動的なオペレーションへとプログラムを進化させる成熟度の道筋を示します。</span>`,
        'tip.technology': `<strong>テクノロジー</strong><span class="meta">基盤の柱 · CREM + CRQ + AEV</span><span class="body">三つの基盤の柱の一つ。サイバーリスク管理を大規模に運用可能にするプラットフォーム群です。Cyber Risk Exposure Management（CREM）は、資産インベントリ、AI による資産の文脈付け、攻撃対象領域全体の関係性を可視化する<a href="https://www.researchgate.net/publication/388321083" target="_blank" rel="noopener">Cyber Risk Asset Graph</a>、<a href="https://www.researchgate.net/publication/388421250" target="_blank" rel="noopener">リスクベース脆弱性管理（RBVM）</a>、そしてエクスポージャー評価を統合します。<a href="https://www.researchgate.net/publication/396206049" target="_blank" rel="noopener">サイバーリスクの定量化（CRQ）</a>は、発生可能性と影響を色ではなく想定損失額とその幅に変換し、経営層が判断できる財務言語でサイバーリスクを表現します。Adversarial Exposure Validation（AEV）は実際の攻撃手法に対して防御を試し、統制が本当に機能しているかを検証します。これらが揃うことで、サイバーリスクは測定可能で、優先順位付けが可能で、継続的に低減できるものになります。</span>`,
        'tip.inventory': `<strong>デジタル資産の棚卸し、文脈付けと価値評価</strong><span class="meta">ステージ 1 · 資産 + 文脈 · 重要度</span><span class="body">ライフサイクルはここから始まります。すべてのデジタル資産、すなわち端末、アプリケーション、データ、そしてとくにサイバー犯罪者が狙いやすいアイデンティティを洗い出し、それぞれを<a href="https://www.researchgate.net/publication/388321083" target="_blank" rel="noopener">業務上の役割と依存関係</a>のなかに位置づけます。価値評価が意味を持つのは文脈があるからです。同じサーバーが、ある組織では周辺的でも、別の組織ではミッションクリティカルになり得ます。ここで得られる資産の重要度が、以降のすべての優先順位判断を左右します。それがなければ、優先順位付けは当て推量になります。</span>`,
        'tip.identify': `<strong>脆弱性、脅威、そして影響の特定</strong><span class="meta">ステージ 2 · トライアド分析 · 診断</span><span class="body">資産ごとに<a href="https://www.researchgate.net/publication/388386953" target="_blank" rel="noopener">交差する三つの要素</a>を分析し、そのサイバーリスクスコアを算定します。脆弱性、すなわち未修正のソフトウェア、設定不備、ソーシャルエンジニアリングへの露出といった弱点。脅威、すなわち外部の攻撃者から内部不正までの、それを悪用し得る行為者や事象。影響、すなわち前段で定めた資産の重要度で重み付けされた、業務、レピュテーション、法務、財務への影響。この三つが交わるところがサイバーリスクであり、資産単位で算定されます。ここはライフサイクルの診断の瞬間です。トライアドを明示的に分析しなければ、低減策は誤った的を狙い、リスク低減に見えるものは単なる活動にすぎません。</span>`,
        'tip.assessment': `<strong>サイバーリスクの評価、算定と優先順位付け</strong><span class="meta">ステージ 3 · CRI · NIST + MITRE ATT&amp;CK</span><span class="body">サイバーリスクは<a href="https://www.researchgate.net/publication/389001302" target="_blank" rel="noopener">サイバーリスク指標（CRI）</a>として定量化されます。これは NIST や MITRE ATT&amp;CK といった業界標準を用いて算定される数値であり、データが尽きる領域では専門家の判断で補われます。重要なのは数値そのものではなく、順位です。明確なサイバーリスクプロファイルは、限られたリソースを最も重大なエクスポージャーへ先に振り向けます。もとより等しくないサイバーリスクに、均等に配分するのではなく。</span>`,
        'tip.mitigation': `<strong>サイバーリスクの緩和</strong><span class="meta">ステージ 4 · 統制 · 実行</span><span class="body">脅威の発生可能性または影響を下げるために、技術的な対策（ファイアウォール、暗号化、セグメンテーション）と管理的な対策（アクセスポリシー、教育、インシデント対応）を実行します。重要な点として、緩和策の実施は<a href="https://www.researchgate.net/publication/388564202" target="_blank" rel="noopener">サイバーリスクの低減</a>と同じではありません。低減とは、その緩和策が実際に効いた結果として測定できるエクスポージャーの減少です。</span>`,
        'tip.recalc': `<strong>サイバーリスクの再評価と再算定</strong><span class="meta">ステージ 5 · 検証 · 組織 + 資産レベル</span><span class="body">ほとんどのプログラムが飛ばしてしまうステージです。統制を適用したあと、<a href="https://www.researchgate.net/publication/389001302" target="_blank" rel="noopener">サイバーリスク指標（CRI）</a>を組織レベルと資産レベルで再算定し、各統制が本当にサイバーリスクを下げたのか、それとも下げたように見えただけなのかを検証します。チケットを閉じたのは活動であり、数値が下がったことが低減です。これはまた、組織を最後の監査の速度ではなく、ビジネスの速度と<a href="https://www.researchgate.net/publication/398971490" target="_blank" rel="noopener">攻撃者の速度</a>に合わせ続けるための要でもあります。</span>`,
        'tip.asset': `<strong>デジタル資産ごとに</strong><span class="meta">資産単位 · 動的 · 共有される · 継続的</span><span class="body">CRML はすべてのデジタル資産に個別に適用されます。そこが脅威、脆弱性、影響がサイバーリスクへと収束する点です。あらゆる端末、アイデンティティ、アプリケーション、接続がサイバーリスクを内包し、それは算定されなければなりません。AI の時代においては、<a href="https://www.researchgate.net/publication/406634241" target="_blank" rel="noopener">エージェントが自ら接続を作り出し</a>、API や Model Context Protocol を通じたその一つ一つが新たなエクスポージャーになります。サイバーリスクは動的で、共有され、継続的です。リアルタイムに変化し、すべての関係者の協調を必要とし、ある時点のスナップショットではなく継続的な再評価を要求します。</span>`,
        'tip.consolidate': `<strong>サイバーリスクの統合</strong><span class="meta">集約 · 組織全体のビュー · 戦略的</span><span class="body">前段で算定した資産ごとのサイバーリスクスコアを正規化し、集約します。統合は、全体を一つのビューで見るために組織レベルで行うこともでき、タグ付けした資産グループ（事業部門、地域、アプリケーションポートフォリオ、その他あらゆる運用上の切り口）ごとのサブレベルで行い、狙いを定めた可視性を得ることもできます。これにより、議論は孤立した技術的な検出結果から、経営層や取締役会が意思決定できる、ビジネスに紐づいた全体像へと移ります。</span>`,
        'tip.apply': `<strong>防御策と統制の適用</strong><span class="meta">展開 · 技術的 + 管理的 · 優先順位付け</span><span class="body">前段で得た優先順位付きのサイバーリスクプロファイルに基づき、適切な防御を展開します。ファイアウォールや暗号化といった技術的ソリューションに加え、アクセスポリシーや教育といった管理的統制です。統制は画一的なチェックリストとしてではなく、最も優先度の高いサイバーリスクに対処するために選ばれます。</span>`,
        'tip.monitoring': `<strong>サイバーリスクの監視</strong><span class="meta">継続的 · SOC + CROC · リアルタイム</span><span class="body">五つのステージを取り囲み、決して止まらない継続的な観測です。サイバーリスクの監視はプロジェクトではなく、姿勢です。新しい資産が現れ、新しい脆弱性が浮上し、脅威の様相は移り変わり、先週正しかった再算定は今日には誤りになります。監視は、ループをいつ次へ回すべきかを教えるものです。SOC と並んで、専任の<a href="https://www.researchgate.net/publication/388194441" target="_blank" rel="noopener">Cyber Risk Operations Center（CROC）</a>が担います。</span>`,
      }
    };

    let _currentLang = 'en';
    // Visibility checks tied to the SVG SMIL clock (NOT wall-clock).

    // (different files use different begin times: 10s, 12s, 30s, etc).
    function _svgRoot() {
      return document.querySelector('.stage svg') || document.querySelector('svg');
    }
    function _animBeginSec(animEl, fallback) {
      if (!animEl) return fallback;
      var s = (animEl.getAttribute('begin') || '').trim();
      // Accept formats like "30s", "30", "10s", etc. — strip trailing 's'.
      if (s.endsWith('s')) s = s.slice(0, -1);
      var n = parseFloat(s);
      return isNaN(n) ? fallback : n;
    }
    function _compassVisible() {
      var svg = _svgRoot();
      if (!svg || typeof svg.getCurrentTime !== 'function') {
        // Fallback: read live opacity (flaky but better than nothing)
        var g = document.getElementById('lr-compass');
        return g ? parseFloat(getComputedStyle(g).opacity) > 0.5 : false;
      }
      var anim = document.querySelector('#lr-compass > animate[attributeName="opacity"]');
      var beginSec = _animBeginSec(anim, 30);

    }

      var svg = _svgRoot();
      var venn = document.getElementById('venn-pulse-group');
      if (!venn || !venn.parentElement) return false;
      if (!svg || typeof svg.getCurrentTime !== 'function') {
        return parseFloat(getComputedStyle(venn.parentElement).opacity) > 0.5;

      var beginSec = _animBeginSec(anim, 12);

    // Each handler queries _compassVisible() at call time, so the gate is always

    (function watchCompassReady() {

    const LABEL_GEOM = {

html,body{background:#000;height:100%;}
@keyframes waveDrift{from{background-position:0 0,0 0;}to{background-position:1200px 0,-900px 0;}}
@keyframes hazeFloat{0%{transform:translate3d(-2%,0,0) scale(1.05);}50%{transform:translate3d(2%,-1%,0) scale(1.09);}100%{transform:translate3d(-2%,0,0) scale(1.05);}}
#wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}
#stage{position:relative;width:min(96vw,96vh);aspect-ratio:1/1;overflow:hidden;background:#0a0c0e;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6);}
.bg1{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 16%,#22262c 0%,#14171b 38%,#0a0c0e 70%,#050607 100%);}
.bg2{position:absolute;inset:0;opacity:.55;background:linear-gradient(180deg,rgba(40,46,54,0) 42%,rgba(58,68,80,.22) 72%,rgba(7,9,11,.92) 100%);}
.bg3{position:absolute;left:-10%;top:-12%;width:120%;height:66%;opacity:.4;background:radial-gradient(60% 80% at 30% 40%,rgba(124,134,144,.18),transparent 60%),radial-gradient(50% 70% at 76% 28%,rgba(92,102,112,.16),transparent 60%);animation:hazeFloat 26s ease-in-out infinite;}
.bg4{position:absolute;left:0;right:0;bottom:0;height:48%;opacity:.16;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 14px);background-size:1200px 100%,900px 100%;animation:waveDrift 18s linear infinite;mix-blend-mode:screen;}
.bg5{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(4,5,7,.62) 32%,rgba(4,5,7,.2) 56%,rgba(4,5,7,0) 70%);}
#compass-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
/* UI overlays */
#lang-bar{position:absolute;top:10px;right:10px;z-index:100;display:flex;gap:4px;align-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 6px;}
#lang-bar button{padding:3px 9px;border-radius:5px;border:none;cursor:pointer;font-weight:600;font-size:10px;font-family:Inter,system-ui,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;transition:all .2s;letter-spacing:.04em;}
#compass-title{position:absolute;top:12px;left:14px;z-index:100;font-family:Inter,Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:clamp(16px,3.2vmin,35px);font-weight:600;color:#fff;letter-spacing:.2px;pointer-events:none;}
#credit{position:absolute;bottom:10px;left:12px;z-index:100;font-family:Inter,Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.04em;line-height:1.6;pointer-events:auto;}
#pub-link{position:absolute;bottom:10px;right:12px;z-index:100;font-family:Inter,Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:8px;color:rgba(255,255,255,.35);letter-spacing:.03em;line-height:1.6;text-align:right;max-width:52%;pointer-events:auto;}
/* Tooltip */
#tt{position:absolute;pointer-events:none;z-index:300;opacity:0;transition:opacity .2s ease;width:285px;background:rgba(8,10,12,.94);border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:14px 16px;backdrop-filter:blur(12px);}
#tt.on{opacity:1;}
#tt-h{font-family:Inter,Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#E01C24;margin-bottom:4px;}
#tt-s{font-family:Inter,Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:9px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:10px;}
#tt-b{font-family:Inter,Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:11px;line-height:1.7;color:rgba(255,255,255,.78);}
/* Hit areas */
#hits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;}
#hits path{pointer-events:all;cursor:pointer;fill:transparent;}

/* injected overrides for embedded use */
html,body,#wrap,#stage{background:transparent !important;}
#stage{box-shadow:none !important;}
.bg1,.bg2,.bg3,.bg4,.bg5{display:none !important;}
#lang-bar{display:none !important;}
html[lang="ja"] #compass-title{font-size:clamp(20px,4.3vmin,46px);letter-spacing:0.02em;}
#compass-title{left:0 !important; right:0 !important; text-align:center !important; font-size:clamp(26px,5.2vmin,58px) !important; font-weight:700 !important; letter-spacing:0.5px !important; text-shadow: 0 0 18px rgba(0,0,0,1), 0 0 42px rgba(0,0,0,0.95), 0 0 80px rgba(0,0,0,0.85), 0 0 130px rgba(0,0,0,0.6) !important;}
</style>

  <div id="tt" class="" style="left: 732.203px; top: 160.203px;"><div id="tt-h">Gestión del Ciber Riesgo</div><div id="tt-s">Antes de una Brecha · Proactivo y Predictivo</div><div id="tt-b">El norte verdadero de tu brújula de ciberseguridad. Sin él, las organizaciones derivan de crisis en crisis, reaccionando, recuperándose, sin reducir nunca el riesgo de forma real. La Gestión del Ciber Riesgo es la disciplina proactiva y predictiva que anticipa las amenazas antes de que se materialicen, prioriza lo que más importa, optimiza las inversiones en seguridad y da a los ejecutivos un lenguaje claro para tomar decisiones estratégicas. Los ciberdelincuentes no solo buscan vulnerabilidades técnicas. Buscan la incertidumbre y la indecisión que genera no tener un norte. Esto es lo que cierra esa brecha.</div></div>

  lang=l;

  Object.entries(IDS).forEach(([k,id])=>{
    const el=document.getElementById(id);
    if(el) el.textContent=t[k];
    else console.warn('Missing element:',id);
  });
  document.getElementById('compass-title').textContent=t.title;
  document.getElementById('credit').innerHTML=t.credit+'<br><a href="https://www.linkedin.com/in/jpcastro/" target="_blank" style="color:rgba(255,255,255,.5);text-decoration:none;">Juan Pablo Castro Vilaró</a>';
  // Line1 stays on its own line; line2 follows on same line if space allows,
  // otherwise breaks cleanly below line1 (never mid-word)
  document.getElementById('pub-link').innerHTML=
    '<a href="'+t.pubUrl+'" target="_blank" style="color:rgba(255,255,255,.45);text-decoration:none;display:block;margin-bottom:3px;">'+
      '<span style="display:inline;white-space:nowrap;">'+t.pubLine1+'</span> '+
      '<span style="display:inline;white-space:nowrap;">'+t.pubLine2+'</span>'+
    '</a>'+
    '<a href="'+t.pubDoiUrl+'" target="_blank" style="color:rgba(255,255,255,.28);text-decoration:none;">DOI: '+t.pubDoi+'</a>';
  ['en','es','pt','ja'].forEach(c=>{
    const b=document.getElementById('btn-'+c);
    if(!b) return;
    b.style.background=c===l?'#E01C24':'rgba(255,255,255,0.1)';
    b.style.color=c===l?'#fff':'#888';
  });
  document.documentElement.lang=l;
}

    // mutation is unreliable across browsers. We keep the original stepped

    // every 16-second cycle boundary.
    (function () {
      const needle = document.getElementById('lr-needle');
      if (!needle) return;
      const TIMES   = [0, 0.19, 0.205, 0.42, 0.435, 0.65, 0.665, 0.88, 0.895, 1];
      const CW      = [0, 430, 430, 920, 920, 1390, 1390, 1940, 1940, 2160];

        [0.00, 0.00, 1.00, 1.00], // pause (linear, no movement anyway)
        [0.30, 0.10, 0.20, 1.00],
        [0.00, 0.00, 1.00, 1.00],
        [0.22, 0.10, 0.18, 1.00],
        [0.00, 0.00, 1.00, 1.00],
        [0.30, 0.10, 0.20, 1.00],
        [0.00, 0.00, 1.00, 1.00],

          u -= (cx - t) / dx;
          if (u < 0) u = 0; else if (u > 1) u = 1;

        return 3*(1-u)*(1-u)*u*y1 + 3*(1-u)*u*u*y2 + u*u*u;
